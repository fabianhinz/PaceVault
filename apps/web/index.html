<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Offline-first endurance training tracker" />
    <!-- see --color-surface-base in packages/ui/src/theme.css; the script below sets it per theme -->
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      Applies the theme before first paint. Mirrors resolveTheme in src/lib/theme/theme.ts
      (localStorage 'pacevault-theme': 'system' | 'light' | 'dark', anything else means 'system').
    -->
    <script>
      (() => {
        let preference = 'system';
        try {
          const stored = localStorage.getItem('pacevault-theme');
          if (stored === 'light' || stored === 'dark') preference = stored;
        } catch {}
        let theme = preference;
        if (preference === 'system') {
          theme = 'light';
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        }
        document.documentElement.dataset.theme = theme;
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').content = '#ffffff';
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content =
            'default';
        }
      })();
    </script>

    <title>PaceVault</title>
  </head>
  <style>
    body {
      background-color: #030712;
    }
    html[data-theme='light'] body {
      background-color: #ffffff;
    }
  </style>
  <body class="text-text-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
