<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stat Cell Layout</title>
<style>
:root {
  --bg: #0b0d12;
  --panel: #14171e;
  --line: #2a2f3a;
  --text: #e5e7eb;
  --muted: #8b8f9a;
  --faint: #5c616e;
  --accent: #60a5fa;
  --warn: #f59e0b;
  --good: #4ade80;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 12px/1.35 ui-sans-serif, system-ui, sans-serif; }
code, pre { font: 10.5px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; }
.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 14px; margin: 0; font-weight: 600; }
header .hint { color: var(--muted); }
.tabs { display: flex; gap: 4px; }
.tabs button { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
.tabs button.on { background: #ffffff14; color: var(--text); border-color: #ffffff33; }
.tabs button .rec { color: var(--good); font-weight: 600; }
main { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 16px; padding: 12px 16px; min-height: 0; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-content: start; min-height: 0; }
.cell { border: 1px solid #ffffff1f; background: #ffffff08; border-radius: 10px; padding: 6px; min-width: 0; }
.cell > .name { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; display: flex; justify-content: space-between; }
.cell > .name b { color: var(--warn); font-weight: 600; }
.b { border: 1px dashed #ffffff30; border-radius: 4px; padding: 2px; display: flex; flex-wrap: wrap; gap: 2px; min-width: 0; align-items: center; overflow: hidden; }
.b.wrap > i { flex-basis: 100%; }
.b.col { flex-direction: column; align-items: stretch; }
.b.grid3 { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto; gap: 2px; }
.b.grid3 > .span2, .b.grid3 > i { grid-column: 1 / -1; }
.b.red { border-color: #f8717188; background: #f8717110; }
.b.new { border-color: #4ade8088; }
.b > i { font-style: normal; font-size: 8.5px; color: var(--faint); white-space: nowrap; flex-shrink: 0; }
.b.red > i { color: #f87171; }
.t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t.title { font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.t.val { font-size: 13px; font-weight: 700; }
.t.val small { font-size: 9px; font-weight: 400; color: var(--muted); margin: 0 2px; }
.t.note { font-size: 10px; color: var(--faint); margin-left: auto; }
.t.note.big { font-size: 13px; color: var(--text); font-weight: 700; }
.info { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--faint); display: inline-block; flex-shrink: 0; }
.mark { background: #ffffff26; border-radius: 2px; }
.meter { height: 4px; flex: 1; background: #ffffff1a; border-radius: 2px; position: relative; }
.meter::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 55%; background: #ffffff55; border-radius: 2px; }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 18px; flex: 1; }
.bars span { flex: 1; background: #ffffff40; border-radius: 1px; }
.segs { display: flex; height: 8px; flex: 1; border-radius: 2px; overflow: hidden; }
.segs span { background: #ffffff30; border-right: 1px solid var(--bg); }
.side { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); gap: 8px; min-height: 0; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.card h2 { margin: 0 0 4px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; justify-content: space-between; }
pre { margin: 0; white-space: pre; overflow: hidden; color: #cbd5e1; }
table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
th, td { text-align: left; padding: 2px 4px; border-bottom: 1px solid #ffffff10; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
th { color: var(--muted); font-weight: 500; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.down { color: var(--good); }
.verdict { color: var(--muted); font-size: 11px; }
.verdict b { color: var(--text); }
.legend { display: flex; gap: 10px; color: var(--muted); font-size: 10px; align-items: center; }
.legend span { display: inline-flex; gap: 4px; align-items: center; }
.sw { width: 14px; height: 10px; border: 1px dashed #ffffff30; border-radius: 2px; display: inline-block; }
.sw.red { border-color: #f8717188; background: #f8717110; }
.sw.new { border-color: #4ade8088; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>More stats · one unified cell layout</h1>
    <div class="tabs" id="tabs"></div>
    <div class="legend">
      <span><i class="sw"></i>element</span>
      <span><i class="sw red"></i>redundant today</span>
      <span><i class="sw new"></i>new / changed</span>
    </div>
    <span class="hint">Wireframe only · counts = layout wrappers per cell (text, chart marks and the 5 hit targets excluded)</span>
  </header>
  <main>
    <section class="grid" id="grid"></section>
    <aside class="side" id="side"></aside>
  </main>
</div>
<script>
const CELLS = [
  { id: 'calories', title: 'Calories', value: '1,590', unit: 'kcal', note: '±15 %', chart: 'meter' },
  { id: 'moving', title: 'Moving time', value: '3:15:24', note: '/ 3:17:29', chart: 'pair' },
  { id: 'intensity', title: 'Intensity', lead: 'IF', value: '0.59', note: 'VI 1.05', noteBig: true, chart: 'meter' },
  { id: 'peaks', title: 'Peak power', value: '128', unit: 'W', note: '20 min', chart: 'bars' },
  { id: 'step', title: 'Step length', value: '1.05', unit: 'm', note: '160 spm', chart: 'none' },
  { id: 'zones', title: 'HR zones', value: 'Z2', note: '57 %', chart: 'zones' },
  { id: 'decoupling', title: 'Decoupling', value: '7.3', unit: '%', note: 'Drifting', chart: 'meter' },
];

const b = (label, inner, cls = '') => `<div class="b ${/col|grid3/.test(cls) ? 'wrap' : ''} ${cls}"><i>${label}</i>${inner}</div>`;
const title = (c) => `<span class="t title">${c.title}</span>`;
const value = (c) => `<span class="t val">${c.lead ? `<small>${c.lead}</small>` : ''}${c.value}${c.unit ? `<small>${c.unit}</small>` : ''}</span>`;
const note = (c) => `<span class="t note ${c.noteBig ? 'big' : ''}">${c.note}</span>`;
const info = '<span class="info"></span>';
const meter = '<span class="meter"></span>';
const bars = `<span class="bars">${[18, 14, 12, 9, 8].map((h) => `<span style="height:${h}px"></span>`).join('')}</span>`;
const segs = `<span class="segs">${[6, 46, 30, 14, 4].map((w) => `<span style="width:${w}%"></span>`).join('')}</span>`;
const pairText = '<span class="t note" style="margin:0">⟿ 12:56</span><span class="t note">⏸ 2:05</span>';

const metricLabel = (redundantInner) =>
  b('MetricLabel span', `${b('empty span', '', redundantInner ? 'red' : '')}${info}`);

const todayChart = (c) => {
  if (c.chart === 'meter') return b('MeterBar div h-8', meter, 'red');
  if (c.chart === 'bars') return b('rail div h-8', b('PeakBars div h-8', bars), 'red');
  if (c.chart === 'zones') return b('rail div h-4', b('track div', segs), 'red');
  if (c.chart === 'pair') return b('StatPair div', b('p', b('IconFact span', '<span class="t note" style="margin:0">⟿ 12:56</span>')) + b('p', b('IconFact span', '<span class="t note" style="margin:0">⏸ 2:05</span>')));
  return '';
};

const newChart = (c) => {
  if (c.chart === 'meter') return b('MeterBar = track', meter, 'new');
  if (c.chart === 'bars') return b('PeakBars + rail props', bars, 'new');
  if (c.chart === 'zones') return b('zone track + rail props', segs, 'new');
  if (c.chart === 'pair') return b('flex pair', pairText, 'new');
  return '';
};

const OPTIONS = {
  today: {
    tab: 'Today',
    api: `<StatCell
  stat="calories" label="Calories" metricId="calories"
  relatedMetricIds?={…} active?={…}
  info1={<StatValue value unit lead />}
  info2={<StatCaption>±15 %</StatCaption>}
  chart={<MeterBar … />}
/>`,
    dom: `div.tile p-3                        StatCell.tsx:55
└ div flex-col h-[84px]              :56
  ├ div flex row h-4                 :57
  │ ├ Typography overline            :58
  │ └ span.shrink-0                  :67   redundant
  │   └ MetricLabel span › empty span + Button
  ├ div flex row h-7 baseline        :76
  │ ├ Typography h3 (info1)          :77
  │ └ div flex-1 text-right          :80   redundant
  │   └ StatCaption p / h3 p (intensity)
  └ div flex h-8 items-center        :82
    └ chart root (own h-8 wrapper again)`,
    counts: { calories: 10, moving: 12, intensity: 11, peaks: 11, step: 9, zones: 11, decoupling: 10 },
    map: [
      ['Calories', 'info1 StatValue · info2 StatCaption', 'MeterBar'],
      ['Moving time', 'info1 bare string · info2 StatCaption', 'StatPair › IconFact ×2'],
      ['Intensity', 'info1 StatValue lead · info2 own h3', 'MeterBar'],
      ['Peak power', 'via PeakPowerCell', 'rail div › PeakBars'],
      ['Step length', 'info1 StatValue · info2 StatCaption', '(empty slot)'],
      ['HR zones', 'via HrZonesCell', 'rail div › track › segments'],
      ['Decoupling', 'info1 StatValue · info2 StatCaption', 'MeterBar'],
    ],
    verdict: '<b>9 wrappers before any content.</b> Three nested 32 px containers for peak bars, a span around MetricLabel, a div around every info2 caption, and intensity breaks the pattern with its own h3.',
    render: (c) => b('div.tile', b('flex-col h-84',
      b('row h-4', `${title(c)}${b('span.shrink-0', metricLabel(true), 'red')}`) +
      b('row h-7', `${b('p.h3', value(c))}${b('div flex-1', c.noteBig ? b('p.h3 (own)', note(c), 'red') : b('StatCaption p', note(c)), 'red')}`) +
      b('row h-8', todayChart(c) || '<span class="t note" style="margin:0">—</span>'),
    'col'), 'col'),
  },
  a: {
    tab: '(a) reuse StatItem',
    api: `// components/ui/StatItem.tsx:6-12 today:
//   label, value, unit?, metricId?, subDetail?
<div className={cn(tileClass, 'p-3')}>
  <StatItem
    label="Calories" metricId="calories"
    value="1,590" unit="kcal"
    aside="±15 %"            // new
    subDetail={<MeterBar …/>} // becomes fixed h-8 slot
  />
</div>`,
    dom: `div.tile p-3 (caller, like CardGrid.tsx:48)
└ StatItem div h-[84px] (was space-y h-[80px])
  ├ div flex row: overline | MetricLabel
  │ └ MetricLabel span › empty span + Button
  ├ div flex row baseline           new
  │ ├ Typography h3 value + unit
  │ └ Typography caption aside      new
  └ div h-8 subDetail slot           fixed`,
    counts: { calories: 7, moving: 8, intensity: 7, peaks: 8, step: 7, zones: 8, decoupling: 7 },
    map: [
      ['Calories', 'value 1,590 · unit kcal · aside ±15 %', 'subDetail MeterBar'],
      ['Moving time', 'value 3:15:24 · aside / 3:17:29', 'subDetail pair'],
      ['Intensity', 'value IF 0.59 · aside VI 1.05 (big?)', 'subDetail MeterBar'],
      ['Peak power', 'value 128 · unit W · aside 20 min', 'subDetail PeakBars'],
      ['Step length', 'value 1.05 · unit m · aside 160 spm', '(empty)'],
      ['HR zones', 'value Z2 · aside 57 %', 'subDetail zone track'],
      ['Decoupling', 'value 7.3 · unit % · aside Drifting', 'subDetail MeterBar'],
    ],
    verdict: '<b>Closest existing shape</b> (label | ⓘ, h3 value + unit, sub line). Needs <code>aside</code>, <code>lead</code>, <code>active</code>, <code>relatedMetricIds</code>, a fixed sub slot and iconOnly ⓘ. Every change also lands in Trip and Route stat grids.',
    render: (c) => b('div.tile (caller)', b('StatItem h-84',
      b('row', `${title(c)}${metricLabel(true)}`) +
      b('row baseline', `${b('p.h3', value(c))}${b('aside', note(c), 'new')}`, 'new') +
      b('subDetail h-8', newChart(c) || '<span class="t note" style="margin:0">—</span>'),
    'col'), 'col'),
  },
  b: {
    tab: '(b) minimal StatTile',
    api: `<StatTile
  title="Calories" metricId?="calories"
  subtitle={<Reading value="1,590" unit="kcal"
                     note="±15 %" />}
>
  <MeterBar … />
</StatTile>`,
    dom: `div.tile flex-col h fixed            tile + column merged
├ div flex row h-4: title | MetricLabel
│ └ MetricLabel span › empty span + Button
├ div h-7 [subtitle]
│ └ Reading: div flex baseline: value | note
└ div h-8 [children]`,
    counts: { calories: 7, moving: 8, intensity: 7, peaks: 8, step: 7, zones: 8, decoupling: 7 },
    map: [
      ['Calories', 'subtitle Reading 1,590 kcal | ±15 %', 'children MeterBar'],
      ['Moving time', 'subtitle Reading 3:15:24 | / 3:17:29', 'children pair'],
      ['Intensity', 'subtitle Reading IF 0.59 | VI 1.05', 'children MeterBar'],
      ['Peak power', 'subtitle Reading 128 W | 20 min', 'children PeakBars'],
      ['Step length', 'subtitle Reading 1.05 m | 160 spm', '(none)'],
      ['HR zones', 'subtitle Reading Z2 | 57 %', 'children zone track'],
      ['Decoupling', 'subtitle Reading 7.3 % | Drifting', 'children MeterBar'],
    ],
    verdict: '<b>The API the owner remembered.</b> Simple, but <code>subtitle: ReactNode</code> leaves line 2 to each cell, so a second helper (Reading) is needed to keep the value line uniform.',
    render: (c) => b('StatTile flex-col',
      b('row h-4', `${title(c)}${metricLabel(true)}`) +
      b('subtitle h-7', b('Reading flex', `${value(c)}${note(c)}`, 'new')) +
      b('children h-8', newChart(c) || '<span class="t note" style="margin:0">—</span>'),
    'col new'),
  },
  c: {
    tab: '(c) grid areas',
    rec: true,
    api: `<StatTile
  title="Calories" metricId="calories"
  relatedMetricIds?={…} active?={…}
  value="1,590" unit?="kcal" lead?="IF"
  note?="±15 %"
>
  <MeterBar … />   // line 3, optional
</StatTile>`,
    dom: `div.tile grid                        one element
  rows 16px / 28px / 32px, cols 1fr auto
  areas "title info" "value note" "chart chart"
├ Typography overline   → title
├ MetricLabel (className) → info
├ Typography h3 value   → value (baseline)
├ Typography caption    → note  (baseline)
└ children root         → chart (spans 2)`,
    counts: { calories: 3, moving: 4, intensity: 3, peaks: 4, step: 3, zones: 4, decoupling: 3 },
    map: [
      ['Calories', 'value 1,590 · unit kcal · note ±15 %', 'MeterBar'],
      ['Moving time', 'value 3:15:24 · note / 3:17:29', 'pair (one flex)'],
      ['Intensity', 'lead IF · value 0.59 · note VI 1.05', 'MeterBar'],
      ['Peak power', 'value 128 · unit W · note 20 min', 'PeakBars (rail props)'],
      ['Step length', 'value 1.05 · unit m · note 160 spm', '—'],
      ['HR zones', 'value Z2 · note 57 %', 'zone track (rail props)'],
      ['Decoupling', 'value 7.3 · unit % · note Drifting', 'MeterBar'],
    ],
    verdict: '<b>Recommended.</b> One grid element carries the whole anatomy: fixed rows keep every cell the same size, row 2 shares a baseline without a flex wrapper, and chart roots sit straight in the chart area. The 3rd wrapper is MetricLabel’s empty label span (2 if iconOnly skips it).',
    render: (c) => b('StatTile grid 16/28/32',
      `${title(c)}${b('MetricLabel', `${b('empty span', '', 'red')}${info}`)}` +
      `${value(c)}${note(c)}` +
      `<div class="span2" style="display:flex;min-height:20px;align-items:center">${newChart(c) || '<span class="t note" style="margin:0">—</span>'}</div>`,
    'grid3 new'),
  },
};

const state = { option: 'c' };

const renderTabs = () => {
  document.getElementById('tabs').innerHTML = Object.entries(OPTIONS)
    .map(([key, o]) => `<button type="button" data-opt="${key}" class="${state.option === key ? 'on' : ''}">${o.tab}${o.rec ? ' <span class="rec">· recommended</span>' : ''}</button>`)
    .join('');
};

const renderGrid = () => {
  const o = OPTIONS[state.option];
  const base = OPTIONS.today.counts;
  document.getElementById('grid').innerHTML = CELLS.map((c) => `<div class="cell">
    <div class="name"><span>${c.title}</span><span>${o.counts[c.id]} wrappers${state.option === 'today' ? '' : ` <b>(today ${base[c.id]})</b>`}</span></div>
    ${o.render(c)}
  </div>`).join('');
};

const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const renderSide = () => {
  const o = OPTIONS[state.option];
  const base = OPTIONS.today.counts;
  const total = (counts) => Object.values(counts).reduce((a, n) => a + n, 0);
  document.getElementById('side').innerHTML = `
    <div class="card"><h2><span>Component API</span><span>${o.tab}</span></h2><pre>${esc(o.api)}</pre></div>
    <div class="card"><h2><span>DOM it renders</span></h2><pre>${esc(o.dom)}</pre></div>
    <div class="card"><h2><span>Cell mapping</span></h2>
      <table><colgroup><col style="width:22%"><col style="width:50%"><col style="width:28%"></colgroup>
      <tr><th>Cell</th><th>line 2</th><th>line 3</th></tr>
      ${o.map.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
      </table></div>
    <div class="card"><h2><span>Wrappers per cell</span><span>total ${total(o.counts)} vs today ${total(base)}</span></h2>
      <table><tr><th></th>${CELLS.map((c) => `<th style="text-align:right">${c.title.split(' ')[0]}</th>`).join('')}</tr>
      <tr><td>today</td>${CELLS.map((c) => `<td class="num">${base[c.id]}</td>`).join('')}</tr>
      ${state.option === 'today' ? '' : `<tr><td>${o.tab.split(' ')[0]}</td>${CELLS.map((c) => `<td class="num ${o.counts[c.id] < base[c.id] ? 'down' : ''}">${o.counts[c.id]}</td>`).join('')}</tr>`}</table>
      <p class="verdict">${o.verdict}</p></div>`;
};

const render = () => { renderTabs(); renderGrid(); renderSide(); };

document.addEventListener('click', (event) => {
  const btn = event.target.closest('[data-opt]');
  if (!btn) return;
  state.option = btn.dataset.opt;
  render();
});

render();
</script>
</body>
</html>
