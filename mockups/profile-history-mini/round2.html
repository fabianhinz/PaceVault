<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thresholds And History</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style type="text/tailwindcss">
@theme {
  --color-gray-300: #b0b4be;
  --color-surface-base: #030712;
  --color-surface: #111318;
  --color-text-primary: #e5e7eb;
  --color-text-secondary: #b0b4be;
  --color-text-tertiary: #8b8f9a;
  --color-text-quaternary: #5c616e;
  --color-accent: #3b82f6;
  --color-accent-hover: #60a5fa;
  --color-accent-strong: #2563eb;
  --color-accent-muted: #3b82f633;
  --color-status-success: #4ade80;
  --color-status-success-strong: #22c55e;
}
</style>
<style>
:root { --chrome-bg: #05060a; --chrome-line: #22262f; --chrome-text: #d1d5db; --chrome-muted: #8b8f9a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--chrome-bg); color: var(--chrome-text); font-family: ui-sans-serif, system-ui, sans-serif; }
.chrome { display: grid; grid-template-rows: auto auto minmax(0, 1fr); height: 100%; }
.tb { display: flex; align-items: center; gap: 12px; padding: 7px 16px; border-bottom: 1px solid var(--chrome-line); flex-wrap: wrap; font-size: 12px; }
.tb h1 { margin: 0; font-size: 13px; font-weight: 600; }
.grp { display: flex; align-items: center; gap: 4px; }
.grp > span { color: var(--chrome-muted); margin-right: 2px; }
.grp button { background: transparent; color: var(--chrome-muted); border: 1px solid var(--chrome-line); border-radius: 6px; padding: 3px 9px; cursor: pointer; font: inherit; }
.grp button.on { background: #ffffff14; color: #fff; border-color: #ffffff40; }
.grp button.demo { color: #93c5fd; border-color: #3b82f655; }
.why { padding: 6px 16px; font-size: 12px; color: var(--chrome-muted); border-bottom: 1px solid var(--chrome-line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.why b { color: var(--chrome-text); font-weight: 600; }
#stage { position: relative; min-height: 0; overflow: hidden; }
#frames { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; gap: 24px; padding: 26px 16px 12px; }
.fwrap { position: relative; flex: none; }
.flabel { position: absolute; left: 0; top: -1px; transform: translateY(-100%); font-size: 10px; color: var(--chrome-muted); white-space: nowrap; }
.frame { position: absolute; left: 0; top: 0; transform-origin: top left; border-radius: 14px; overflow: hidden; outline: 1px solid #ffffff1a; }
.frame.desk { width: 1280px; height: 800px; }
.frame.phone { width: 390px; height: 844px; border-radius: 36px; }
.noscroll { scrollbar-width: none; }
.noscroll::-webkit-scrollbar { display: none; }
#notes { position: absolute; top: 0; right: 0; bottom: 0; width: 440px; background: #0b0d12f2; border-left: 1px solid var(--chrome-line); padding: 14px 18px; overflow-y: auto; font-size: 12px; line-height: 1.5; transform: translateX(100%); transition: transform .15s; z-index: 5; }
#notes.open { transform: none; }
#notes h2 { font-size: 13px; margin: 14px 0 4px; color: #fff; }
#notes h2:first-child { margin-top: 0; }
#notes p, #notes li { color: #c4c8d0; margin: 3px 0; }
#notes ul { padding-left: 16px; margin: 3px 0; }
#notes code { font: 11px ui-monospace, Menlo, monospace; color: #e5e7eb; background: #ffffff10; padding: 0 3px; border-radius: 3px; }
.spark { touch-action: none; cursor: crosshair; }
@keyframes halo { 0% { r: 2; opacity: .9; } 100% { r: 9; opacity: 0; } }
.halo { animation: halo 1.4s ease-out 3; }
@keyframes toastin { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.toast-in { animation: toastin .2s ease-out; }
</style>
</head>
<body>
<div class="chrome">
  <header class="tb">
    <h1>Round 2 · form ↔ history</h1>
    <div class="grp" id="g-variant"><span>Variant</span></div>
    <div class="grp" id="g-scen"><span>Scenario</span></div>
    <div class="grp" id="g-vp"><span>Viewport</span></div>
    <div class="grp" id="g-lang"><span>Lang</span></div>
    <div class="grp"><span>Save flow</span><button class="demo" id="demo-type">1 · FTP → 300</button><button class="demo" id="demo-save">2 · Save</button><button id="demo-reset">Reset</button></div>
    <div class="grp"><button id="notes-btn">Notes</button></div>
  </header>
  <div class="why" id="why"></div>
  <main id="stage">
    <div id="frames">
      <div class="fwrap" id="dwrap"><div class="flabel">Desktop · settings column (40 %) · hover, click</div><div class="frame desk" id="desk"></div></div>
      <div class="fwrap" id="pwrap"><div class="flabel">Phone 390 · bottom sheet · tap</div><div class="frame phone" id="phone"></div></div>
    </div>
    <aside id="notes"></aside>
  </main>
</div>
<script>
const DAY = 86400000;
const D = (s) => new Date(s + 'T00:00:00').getTime();
const TODAY = D('2026-10-13');
const C = { cycling: '#f97316', power: '#3b82f6', grade: '#a78bfa', pace: '#06b6d4', hr: '#ef4444', surface: '#111318', textTertiary: '#8b8f9a' };
const h = (pairs) => pairs.map((p) => ({ date: D(p[0]), value: p[1] }));

const LONG = {
  ftp: h([['2024-10-20', 235], ['2025-01-12', 242], ['2025-03-03', 250], ['2025-05-18', 262], ['2025-08-10', 268], ['2025-11-02', 255], ['2026-02-15', 260], ['2026-04-26', 272], ['2026-07-05', 281], ['2026-09-14', 285]]),
  weight: h([['2024-10-20', 78.6], ['2025-02-01', 77.2], ['2025-04-20', 75.9], ['2025-07-01', 74.8], ['2025-12-20', 76.3], ['2026-03-08', 75.1], ['2026-06-01', 73.6], ['2026-08-30', 72.9]]),
  restHr: h([['2024-10-20', 54], ['2025-06-08', 52], ['2026-05-10', 50]]),
  maxHr: h([['2024-10-20', 189], ['2026-01-18', 187]]),
  pace: h([['2024-10-20', 292], ['2025-09-21', 280], ['2026-06-14', 271]]),
};
const SCEN = {
  new: { label: 'New user (1 each, no weight)', ftp: h([['2026-09-28', 220]]), weight: [], restHr: h([['2026-09-28', 56]]), maxHr: h([['2026-09-28', 190]]), pace: h([['2026-09-28', 285]]) },
  one: { label: '1 each + weight', ftp: h([['2026-09-28', 220]]), weight: h([['2026-09-28', 74.5]]), restHr: h([['2026-09-28', 56]]), maxHr: h([['2026-09-28', 190]]), pace: h([['2026-09-28', 285]]) },
  long: { label: '2 years of changes', ...LONG },
  noftp: { label: 'No FTP', ftp: [], weight: LONG.weight, restHr: LONG.restHr, maxHr: LONG.maxHr, pace: LONG.pace },
};

const I18N = {
  en: {
    tabGeneral: 'General', tabData: 'Data Management',
    thrTitle: 'Thresholds', thrSub: 'Your heart rate and power baselines',
    gender: 'Gender', male: 'Male', birth: 'Birth year',
    restHrL: 'Resting HR (bpm)', maxHrL: 'Max HR (bpm)', ftpL: 'FTP (watts)', paceL: 'Threshold Pace (min/km)', weightL: 'Weight (kg)', wkgL: 'W/kg',
    estimate: 'Estimate from a race time', save: 'Save',
    histTitle: 'Profile history', display: 'Display', language: 'Language', languageDesc: 'Choose your app language',
    wkg: 'W/kg', ftp: 'FTP', weight: 'Weight', restHr: 'Rest HR', maxHr: 'Max HR', pace: 'Pace',
    since: (d, date) => `${d} since ${date}`, setOn: (date) => `Set on ${date}`,
    addWeight: 'Add weight', addFtp: 'Add FTP', addBoth: 'Add FTP and weight',
    pending: (a, b) => `→ ${b} from today`,
    savedTitle: 'Thresholds saved', savedDesc: 'Changes count from today. Earlier sessions keep their values.',
    showHistory: 'Show history',
    current: 'Current values', history: 'History',
    tapHintDesk: 'Click a value to change it', tapHintPhone: 'Tap a value to change it',
    countsToday: 'Changes count from today', newToday: (d) => `${d} today`,
  },
  de: {
    tabGeneral: 'Allgemein', tabData: 'Datenverwaltung',
    thrTitle: 'Schwellenwerte', thrSub: 'Deine Herzfrequenz- und Leistungs-Grundwerte',
    gender: 'Geschlecht', male: 'Männlich', birth: 'Geburtsjahr',
    restHrL: 'Ruhe-HF (bpm)', maxHrL: 'Max-HF (bpm)', ftpL: 'FTP (Watt)', paceL: 'Schwellentempo (min/km)', weightL: 'Gewicht (kg)', wkgL: 'W/kg',
    estimate: 'Aus einer Wettkampfzeit schätzen', save: 'Speichern',
    histTitle: 'Verlauf deiner Werte', display: 'Anzeige', language: 'Sprache', languageDesc: 'Wähle die Sprache der App',
    wkg: 'W/kg', ftp: 'FTP', weight: 'Gewicht', restHr: 'Ruhepuls', maxHr: 'Max. Puls', pace: 'Tempo',
    since: (d, date) => `${d} seit ${date}`, setOn: (date) => `Eingetragen am ${date}`,
    addWeight: 'Gewicht eintragen', addFtp: 'FTP eintragen', addBoth: 'FTP und Gewicht eintragen',
    pending: (a, b) => `→ ${b} ab heute`,
    savedTitle: 'Schwellenwerte gespeichert', savedDesc: 'Änderungen zählen ab heute. Frühere Einheiten behalten ihre Werte.',
    showHistory: 'Verlauf zeigen',
    current: 'Aktuelle Werte', history: 'Verlauf',
    tapHintDesk: 'Klick auf einen Wert, um ihn zu ändern', tapHintPhone: 'Tipp auf einen Wert, um ihn zu ändern',
    countsToday: 'Änderungen zählen ab heute', newToday: (d) => `${d} heute`,
  },
};

const VARIANTS = {
  tilefield: { label: 'A · Tile = field', why: 'The tiles are the form: click a tile and it becomes its input, Save sits in the card footer. One object per value, so there is nothing to connect.' },
  row: { label: 'B · Field + history row', why: 'Each value is one row: its input on the left, its history tile on the right at input height. Value and history share a line, W/kg is a read-only row.' },
  zones: { label: 'C · One card, two zones', why: 'Form and tiles in one card, mirrored on the same 2-column grid with the same icons and colours. Hovering a field lights its tile; after Save the tile shows its new step.' },
  preview: { label: 'D · Live preview', why: 'Keeps today\'s two cards, but tiles preview pending edits as a dashed step and "→ 300 from today" while you type. The toast\'s "Show history" jumps to the new step.' },
};

const ORDER = ['restHr', 'maxHr', 'ftp', 'pace', 'weight', 'wkg'];
const state = { variant: 'zones', scen: 'long', vp: 'both', lang: 'en', notes: false, data: null, pending: {}, saved: [], editing: null, toast: false };

const t = () => I18N[state.lang];
const loc = () => (state.lang === 'de' ? 'de-DE' : 'en-US');
const nf = (min, max, sign) => new Intl.NumberFormat(loc(), { minimumFractionDigits: min, maximumFractionDigits: max, signDisplay: sign ? 'exceptZero' : 'auto' });
const fmtDate = (ms) => new Intl.DateTimeFormat(loc(), { month: 'numeric', day: 'numeric', year: 'numeric' }).format(new Date(ms));
const fmtShort = (ms) => {
  const sameYear = new Date(ms).getFullYear() === new Date(TODAY).getFullYear();
  const opts = sameYear ? { month: 'short', day: 'numeric' } : { month: 'short', year: 'numeric' };
  return new Intl.DateTimeFormat(loc(), opts).format(new Date(ms));
};
const mss = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;

const valueAt = (history, date) => {
  let latest;
  let earliest;
  for (const e of history) {
    if (earliest === undefined || e.date < earliest.date) earliest = e;
    if (e.date > date) continue;
    if (latest === undefined || e.date >= latest.date) latest = e;
  }
  if (latest !== undefined) return latest.value;
  return earliest?.value;
};

const V = {
  restHr: { icon: 'heart-pulse', color: C.hr, unit: 'bpm', fmt: (v) => nf(0, 0).format(v), dfmt: (v) => nf(0, 0, true).format(v), field: 'restHrL' },
  maxHr: { icon: 'heart', color: C.hr, unit: 'bpm', fmt: (v) => nf(0, 0).format(v), dfmt: (v) => nf(0, 0, true).format(v), field: 'maxHrL' },
  ftp: { icon: 'zap', color: C.power, unit: 'W', fmt: (v) => nf(0, 0).format(v), dfmt: (v) => nf(0, 0, true).format(v), field: 'ftpL' },
  pace: { icon: 'timer', color: C.pace, unit: '/km', fmt: mss, dfmt: (v) => (v === 0 ? '0:00' : `${v > 0 ? '+' : '-'}${mss(Math.abs(v))}`), field: 'paceL' },
  weight: { icon: 'weight', color: C.grade, unit: 'kg', fmt: (v) => nf(0, 1).format(v), dfmt: (v) => nf(0, 1, true).format(v), field: 'weightL' },
  wkg: { icon: 'gauge', color: C.cycling, unit: 'W/kg', fmt: (v) => nf(2, 2).format(v), dfmt: (v) => nf(2, 2, true).format(v), field: 'wkgL' },
};

const cloneScen = () => {
  const s = SCEN[state.scen];
  return { ftp: [...s.ftp], weight: [...s.weight], restHr: [...s.restHr], maxHr: [...s.maxHr], pace: [...s.pace] };
};

const wkgOf = (ftp, weight) => {
  if (ftp.length === 0 || weight.length === 0) return [];
  const dates = [...new Set([...ftp, ...weight].map((e) => e.date))].sort((a, b) => a - b);
  return dates.map((d) => ({ date: d, value: valueAt(ftp, d) / valueAt(weight, d) }));
};
const historyOf = (key) => (key === 'wkg' ? wkgOf(state.data.ftp, state.data.weight) : state.data[key]);
const latest = (key) => historyOf(key).at(-1)?.value;

const parseInput = (key, str) => {
  if (str === undefined || str.trim() === '') return undefined;
  if (key === 'pace') {
    const m = str.match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return undefined;
    return Number(m[1]) * 60 + Number(m[2]);
  }
  const n = Number(str.replace(',', '.'));
  if (!(n > 0)) return undefined;
  return n;
};
const pendingValue = (key) => {
  if (key === 'wkg') {
    const f = pendingValue('ftp') ?? latest('ftp');
    const w = pendingValue('weight') ?? latest('weight');
    if (f === undefined || w === undefined) return undefined;
    if (pendingValue('ftp') === undefined && pendingValue('weight') === undefined) return undefined;
    return f / w;
  }
  const v = parseInput(key, state.pending[key]);
  if (v === undefined || v === latest(key)) return undefined;
  return v;
};
const dirtyKeys = () => ORDER.filter((k) => k !== 'wkg' && pendingValue(k) !== undefined);

const sparkDomain = () => {
  let from = TODAY;
  for (const k of ORDER) for (const e of historyOf(k)) from = Math.min(from, e.date);
  from = Math.min(from, TODAY - 30 * DAY);
  return [from, TODAY + (TODAY - from) * 0.07];
};

const wkgHint = () => {
  const noF = state.data.ftp.length === 0;
  const noW = state.data.weight.length === 0;
  if (noF && noW) return t().addBoth;
  if (noF) return t().addFtp;
  return t().addWeight;
};

const caption = (key) => {
  const v = V[key];
  const pv = pendingValue(key);
  if (pv !== undefined && state.variant !== 'zones' && state.variant !== 'row') {
    const cur = latest(key);
    return { text: t().pending(cur === undefined ? '--' : v.fmt(cur), v.fmt(pv)), tone: 'pending' };
  }
  const hist = historyOf(key);
  if (hist.length === 0) {
    if (key === 'wkg') return { text: wkgHint(), tone: 'muted' };
    if (key === 'ftp') return { text: t().addFtp, tone: 'muted' };
    if (key === 'weight') return { text: t().addWeight, tone: 'muted' };
    return { text: '', tone: 'muted' };
  }
  const last = hist.at(-1);
  const fresh = state.saved.includes(key);
  if (hist.length === 1) return { text: fresh ? t().newToday(v.fmt(last.value)) : t().setOn(fmtShort(last.date)), tone: fresh ? 'fresh' : 'muted' };
  const prev = hist.at(-2);
  return { text: t().since(v.dfmt(last.value - prev.value), fmtShort(prev.date)), tone: fresh ? 'fresh' : 'muted' };
};

const glass = 'bg-surface/55 backdrop-blur-xl border border-white/10';
const floating = 'bg-surface/85 backdrop-blur-xl border border-white/10 shadow-[0_8px_24px_rgb(0_0_0/0.4)]';
const tileCls = 'rounded-xl border border-white/10 bg-white/5';
const T = {
  h3: 'text-lg font-bold text-text-primary',
  title: 'text-base font-medium text-text-primary',
  body1: 'text-sm text-text-primary',
  caption: 'text-xs text-text-secondary',
  overline: 'text-xs font-medium uppercase tracking-wider text-text-secondary',
};
const icon = (name, size, extra = '', style = '') => `<i data-lucide="${name}" style="width:${size}px;height:${size}px;${style}" class="shrink-0 ${extra}"></i>`;
const labelCls = 'block text-sm font-medium text-gray-300 mb-1.5 leading-none';
const inputCls = (mode) => `flex w-full min-w-0 text-text-primary placeholder:text-text-tertiary focus:outline-none h-10 rounded-lg border bg-white/5 px-3 py-2 focus:ring-2 focus:ring-accent border-white/10 ${mode === 'desk' ? 'text-sm' : 'text-base'}`;
const btnPrimary = 'inline-flex items-center justify-center gap-2 rounded-lg font-medium bg-accent text-white hover:bg-accent-strong px-4 py-2 text-sm disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer';
const btnSecondary = 'inline-flex items-center justify-center gap-2 rounded-lg font-medium bg-white/5 text-text-primary hover:bg-white/10 border border-white/10 px-3 py-1.5 text-sm cursor-pointer';
const cardHeader = (title, sub) => `<div class="mb-4 flex items-start justify-between gap-2"><div><h3 class="${T.title}">${title}</h3>${sub ? `<p class="${T.caption}">${sub}</p>` : ''}</div></div>`;
const capTone = (tone) => (tone === 'pending' ? 'text-accent-hover' : tone === 'fresh' ? 'text-text-primary' : 'text-text-tertiary');

const inputValue = (key) => {
  if (state.pending[key] !== undefined) return state.pending[key];
  const v = latest(key);
  if (v === undefined) return '';
  if (key === 'pace') return mss(v);
  return String(v);
};

const valueLine = (key) => {
  const cur = latest(key);
  return `<p class="${T.h3} leading-tight truncate tabular-nums">${cur === undefined ? '--' : V[key].fmt(cur)}<span class="${T.caption} ml-0.5 font-normal">${cur === undefined ? '' : V[key].unit}</span></p>`;
};

const tileHead = (key) => `<div class="flex items-center gap-1.5 min-w-0"><span class="grid place-items-center" style="color:${V[key].color}">${icon(V[key].icon, 12)}</span><span class="${T.overline} truncate">${t()[key]}</span></div>`;

const ring = (key) => (state.saved.includes(key) ? `box-shadow: 0 0 0 1px ${V[key].color}aa` : '');

const tile = (key, mode, opts = {}) => {
  const cap = caption(key);
  const editing = opts.editable && state.editing === key;
  const body = editing
    ? `<div class="mt-1 h-[42px]"><input data-input="${key}" data-mode="${mode}" type="${key === 'pace' ? 'text' : 'number'}" value="${inputValue(key)}" class="${inputCls(mode)}"></div>`
    : `<div class="mt-1 h-[42px]">${valueLine(key)}<p data-cap="${key}" data-default="${cap.text}" class="${T.caption} ${capTone(cap.tone)} min-h-4 truncate tabular-nums">${cap.text}</p></div>`;
  const tag = opts.editable && key !== 'wkg' && !editing ? 'button' : 'div';
  return `<${tag} ${tag === 'button' ? `type="button" data-edit="${key}"` : ''} data-tile="${key}" data-link="${key}" style="${ring(key)}" class="${tileCls} p-3 min-w-0 text-left transition-shadow ${tag === 'button' ? 'cursor-pointer hover:bg-white/10' : ''} ${editing ? 'ring-2 ring-accent' : ''}">
    ${tileHead(key)}${body}
    <div class="spark mt-1.5 h-6 w-full" data-spark="${key}"></div>
  </${tag}>`;
};

const linkLabel = (key, id) => `<label for="${id}" class="${labelCls} flex items-center gap-1.5">${icon(V[key].icon, 12, '', `color:${V[key].color}`)}${t()[V[key].field]}</label>`;
const plainLabel = (key, id) => `<label for="${id}" class="${labelCls}">${t()[V[key].field]}</label>`;

const estimateHelper = `<p class="mt-1 text-xs text-text-quaternary"><span class="flex gap-1 text-accent">${icon('info', 16)}<button type="button" class="cursor-pointer hover:underline">${'{EST}'}</button></span></p>`;

const field = (mode, key, withIcon) => {
  const id = `${mode}-${key}`;
  if (key === 'wkg') {
    const pv = pendingValue('wkg');
    const cur = pv ?? latest('wkg');
    return `<div data-link="wkg">${withIcon ? linkLabel(key, id) : plainLabel(key, id)}<input id="${id}" data-wkg readonly tabindex="-1" value="${cur === undefined ? '--' : V.wkg.fmt(cur)}" class="${inputCls(mode)} bg-transparent border-dashed text-text-secondary cursor-default focus:ring-0"></div>`;
  }
  const helper = key === 'pace' ? estimateHelper.replace('{EST}', t().estimate) : '';
  return `<div data-link="${key}">${withIcon ? linkLabel(key, id) : plainLabel(key, id)}<div class="w-full"><input id="${id}" data-input="${key}" data-mode="${mode}" type="${key === 'pace' ? 'text' : 'number'}" value="${inputValue(key)}" class="${inputCls(mode)}">${helper}</div></div>`;
};

const genderRow = (mode) => `
  <div class="grid ${mode === 'desk' ? 'grid-cols-2' : 'grid-cols-1'} gap-3">
    <div><label class="${labelCls}">${t().gender}</label><button class="flex h-10 w-full items-center justify-between rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-sm text-text-primary cursor-pointer"><span>${t().male}</span>${icon('chevron-down', 12, 'text-text-tertiary')}</button></div>
    <div><label class="${labelCls}">${t().birth}</label><input type="number" value="1990" class="${inputCls(mode)}"></div>
  </div>`;

const saveRow = (mode, leftText) => `<div class="mt-4 flex items-center justify-end gap-3"><p data-save-hint class="${T.caption} text-text-tertiary min-h-4 min-w-0 flex-1 truncate">${leftText ?? ''}</p><button data-save ${dirtyKeys().length === 0 ? 'disabled' : ''} class="${btnPrimary}">${t().save}</button></div>`;

const pendingSummary = () => {
  const keys = dirtyKeys();
  if (keys.length === 0) return '';
  return keys.map((k) => `${t()[k]} ${latest(k) === undefined ? '--' : V[k].fmt(latest(k))} → ${V[k].fmt(pendingValue(k))}`).join(' · ') + ` · ${t().countsToday}`;
};

const variantA = (mode) => {
  const cols = mode === 'desk' ? 'grid-cols-3' : 'grid-cols-2';

const variantB = (mode) => {

    const id = `${mode}-${k}`;

    <g stroke="#232a36" stroke-width="2" fill="none"><path d="M0 ${hgt * 0.2} L${w} ${hgt * 0.32}"/><path d="M0 ${hgt * 0.55} L${w} ${hgt * 0.48}"/><path d="M${w * 0.2} 0 L${w * 0.25} ${hgt}"/><path d="M${w * 0.38} 0 L${w * 0.33} ${hgt}"/></g>
    <path d="M${w * 0.1} ${hgt * 0.7} L${w * 0.22} ${hgt * 0.45} L${w * 0.3} ${hgt * 0.5} L${w * 0.42} ${hgt * 0.28}" stroke="#f97316" stroke-opacity=".55" stroke-width="3" fill="none"/>

const dockItem = (name, active) => `<span class="relative shrink-0 rounded-full p-1.5 ${active ? 'text-accent-hover' : 'text-text-tertiary'} grid place-items-center size-10">${icon(name, 20)}</span>`;

const renderDesk = () => `

const renderPhone = () => `

    </div>
    <div data-toast>${toastHtml('phone')}</div>
  </div>`;

const xOf = (d, dom, x0, x1) => x0 + ((d - dom[0]) / (dom[1] - dom[0])) * (x1 - x0);

const drawSpark = (el) => {
  const key = el.dataset.spark;
  const hist = historyOf(key);
  const w = el.clientWidth;
  const ht = el.clientHeight;
  const dom = sparkDomain();
  const pv = state.variant === "zones" || state.variant === "row" ? undefined : pendingValue(key);
  if (hist.length === 0 && pv === undefined) {
    el.innerHTML = `<svg width="${w}" height="${ht}"><line x1="0" x2="${w}" y1="${ht - 1}" y2="${ht - 1}" stroke="#ffffff1a" stroke-dasharray="2 3"/></svg>`;
    return;
  }
  const pad = 2;
  const vals = hist.map((e) => e.value);
  if (pv !== undefined) vals.push(pv);
  let lo = Math.min(...vals);
  let hi = Math.max(...vals);
  if (lo === hi) { lo -= Math.abs(lo) * 0.05 || 1; hi += Math.abs(hi) * 0.05 || 1; }
  const y = (v) => ht - pad - ((v - lo) / (hi - lo)) * (ht - 2 * pad);
  const x1 = w - pad;
  let p = '';
  hist.forEach((e, i) => {
    const x = xOf(e.date, dom, pad, x1);
    p += i === 0 ? `M${x.toFixed(1)} ${y(e.value).toFixed(1)}` : ` H${x.toFixed(1)} V${y(e.value).toFixed(1)}`;
  });
  const color = V[key].color;
  const xt = xOf(TODAY, dom, pad, x1);
  let extra = '';
  if (hist.length > 0) p += ` H${x1.toFixed(1)}`;
  if (pv !== undefined) {
    const last = hist.at(-1);
    const startY = last === undefined ? y(pv) : y(last.value);
    extra += `<path d="M${xt.toFixed(1)} ${startY.toFixed(1)} V${y(pv).toFixed(1)} H${x1}" stroke="${color}" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/><circle cx="${x1}" cy="${y(pv)}" r="2.5" fill="none" stroke="${color}" stroke-width="1.5"/>`;
  } else if (hist.length > 0) {
    const last = hist.at(-1);
    const lx = xOf(last.date, dom, pad, x1);
    const fresh = state.saved.includes(key);
    extra += `<circle cx="${fresh ? lx : x1}" cy="${y(last.value)}" r="2" fill="${color}"/>`;
    if (fresh) extra += `<circle class="halo" cx="${lx}" cy="${y(last.value)}" r="2" fill="none" stroke="${color}" stroke-width="1.5"/>`;
  }
  el.innerHTML = `<svg width="${w}" height="${ht}" class="block overflow-visible">
    <line data-guide visibility="hidden" x1="0" x2="0" y1="0" y2="${ht}" stroke="#ffffff40"/>
    <line x1="${xt}" x2="${xt}" y1="0" y2="${ht}" stroke="#ffffff14" stroke-dasharray="1 2"/>
    <path d="${p}" stroke="${color}" stroke-width="1.5" fill="none" stroke-linejoin="round"/>${extra}
  </svg>`;
  if (hist.length === 0) return;
  const guide = el.querySelector('[data-guide]');
  let scope = el.parentElement;
  while (scope && !scope.querySelector(`[data-cap="${key}"]`)) scope = scope.parentElement;
  const capEl = scope?.querySelector(`[data-cap="${key}"]`);
  const move = (ev) => {
    if (!capEl) return;
    const r = el.getBoundingClientRect();
    const x = Math.max(pad, Math.min(x1, (ev.clientX - r.left) * (w / r.width)));
    const d = Math.min(TODAY, dom[0] + ((x - pad) / (x1 - pad)) * (dom[1] - dom[0]));
    guide.setAttribute('x1', x); guide.setAttribute('x2', x); guide.setAttribute('visibility', 'visible');
    const entryDate = valueAt(hist.map((e) => ({ date: e.date, value: e.date })), d);
    capEl.textContent = `${fmtDate(entryDate)} · ${V[key].fmt(valueAt(hist, d))} ${V[key].unit}`;
  };
  const leave = () => { guide.setAttribute('visibility', 'hidden'); if (capEl) capEl.textContent = capEl.dataset.default; };
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerleave', leave);
  el.addEventListener('click', (ev) => ev.stopPropagation());
};

const rootOf = (mode) => document.getElementById(mode === 'desk' ? 'desk' : 'phone');

const refreshLive = (mode, skipKey) => {
  const root = rootOf(mode);
  root.querySelectorAll('[data-tile]').forEach((el) => {
    const key = el.dataset.tile;
    if (key === skipKey && state.variant === 'tilefield') return;
    const html = state.variant === 'row' ? miniTile(key, mode) : tile(key, mode, { editable: state.variant === 'tilefield' });
    const tmp = document.createElement('div');
    tmp.innerHTML = html.trim();
    el.replaceWith(tmp.firstElementChild);
  });
  root.querySelectorAll('[data-wkg]').forEach((inp) => {
    const v = pendingValue('wkg') ?? latest('wkg');
    inp.value = v === undefined ? '--' : V.wkg.fmt(v);
  });
  const btn = root.querySelector('[data-save]');
  if (btn) btn.disabled = dirtyKeys().length === 0;
  const hint = root.querySelector('[data-save-hint]');
  if (hint) {
    if (state.variant === 'tilefield') hint.textContent = dirtyKeys().length > 0 ? pendingSummary() : (mode === 'desk' ? t().tapHintDesk : t().tapHintPhone);
    else if (state.variant !== 'preview') hint.textContent = pendingSummary();
  }
  lucide.createIcons();
  root.querySelectorAll('[data-spark]').forEach(drawSpark);
  bindTiles(root);
};

const setLink = (root, key, on) => {
  if (state.variant !== 'zones') return;
  root.querySelectorAll(`[data-tile="${key}"]`).forEach((el) => el.classList.toggle('ring-1', on));
  root.querySelectorAll(`[data-tile="${key}"]`).forEach((el) => el.classList.toggle('ring-white/40', on));
  root.querySelectorAll(`[data-link="${key}"]:not([data-tile]) input`).forEach((el) => el.classList.toggle('border-white/30', on));
};

const bindTiles = (root) => {
  root.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => {
    state.editing = b.dataset.edit;
    render();
    const inp = rootOf(b.closest('#desk') ? 'desk' : 'phone').querySelector(`[data-input="${state.editing}"]`);
    if (inp) inp.focus();
  }));
  root.querySelectorAll('[data-link]').forEach((el) => {
    el.addEventListener('mouseenter', () => setLink(root, el.dataset.link, true));
    el.addEventListener('mouseleave', () => setLink(root, el.dataset.link, false));
  });
};

const save = () => {
  const keys = dirtyKeys();
  if (keys.length === 0) return;
  const before = latest('wkg');
  for (const k of keys) {
    const v = pendingValue(k);
    state.data[k] = [...state.data[k].filter((e) => e.date !== TODAY), { date: TODAY, value: v }].sort((a, b) => a.date - b.date);
  }
  state.saved = [...keys];
  if ((keys.includes('ftp') || keys.includes('weight')) && latest('wkg') !== undefined && latest('wkg') !== before) state.saved.push('wkg');
  state.pending = {};
  state.editing = null;
  state.toast = true;
  render();
};

const hydrate = (root, mode) => {
  root.querySelectorAll('[data-spark]').forEach(drawSpark);
  bindTiles(root);
  root.querySelectorAll('[data-input]').forEach((inp) => inp.addEventListener('input', () => {
    state.pending[inp.dataset.input] = inp.value;
    refreshLive('desk', mode === 'desk' ? inp.dataset.input : null);
    refreshLive('phone', mode === 'phone' ? inp.dataset.input : null);
    const other = rootOf(mode === 'desk' ? 'phone' : 'desk').querySelector(`[data-input="${inp.dataset.input}"]`);
    if (other) other.value = inp.value;
  }));
  root.querySelectorAll('[data-input]').forEach((inp) => {
    inp.addEventListener('focus', () => setLink(root, inp.dataset.input, true));
    inp.addEventListener('blur', () => setLink(root, inp.dataset.input, false));
    inp.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') save(); if (ev.key === 'Escape' && state.variant === 'tilefield') { delete state.pending[inp.dataset.input]; state.editing = null; render(); } });
  });
  root.querySelectorAll('[data-save]').forEach((b) => b.addEventListener('click', save));
  root.querySelectorAll('[data-show-history]').forEach((b) => b.addEventListener('click', () => scrollToHistory(root, true)));
  scrollInit(root);
};

const scrollToHistory = (root, smooth) => {
  const col = root.querySelector('[data-col]');
  const target = root.querySelector('[data-history]') || root.querySelector('[data-focus]');
  if (!col || !target) return;
  const top = Math.max(0, target.offsetTop + target.offsetHeight - col.clientHeight + 110);
  col.scrollTo({ top: Math.min(top, target.offsetTop - 16), behavior: smooth ? 'smooth' : 'auto' });
};

const scrollInit = (root) => {
  const col = root.querySelector('[data-col]');
  if (!col) return;
  if (state.toast && state.variant === 'preview') { col.scrollTop = scrollState[root.id] ?? 0; return; }
  if (state.variant === 'zones') {
    const hist = root.querySelector('[data-history]');
    let st = hist.offsetTop - col.clientHeight * 0.35;
    if (state.toast) st = hist.offsetTop + hist.offsetHeight - col.clientHeight + 120;
    col.scrollTop = Math.max(0, st);
    return;
  }
  const target = root.querySelector('[data-focus]');
  col.scrollTop = Math.max(0, Math.min(target.offsetTop + target.offsetHeight - col.clientHeight + 120, target.offsetTop - 16));
};
const scrollState = {};

const fit = () => {
  const stage = document.getElementById('stage').getBoundingClientRect();
  const parts = [];
  if (state.vp !== 'phone') parts.push(['dwrap', 'desk', 1280, 800]);
  if (state.vp !== 'desktop') parts.push(['pwrap', 'phone', 390, 844]);
  document.getElementById('dwrap').style.display = state.vp === 'phone' ? 'none' : '';
  document.getElementById('pwrap').style.display = state.vp === 'desktop' ? 'none' : '';
  const availW = stage.width - 32 - 24 * (parts.length - 1);
  const availH = stage.height - 26 - 12;
  const s = Math.min(availH / Math.max(...parts.map((p) => p[3])), availW / parts.reduce((a, p) => a + p[2], 0), 1.25);
  for (const p of parts) {
    const wrap = document.getElementById(p[0]);
    wrap.style.width = `${p[2] * s}px`;
    wrap.style.height = `${p[3] * s}px`;
    document.getElementById(p[1]).style.transform = `scale(${s})`;
  }
};

const render = () => {
  for (const id of ['desk', 'phone']) {
    const col = document.querySelector(`#${id} [data-col]`);
    if (col) scrollState[id] = col.scrollTop;
  }
  document.documentElement.lang = state.lang;
  document.getElementById('why').innerHTML = `<b>${VARIANTS[state.variant].label}:</b> ${VARIANTS[state.variant].why}`;
  fit();
  const desk = document.getElementById('desk');
  const phone = document.getElementById('phone');
  desk.innerHTML = renderDesk();
  phone.innerHTML = renderPhone();
  lucide.createIcons();
  hydrate(desk, 'desk');
  hydrate(phone, 'phone');
  renderToolbar();
};

const resetData = () => {
  state.data = cloneScen();
  state.pending = {};
  state.saved = [];
  state.editing = null;
  state.toast = false;
};

const group = (id, options, key) => {

};
const renderToolbar = () => {
  group('g-variant', Object.entries(VARIANTS).map((e) => [e[0], e[1].label]), 'variant');
  group('g-scen', Object.entries(SCEN).map((e) => [e[0], e[1].label]), 'scen');
  group('g-vp', [['both', 'Both'], ['desktop', 'Desktop'], ['phone', 'Phone 390']], 'vp');
  group('g-lang', [['en', 'EN'], ['de', 'DE']], 'lang');
};

document.querySelector('.tb').addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-k]');
  if (!b) return;
  state[b.dataset.k] = b.dataset.v;
  if (b.dataset.k === 'scen' || b.dataset.k === 'variant') resetData();

});
document.getElementById('demo-type').addEventListener('click', () => {
  state.saved = [];
  state.toast = false;
  state.pending = { ftp: '300' };
  if (state.variant === 'tilefield') state.editing = 'ftp';
  render();
});
document.getElementById('demo-save').addEventListener('click', save);
document.getElementById('demo-reset').addEventListener('click', () => { resetData(); render(); });
document.getElementById('notes-btn').addEventListener('click', () => {
  state.notes = !state.notes;
  document.getElementById('notes').classList.toggle('open', state.notes);
  document.getElementById('notes-btn').classList.toggle('on', state.notes);
});
window.addEventListener('resize', render);

document.getElementById('notes').innerHTML = `
<h2>Round 2: tie the form to its history</h2>
<p>Every variant uses the stat tiles from round 1, variant 1. The toolbar's <b>Save flow</b> runs the scenario: <b>1 · FTP → 300</b> types into FTP (in A it opens the FTP tile), <b>2 · Save</b> saves. The toast matches <code>Toast.tsx:23-45</code> (success border) and uses the existing <code>ui_thresholds_saved_*</code> copy. Saving writes or replaces today's entry, like the real save.</p>
<p>Shared order everywhere: rest HR, max HR, FTP, pace, weight, W/kg. That is the form's order (<code>ThresholdsSection.tsx:67-116</code>) with W/kg after weight, so form and tiles always line up the same way.</p>
