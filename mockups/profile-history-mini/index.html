<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile History Mini</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style type="text/tailwindcss">
@theme {
  --color-gray-300: #b0b4be;
  --color-blue-700: #1d4ed8;
  --color-surface-base: #030712;
  --color-surface: #111318;
  --color-surface-elevated: #1a1d24;
  --color-text-primary: #e5e7eb;
  --color-text-secondary: #b0b4be;
  --color-text-tertiary: #8b8f9a;
  --color-text-quaternary: #5c616e;
  --color-accent: #3b82f6;
  --color-accent-hover: #60a5fa;
  --color-accent-strong: #2563eb;
  --color-accent-muted: #3b82f633;
  --color-sport-cycling: #f97316;
  --color-sport-running: #4ade80;
  --color-status-danger: #f87171;
  --color-status-danger-strong: #ef4444;
}
</style>
<style>
:root {
  --chrome-bg: #05060a;
  --chrome-line: #22262f;
  --chrome-text: #d1d5db;
  --chrome-muted: #8b8f9a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--chrome-bg); color: var(--chrome-text); font-family: ui-sans-serif, system-ui, sans-serif; }
.chrome { display: grid; grid-template-rows: auto auto minmax(0, 1fr); height: 100%; }
.tb { display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--chrome-line); flex-wrap: wrap; font-size: 12px; }
.tb h1 { margin: 0; font-size: 13px; font-weight: 600; }
.grp { display: flex; align-items: center; gap: 4px; }
.grp > span { color: var(--chrome-muted); margin-right: 2px; }
.grp button { background: transparent; color: var(--chrome-muted); border: 1px solid var(--chrome-line); border-radius: 6px; padding: 3px 9px; cursor: pointer; font: inherit; }
.grp button.on { background: #ffffff14; color: #fff; border-color: #ffffff40; }
.why { padding: 6px 16px; font-size: 12px; color: var(--chrome-muted); border-bottom: 1px solid var(--chrome-line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.why b { color: var(--chrome-text); font-weight: 600; }
#stage { position: relative; min-height: 0; overflow: hidden; }
#frames { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; gap: 24px; padding: 14px 16px; }
.fwrap { position: relative; flex: none; }
.flabel { position: absolute; left: 0; top: -1px; transform: translateY(-100%); font-size: 10px; color: var(--chrome-muted); white-space: nowrap; }
.frame { position: absolute; left: 0; top: 0; transform-origin: top left; border-radius: 14px; overflow: hidden; outline: 1px solid #ffffff1a; }
.frame.desk { width: 1280px; height: 800px; }
.frame.phone { width: 390px; height: 844px; border-radius: 36px; }
.noscroll { scrollbar-width: none; }
.noscroll::-webkit-scrollbar { display: none; }
#notes { position: absolute; top: 0; right: 0; bottom: 0; width: 420px; background: #0b0d12f2; border-left: 1px solid var(--chrome-line); padding: 14px 18px; overflow-y: auto; font-size: 12px; line-height: 1.5; transform: translateX(100%); transition: transform .15s; }
#notes.open { transform: none; }
#notes h2 { font-size: 13px; margin: 14px 0 4px; color: #fff; }
#notes h2:first-child { margin-top: 0; }
#notes p, #notes li { color: #c4c8d0; margin: 3px 0; }
#notes ul { padding-left: 16px; margin: 3px 0; }
#notes code { font: 11px ui-monospace, Menlo, monospace; color: #e5e7eb; background: #ffffff10; padding: 0 3px; border-radius: 3px; }
#notes a { color: #93c5fd; }
.spark { touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<div class="chrome">
  <header class="tb">
    <h1>Profile history, minified + W/kg</h1>
    <div class="grp" id="g-variant"><span>Variant</span></div>
    <div class="grp" id="g-scen"><span>Scenario</span></div>
    <div class="grp" id="g-vp"><span>Viewport</span></div>
    <div class="grp" id="g-lang"><span>Lang</span></div>
    <div class="grp"><button id="notes-btn">Notes</button></div>
  </header>
  <div class="why" id="why"></div>
  <main id="stage">
    <div id="frames">
      <div class="fwrap" id="dwrap"><div class="flabel">Desktop · settings column (40 %) · hover</div><div class="frame desk" id="desk"></div></div>
      <div class="fwrap" id="pwrap"><div class="flabel">Phone 390 · bottom sheet · tap and drag</div><div class="frame phone" id="phone"></div></div>
    </div>
    <aside id="notes"></aside>
  </main>
</div>
<script>
const DAY = 86400000;
const D = (s) => new Date(s + 'T00:00:00').getTime();
const TODAY = D('2026-10-13');

const C = {
  cycling: '#f97316',
  power: '#3b82f6',
  grade: '#a78bfa',
  pace: '#06b6d4',
  hr: '#ef4444',
  surface: '#111318',
  textPrimary: '#e5e7eb',
  textTertiary: '#8b8f9a',
  border: '#252830',
};

const h = (pairs) => pairs.map((p) => ({ date: D(p[0]), value: p[1] }));

const LONG = {
  ftp: h([['2024-10-20', 235], ['2025-01-12', 242], ['2025-03-03', 250], ['2025-05-18', 262], ['2025-08-10', 268], ['2025-11-02', 255], ['2026-02-15', 260], ['2026-04-26', 272], ['2026-07-05', 281], ['2026-09-14', 285]]),
  weight: h([['2024-10-20', 78.6], ['2025-02-01', 77.2], ['2025-04-20', 75.9], ['2025-07-01', 74.8], ['2025-12-20', 76.3], ['2026-03-08', 75.1], ['2026-06-01', 73.6], ['2026-08-30', 72.9]]),
  restHr: h([['2024-10-20', 54], ['2025-06-08', 52], ['2026-05-10', 50]]),
  maxHr: h([['2024-10-20', 189], ['2026-01-18', 187]]),
  pace: h([['2024-10-20', 292], ['2025-09-21', 280], ['2026-06-14', 271]]),
};

const SCEN = {
  new: { label: 'New user (1 each, no weight)', ftp: h([['2026-09-28', 220]]), weight: [], restHr: h([['2026-09-28', 56]]), maxHr: h([['2026-09-28', 190]]), pace: h([['2026-09-28', 285]]) },
  one: { label: '1 each + weight', ftp: h([['2026-09-28', 220]]), weight: h([['2026-09-28', 74.5]]), restHr: h([['2026-09-28', 56]]), maxHr: h([['2026-09-28', 190]]), pace: h([['2026-09-28', 285]]) },
  long: { label: '2 years of changes', ...LONG },
  noftp: { label: 'No FTP', ftp: [], weight: LONG.weight, restHr: LONG.restHr, maxHr: LONG.maxHr, pace: LONG.pace },
};

const I18N = {
  en: {
    tabGeneral: 'General', tabData: 'Data Management',
    thrTitle: 'Thresholds', thrSub: 'Your heart rate and power baselines',
    gender: 'Gender', male: 'Male', birth: 'Birth year',
    restHrL: 'Resting HR (bpm)', maxHrL: 'Max HR (bpm)', ftpL: 'FTP (watts)', paceL: 'Threshold Pace (min/km)', weightL: 'Weight (kg)', wkgL: 'W/kg',
    estimate: 'Estimate from a race time', save: 'Save',
    histTitle: 'Profile history', histSub: 'How your baselines changed over time',
    latest: 'latest', display: 'Display', language: 'Language', languageDesc: 'Choose your app language',
    wkg: 'W/kg', ftp: 'FTP', weight: 'Weight', restHr: 'Rest HR', maxHr: 'Max HR', pace: 'Pace',
    since: (d, date) => `${d} since ${date}`,
    setOn: (date) => `Set on ${date}`,
    addWeight: 'Add weight', addFtp: 'Add FTP', addBoth: 'Add FTP and weight',
    addWeightLong: 'Add your weight to see W/kg', addFtpLong: 'Add your FTP to see W/kg', addBothLong: 'Add FTP and weight to see W/kg',
    changes: 'Changes', changesSub: 'Each change counts from its day on', start: 'Starting values',
  },
  de: {
    tabGeneral: 'Allgemein', tabData: 'Datenverwaltung',
    thrTitle: 'Schwellenwerte', thrSub: 'Deine Herzfrequenz- und Leistungs-Grundwerte',
    gender: 'Geschlecht', male: 'Männlich', birth: 'Geburtsjahr',
    restHrL: 'Ruhe-HF (bpm)', maxHrL: 'Max-HF (bpm)', ftpL: 'FTP (Watt)', paceL: 'Schwellentempo (min/km)', weightL: 'Gewicht (kg)', wkgL: 'W/kg',
    estimate: 'Aus einer Wettkampfzeit schätzen', save: 'Speichern',
    histTitle: 'Verlauf deiner Werte', histSub: 'Wie sich deine Grundwerte verändert haben',
    latest: 'aktuell', display: 'Anzeige', language: 'Sprache', languageDesc: 'Wähle die Sprache der App',
    wkg: 'W/kg', ftp: 'FTP', weight: 'Gewicht', restHr: 'Ruhepuls', maxHr: 'Max. Puls', pace: 'Tempo',
    since: (d, date) => `${d} seit ${date}`,
    setOn: (date) => `Eingetragen am ${date}`,
    addWeight: 'Gewicht eintragen', addFtp: 'FTP eintragen', addBoth: 'FTP und Gewicht eintragen',
    addWeightLong: 'Trag dein Gewicht ein – dann siehst du W/kg', addFtpLong: 'Trag deine FTP ein – dann siehst du W/kg', addBothLong: 'Trag FTP und Gewicht ein – dann siehst du W/kg',
    changes: 'Änderungen', changesSub: 'Jede Änderung gilt ab ihrem Tag', start: 'Startwerte',
  },
};

const VARIANTS = {
  tiles: { label: '1 · Stat tiles', why: 'One tile per value with its latest number, the last change and a step sparkline; scrub a sparkline to read its dates. Everything at a glance, no switcher.' },
  chart: { label: '2 · Mini chart', why: 'Today\'s chart at half the height, led by W/kg with FTP and weight in the rail; one scrolling chip row switches the value.' },
  inline: { label: '3 · Inline in form', why: 'No history card at all: each field carries its last change and a tiny sparkline in the label row, W/kg sits read-only in the empty slot next to weight.' },
  log: { label: '4 · Change log', why: 'W/kg headline plus a dated list of what changed and when. Matches the data model (discrete saves, no backdating) and reads well on a phone.' },
};

const state = { variant: 'tiles', scen: 'long', vp: 'both', lang: 'en', notes: false, tab: 'wkg' };

const t = () => I18N[state.lang];
const loc = () => (state.lang === 'de' ? 'de-DE' : 'en-US');
const nf = (min, max, sign) => new Intl.NumberFormat(loc(), { minimumFractionDigits: min, maximumFractionDigits: max, signDisplay: sign ? 'exceptZero' : 'auto' });
const fmtDate = (ms) => new Intl.DateTimeFormat(loc(), { month: 'numeric', day: 'numeric', year: 'numeric' }).format(new Date(ms));
const fmtShort = (ms) => {
  const sameYear = new Date(ms).getFullYear() === new Date(TODAY).getFullYear();
  const opts = sameYear ? { month: "short", day: "numeric" } : { month: "short", year: "numeric" };
  return new Intl.DateTimeFormat(loc(), opts).format(new Date(ms));
};
const mss = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;

const valueAt = (history, date) => {
  let latest;
  let earliest;
  for (const e of history) {
    if (earliest === undefined || e.date < earliest.date) earliest = e;
    if (e.date > date) continue;
    if (latest === undefined || e.date >= latest.date) latest = e;
  }
  if (latest !== undefined) return latest.value;
  return earliest?.value;
};

const wkgHistory = (s) => {
  if (s.ftp.length === 0 || s.weight.length === 0) return [];
  const dates = [...new Set([...s.ftp, ...s.weight].map((e) => e.date))].sort((a, b) => a - b);
  return dates.map((d) => ({ date: d, value: valueAt(s.ftp, d) / valueAt(s.weight, d) }));
};

const VALUES = [
  { key: 'wkg', icon: 'gauge', color: C.cycling, unit: 'W/kg', fmt: (v) => nf(2, 2).format(v), dfmt: (v) => nf(2, 2, true).format(v), field: 'wkgL' },
  { key: 'ftp', icon: 'zap', color: C.power, unit: 'W', fmt: (v) => nf(0, 0).format(v), dfmt: (v) => nf(0, 0, true).format(v), field: 'ftpL' },
  { key: 'weight', icon: 'weight', color: C.grade, unit: 'kg', fmt: (v) => nf(0, 1).format(v), dfmt: (v) => nf(0, 1, true).format(v), field: 'weightL' },
  { key: 'pace', icon: 'timer', color: C.pace, unit: '/km', fmt: mss, dfmt: (v) => (v === 0 ? '0:00' : `${v > 0 ? '+' : '-'}${mss(Math.abs(v))}`), field: 'paceL' },
  { key: 'restHr', icon: 'heart-pulse', color: C.hr, unit: 'bpm', fmt: (v) => nf(0, 0).format(v), dfmt: (v) => nf(0, 0, true).format(v), field: 'restHrL' },
  { key: 'maxHr', icon: 'heart', color: C.hr, unit: 'bpm', fmt: (v) => nf(0, 0).format(v), dfmt: (v) => nf(0, 0, true).format(v), field: 'maxHrL' },
];
const V = Object.fromEntries(VALUES.map((v) => [v.key, v]));

const scen = () => SCEN[state.scen];
const historyOf = (key) => (key === 'wkg' ? wkgHistory(scen()) : scen()[key]);

const domain = () => {
  let from = TODAY;
  for (const v of VALUES) for (const e of historyOf(v.key)) from = Math.min(from, e.date);
  return [Math.min(from, TODAY - 30 * DAY), TODAY];
};

const wkgHint = (long) => {
  const s = scen();
  const noF = s.ftp.length === 0;
  const noW = s.weight.length === 0;
  if (noF && noW) return long ? t().addBothLong : t().addBoth;
  if (noF) return long ? t().addFtpLong : t().addFtp;
  return long ? t().addWeightLong : t().addWeight;
};

const lastChange = (key, compact) => {
  const hist = historyOf(key);
  if (hist.length === 0) return key === 'wkg' ? wkgHint(false) : '';
  const last = hist.at(-1);
  if (hist.length === 1) return compact ? "" : t().setOn(fmtShort(last.date));
  const prev = hist.at(-2);
  const delta = V[key].dfmt(last.value - prev.value);
  if (compact) return delta;
  return t().since(delta, fmtShort(prev.date));
};

const latestText = (key) => {
  const hist = historyOf(key);
  if (hist.length === 0) return '--';
  return V[key].fmt(hist.at(-1).value);
};

const glass = 'bg-surface/55 backdrop-blur-xl border border-white/10';
const floating = 'bg-surface/85 backdrop-blur-xl border border-white/10 shadow-[0_8px_24px_rgb(0_0_0/0.4)]';
const tile = 'rounded-xl border border-white/10 bg-white/5';
const T = {
  h3: 'text-lg font-bold text-text-primary',
  title: 'text-base font-medium text-text-primary',
  body1: 'text-sm text-text-primary',
  caption: 'text-xs text-text-secondary',
  overline: 'text-xs font-medium uppercase tracking-wider text-text-secondary',
};
const icon = (name, size, extra = '') => `<i data-lucide="${name}" style="width:${size}px;height:${size}px" class="shrink-0 ${extra}"></i>`;
const labelCls = 'block text-sm font-medium text-gray-300 mb-1.5 leading-none';
const inputCls = (mode) => `flex w-full min-w-0 text-text-primary placeholder:text-text-tertiary focus:outline-none h-10 rounded-lg border bg-white/5 px-3 py-2 focus:ring-2 focus:ring-accent border-white/10 ${mode === 'desk' ? 'text-sm' : 'text-base'}`;
const cardHeader = (title, sub) => `<div class="mb-4 flex items-start justify-between gap-2"><div><h3 class="${T.title}">${title}</h3>${sub ? `<p class="${T.caption}">${sub}</p>` : ''}</div></div>`;

const formValue = (key) => {
  const hist = scen()[key];
  if (hist.length === 0) return '';
  const v = hist.at(-1).value;
  if (key === 'pace') return mss(v);
  return String(v);
};

const trendSlot = (key, mode) => `
  <span class="flex min-w-0 items-center justify-end gap-1.5 overflow-hidden">
    <span data-cap="${key}" data-default="${lastChange(key, mode === "desk")}" class="${T.caption} text-text-tertiary min-h-4 truncate tabular-nums">${lastChange(key, mode === "desk")}</span>
    <span class="spark block h-3 w-10 shrink-0" data-spark="${key}"></span>
  </span>`;

const field = (mode, key, extraHelper) => {
  const inline = state.variant === 'inline';
  const id = `${mode}-${key}`;
  const lbl = inline
    ? `<div class="mb-1.5 flex h-4 items-center justify-between gap-2"><label for="${id}" class="${labelCls} mb-0 shrink-0">${t()[V[key].field]}</label>${trendSlot(key, mode)}</div>`
    : `<label for="${id}" class="${labelCls}">${t()[V[key].field]}</label>`;
  return `<div ${key === 'ftp' ? 'data-focus-inline' : ''}>${lbl}<div class="w-full"><input id="${id}" data-input="${key}" type="${key === 'pace' ? 'text' : 'number'}" value="${formValue(key)}" class="${inputCls(mode)}">${extraHelper || ''}</div></div>`;
};

const wkgLive = (ftpStr, weightStr) => {
  const f = Number(ftpStr);
  const w = Number(weightStr);
  if (ftpStr === '' || weightStr === '' || !(f > 0) || !(w > 0)) return '--';
  return nf(2, 2).format(f / w);
};

const wkgField = (mode) => {
  const id = `${mode}-wkg`;
  const val = wkgLive(formValue('ftp'), formValue('weight'));
  return `<div><div class="mb-1.5 flex h-4 items-center justify-between gap-2"><label for="${id}" class="${labelCls} mb-0 shrink-0">${t().wkgL}</label>${trendSlot("wkg", mode)}</div><div class="w-full"><input id="${id}" data-wkg readonly tabindex="-1" value="${val}" class="${inputCls(mode)} bg-transparent border-dashed text-text-secondary cursor-default focus:ring-0"></div></div>`;
};

const thresholdsCard = (mode) => {
  const cols = mode === 'desk' ? 'grid-cols-2' : 'grid-cols-1';
  const inline = state.variant === 'inline';
  const estimate = `<p class="mt-1 text-xs text-text-quaternary"><span class="flex gap-1 text-accent">${icon('info', 16, '')}<button type="button" class="cursor-pointer hover:underline">${t().estimate}</button></span></p>`;
  return `
  <div class="${glass} rounded-2xl flex flex-col p-4">
    ${cardHeader(t().thrTitle, t().thrSub)}
    <div class="space-y-4">
      <div class="grid ${cols} gap-3">
        <div><label class="${labelCls}">${t().gender}</label><button class="flex h-10 w-full items-center justify-between rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-sm text-text-primary cursor-pointer"><span>${t().male}</span>${icon('chevron-down', 12, 'text-text-tertiary')}</button></div>
        <div><label class="${labelCls}">${t().birth}</label><input type="number" value="1990" class="${inputCls(mode)}"></div>
      </div>
      <div class="grid ${cols} gap-3">${field(mode, 'restHr')}${field(mode, 'maxHr')}</div>
      <div class="grid ${cols} gap-3">${field(mode, 'ftp')}${field(mode, 'pace', estimate)}</div>
      <div class="grid ${cols} gap-3">${field(mode, 'weight')}${inline ? wkgField(mode) : ''}</div>
    </div>
    <div class="mt-4 flex justify-end"><button disabled class="inline-flex items-center justify-center gap-2 rounded-lg font-medium bg-accent text-white px-4 py-2 text-sm disabled:opacity-50 disabled:cursor-not-allowed">${t().save}</button></div>
  </div>`;
};

const tilesCard = (mode) => {
  const cols = mode === 'desk' ? 'grid-cols-3' : 'grid-cols-2';
  const tiles = VALUES.map((v) => {
    const empty = historyOf(v.key).length === 0;
    return `
    <div class="${tile} p-3 min-w-0">
      <div class="flex items-center gap-1.5 min-w-0">
        <span class="grid place-items-center" style="color:${v.color}">${icon(v.icon, 12)}</span>
        <span class="${T.overline} truncate">${t()[v.key]}</span>
      </div>
      <p class="${T.h3} leading-tight mt-1 truncate tabular-nums">${latestText(v.key)}<span class="${T.caption} ml-0.5 font-normal">${empty ? '' : v.unit}</span></p>
      <p data-cap="${v.key}" data-default="${lastChange(v.key)}" class="${T.caption} text-text-tertiary min-h-4 truncate tabular-nums">${lastChange(v.key)}</p>
      <div class="spark mt-1.5 h-6 w-full" data-spark="${v.key}"></div>
    </div>`;
  }).join('');
  return `
  <div data-focus class="${glass} rounded-2xl flex flex-col p-4">
    ${cardHeader(t().histTitle)}
    <div class="grid ${cols} gap-2">${tiles}</div>
  </div>`;
};

const chartCard = (mode) => {
  const v = V[state.tab];
  const empty = historyOf(v.key).length === 0;
  const chips = VALUES.map((x) => {
    const disabled = x.key !== 'wkg' && historyOf(x.key).length === 0;
    const on = x.key === state.tab;
    return `<button data-tab="${x.key}" ${disabled ? 'disabled' : ''} class="inline-flex flex-none items-center justify-center gap-1 rounded-lg px-2 py-1 text-xs font-medium text-text-tertiary transition-colors cursor-pointer hover:bg-white/10 hover:text-text-primary ${on ? 'bg-white/10 text-text-primary' : ''} disabled:pointer-events-none disabled:opacity-40">${icon(x.icon, 12)}${t()[x.key]}</button>`;
  }).join('');
  let secondary = '';
  let secondary2 = "";
  if (v.key === "wkg" && !empty) { secondary = `${latestText("ftp")} W`; secondary2 = `${latestText("weight")} kg`; }
  if (v.key !== 'wkg' && !empty) {
    const vals = historyOf(v.key).map((e) => e.value);
    secondary = `${v.fmt(Math.min(...vals))}–${v.fmt(Math.max(...vals))} ${v.unit}`;
  }
  const chartBody = empty
    ? `<div class="relative h-full"><div class="absolute inset-x-0 bottom-[18px] h-px bg-[#252830]"></div><div class="absolute inset-0 grid place-items-center pb-4"><span class="${T.caption} text-text-tertiary">${wkgHint(true)}</span></div></div>`
    : `<div class="spark h-full w-full" data-main="${v.key}"></div>`;
  return `
  <section data-focus class="relative isolate overflow-clip rounded-2xl">
    <div aria-hidden class="${glass} absolute inset-0 -z-10 rounded-[inherit]"></div>
    <div class="flex min-h-[46px] items-center px-3 pt-2 gap-2">
      <span class="flex min-w-0 flex-1 items-center gap-2"><h4 class="${T.title} block text-left truncate">${t().histTitle}</h4></span>
    </div>
    <div class="px-3 pt-1 pb-3">
      <div class="noscroll mb-1 flex gap-1 overflow-x-auto">${chips}</div>
      <div class="h-28 grid grid-cols-[100px_minmax(0,1fr)] gap-3">
        <div class="flex h-full flex-col justify-center overflow-hidden border-r border-white/10 pr-2">
          <div class="flex flex-col gap-2">
            <p data-rail-head class="${T.overline} truncate tabular-nums min-h-4 leading-4">${t().latest}</p>
            <div class="min-w-0">

const logRows = () => {
  const keys = VALUES.map((v) => v.key);
  const byDate = new Map();
  for (const k of keys) {
    const hist = historyOf(k);
    hist.forEach((e, i) => {
      if (!byDate.has(e.date)) byDate.set(e.date, []);
      byDate.get(e.date).push({ key: k, prev: i > 0 ? hist[i - 1].value : undefined, value: e.value });
    });
  }
  const dates = [...byDate.keys()].sort((a, b) => b - a);
  const oldest = dates.at(-1);
  return dates.map((d) => {
    const chips = byDate.get(d).sort((a, b) => keys.indexOf(a.key) - keys.indexOf(b.key)).map((c) => {
      const v = V[c.key];
      const from = c.prev === undefined ? '' : `<span class="text-text-tertiary">${v.fmt(c.prev)} →</span> `;
      return `<span class="inline-flex items-baseline gap-1 rounded-lg border border-white/10 bg-white/5 px-2 py-0.5 ${T.caption} tabular-nums"><span style="${c.key === 'wkg' ? `color:${C.cycling}` : ''}" class="${c.key === 'wkg' ? '' : 'text-text-tertiary'}">${t()[c.key]}</span><span class="text-text-primary">${from}${v.fmt(c.value)}</span><span class="text-text-tertiary">${v.unit}</span></span>`;
    }).join('');
    return `<div class="flex gap-3 py-2"><div class="w-[84px] shrink-0"><p class="${T.caption} text-text-tertiary tabular-nums leading-6">${fmtDate(d)}</p>${d === oldest ? `<p class="${T.caption} text-text-quaternary">${t().start}</p>` : ''}</div><div class="flex min-w-0 flex-wrap gap-1">${chips}</div></div>`;
  }).join('');
};

const xOf = (d, dom, x0, x1) => x0 + ((d - dom[0]) / (dom[1] - dom[0])) * (x1 - x0);

const yScale = (hist, y0, y1) => {
  const vals = hist.map((e) => e.value);
  let lo = Math.min(...vals);
  let hi = Math.max(...vals);
  if (lo === hi) { lo -= Math.abs(lo) * 0.05 || 1; hi += Math.abs(hi) * 0.05 || 1; }
  return { lo, hi, y: (v) => y1 - ((v - lo) / (hi - lo)) * (y1 - y0) };
};

const stepPath = (hist, dom, x0, x1, y) => {
  let p = '';
  hist.forEach((e, i) => {
    const x = xOf(e.date, dom, x0, x1);
    if (i === 0) p += `M${x.toFixed(1)} ${y(e.value).toFixed(1)}`;
    else p += ` H${x.toFixed(1)} V${y(e.value).toFixed(1)}`;
  });
  return `${p} H${x1.toFixed(1)}`;
};

const drawSpark = (el) => {
  const key = el.dataset.spark;
  const hist = historyOf(key);
  const w = el.clientWidth;
  const ht = el.clientHeight;
  const dom = domain();
  if (hist.length === 0) {
    el.innerHTML = `<svg width="${w}" height="${ht}"><line x1="0" x2="${w}" y1="${ht - 1}" y2="${ht - 1}" stroke="#ffffff1a" stroke-dasharray="2 3"/></svg>`;
    return;
  }
  const pad = 2;
  const sc = yScale(hist, pad, ht - pad);
  const last = hist.at(-1);
  el.innerHTML = `<svg width="${w}" height="${ht}" class="block overflow-visible">
    <line data-guide visibility="hidden" x1="0" x2="0" y1="0" y2="${ht}" stroke="#ffffff40"/>
    <path d="${stepPath(hist, dom, pad, w - pad, sc.y)}" stroke="${V[key].color}" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
    <circle cx="${w - pad}" cy="${sc.y(last.value)}" r="2" fill="${V[key].color}"/>
  </svg>`;
  attachHover(el, dom, pad, w - pad, (d) => {
    let scope = el.parentElement;
    while (scope && !scope.querySelector(`[data-cap="${key}"]`)) scope = scope.parentElement;
    const capEl = scope.querySelector(`[data-cap="${key}"]`);
    if (d === null) { capEl.textContent = capEl.dataset.default; capEl.classList.remove('text-text-primary'); return; }
    const entryDate = valueAt(hist.map((e) => ({ date: e.date, value: e.date })), d);
    capEl.textContent = `${fmtDate(entryDate)} · ${V[key].fmt(valueAt(hist, d))} ${V[key].unit}`;
    capEl.classList.add('text-text-primary');
  });
};

const drawMain = (el) => {
  const key = el.dataset.main;
  const v = V[key];
  const hist = historyOf(key);
  const w = el.clientWidth;
  const ht = el.clientHeight;
  const dom = domain();
  const L = 40, B = 18, TP = 6, R = 6;
  const sc = yScale(hist, TP, ht - B);
  const ticks = [sc.lo, (sc.lo + sc.hi) / 2, sc.hi];
  const yt = ticks.map((tv) => `<text x="${L - 6}" y="${sc.y(tv) + 4}" text-anchor="end" fill="${C.textTertiary}" font-size="11">${v.fmt(tv)}</text>`).join('');
  const xt = `<text x="${L}" y="${ht - 4}" fill="${C.textTertiary}" font-size="11">${fmtDate(dom[0])}</text><text x="${w - R}" y="${ht - 4}" text-anchor="end" fill="${C.textTertiary}" font-size="11">${fmtDate(dom[1])}</text>`;
  const dots = hist.map((e) => `<circle data-dot="${e.date}" cx="${xOf(e.date, dom, L, w - R)}" cy="${sc.y(e.value)}" r="3.5" fill="${v.color}" stroke="${C.surface}" stroke-width="1.5"/>`).join('');
  el.innerHTML = `<svg width="${w}" height="${ht}" class="block">
    <line x1="${L}" x2="${w - R}" y1="${ht - B}" y2="${ht - B}" stroke="${C.border}"/>
    ${yt}${xt}
    <line data-guide visibility="hidden" x1="0" x2="0" y1="${TP}" y2="${ht - B}" stroke="#ffffff33"/>
    <path d="${stepPath(hist, dom, L, w - R, sc.y)}" stroke="${v.color}" stroke-width="2" fill="none" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
  const card = el.closest('section');
  const head = card.querySelector('[data-rail-head]');
  const val = card.querySelector('[data-rail-val]');
  const sec = card.querySelector("[data-rail-sec]");
  const sec2 = card.querySelector("[data-rail-sec2]");
  attachHover(el, dom, L, w - R, (d) => {
    el.querySelectorAll('[data-dot]').forEach((c) => { c.setAttribute('r', '3.5'); c.setAttribute('stroke', C.surface); c.setAttribute('stroke-width', '1.5'); });
    if (d === null) {
      head.textContent = t().latest; head.classList.remove('text-text-primary');
      val.textContent = latestText(key); sec.textContent = sec.dataset.default; sec2.textContent = sec2.dataset.default; return;
    }
    head.textContent = fmtDate(d); head.classList.add('text-text-primary');
    val.textContent = v.fmt(valueAt(hist, d));
    if (key === "wkg") { sec.textContent = `${V.ftp.fmt(valueAt(scen().ftp, d))} W`; sec2.textContent = `${V.weight.fmt(valueAt(scen().weight, d))} kg`; }
    const active = valueAt(hist.map((e) => ({ date: e.date, value: e.date })), d);
    const dot = el.querySelector(`[data-dot="${active}"]`);
    if (dot) { dot.setAttribute('r', '4'); dot.setAttribute('stroke', C.textPrimary); dot.setAttribute('stroke-width', '2'); }
  });
};

const attachHover = (el, dom, x0, x1, cb) => {
  const guide = el.querySelector('[data-guide]');
  const move = (ev) => {
    const r = el.getBoundingClientRect();
    const sx = el.clientWidth / r.width;
    const x = Math.max(x0, Math.min(x1, (ev.clientX - r.left) * sx));
    const d = Math.round((dom[0] + ((x - x0) / (x1 - x0)) * (dom[1] - dom[0])) / DAY) * DAY;
    guide.setAttribute("x1", x); guide.setAttribute("x2", x); guide.setAttribute("visibility", "visible");
    cb(d);
  };
  const leave = () => { guide.setAttribute("visibility", "hidden"); cb(null); };
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerdown', move);
  el.addEventListener('pointerleave', leave);
  el.addEventListener('pointerup', (ev) => { if (ev.pointerType !== 'mouse') leave(); });
};
