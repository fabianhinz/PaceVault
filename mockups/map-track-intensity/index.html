/* ---------- data generation ---------- */

const rng = (seed) => () => {
  seed |= 0;
  seed = (seed + 0x6d2b79f5) | 0;
  let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
  return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
};

const makeGraph = (seed, NX, NY, sp) => {
  const R = rng(seed);
  const nodes = [];
  for (let j = 0; j < NY; j++) {
    for (let i = 0; i < NX; i++) {
      nodes.push({ x: i * sp + (R() - 0.5) * sp * 0.7, y: j * sp + (R() - 0.5) * sp * 0.7 });
    }
  }
  const edges = [];
  const adj = nodes.map(() => []);
  const edgeOf = new Map();
  const id = (i, j) => j * NX + i;
  const add = (a, b, major) => {
    const A = nodes[a];
    const B = nodes[b];
    const len = Math.hypot(A.x - B.x, A.y - B.y);
    const bend = (R() - 0.5) * (major ? 0.15 : 0.45);
    const mid = { x: (A.x + B.x) / 2 - ((B.y - A.y) / len) * bend * len, y: (A.y + B.y) / 2 + ((B.x - A.x) / len) * bend * len };
    const k = edges.push({ a, b, len, major, mid }) - 1;
    edgeOf.set(`${a}-${b}`, k);
    edgeOf.set(`${b}-${a}`, k);
    adj[a].push(k);
    adj[b].push(k);
  };
  for (let j = 0; j < NY; j++) {
    for (let i = 0; i < NX; i++) {
      if (i < NX - 1) {
        const major = j % 6 === 3;
        if (major || R() < 0.84) add(id(i, j), id(i + 1, j), major);
      }
      if (j < NY - 1) {
        const major = i % 7 === 3;
        if (major || R() < 0.84) add(id(i, j), id(i, j + 1), major);
      }
      if (i < NX - 1 && j < NY - 1 && R() < 0.07) add(id(i, j), id(i + 1, j + 1), false);
    }
  }
  const W = (NX - 1) * sp;
  const H = (NY - 1) * sp;
  const river = [];
  const ry = H * (0.22 + R() * 0.2);
  const ph = R() * 6;
  for (let x = -sp * 3; x <= W + sp * 3; x += sp / 3) river.push([x, ry + Math.sin(x / (sp * 5) + ph) * sp * 1.6]);
  const lake = { x: W * (0.15 + R() * 0.2), y: H * (0.7 + R() * 0.15), rx: sp * 2.2, ry: sp * 1.2 };
  return { nodes, edges, adj, edgeOf, W, H, sp, river, lake };
};

const nodeNear = (g, x, y) => {
  let best = 0;
  let bd = Infinity;
  g.nodes.forEach((n, i) => {
    const d = Math.hypot(n.x - x, n.y - y);
    if (d < bd && g.adj[i].length > 1) { bd = d; best = i; }
  });
  return best;
};

const shortest = (g, s, target, w) => {
  const n = g.nodes.length;
  const dist = new Float64Array(n).fill(Infinity);
  const prev = new Int32Array(n).fill(-1);
  const heap = [];
  const push = (d, v) => {
    heap.push([d, v]);
    let i = heap.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (heap[p][0] <= heap[i][0]) break;
      [heap[p], heap[i]] = [heap[i], heap[p]];
      i = p;
    }
  };
  const pop = () => {
    const top = heap[0];
    const last = heap.pop();
    if (heap.length) {
      heap[0] = last;
      let i = 0;
      for (;;) {
        const l = 2 * i + 1;
        const r = l + 1;
        let m = i;
        if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
        if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
        if (m === i) break;
        [heap[m], heap[i]] = [heap[i], heap[m]];
        i = m;
      }
    }
    return top;
  };
  dist[s] = 0;
  push(0, s);
  while (heap.length) {
    const top = pop();
    const d = top[0];
    const v = top[1];
    if (d > dist[v]) continue;
    if (v === target) break;
    for (const k of g.adj[v]) {
      const e = g.edges[k];
      const u = e.a === v ? e.b : e.a;
      const nd = d + w[k];
      if (nd < dist[u]) { dist[u] = nd; prev[u] = k; push(nd, u); }
    }
  }
  if (dist[target] === Infinity) return null;
  const path = [target];
  const used = [];
  let v = target;
  while (v !== s) {
    const k = prev[v];
    used.push(k);
    const e = g.edges[k];
    v = e.a === v ? e.b : e.a;
    path.push(v);
  }
  return { nodes: path.reverse(), edges: used };
};

const loopRoute = (g, hub, target, R, noise) => {
  const w1 = new Float64Array(g.edges.length);
  g.edges.forEach((e, k) => { w1[k] = e.len * (1 + noise * R()) * (e.major ? 0.85 : 1); });
  const out = shortest(g, hub, target, w1);
  if (!out) return null;
  const w2 = new Float64Array(g.edges.length);
  g.edges.forEach((e, k) => { w2[k] = e.len * (1 + noise * R()); });
  out.edges.forEach((k) => { w2[k] *= 5; });
  const back = shortest(g, target, hub, w2);
  if (!back) return null;
  return out.nodes.concat(back.nodes.slice(1));
};

const pickTarget = (g, hub, dmin, dmax, R) => {
  const h = g.nodes[hub];
  for (let tries = 0; tries < 400; tries++) {
    const i = Math.floor(R() * g.nodes.length);
    const d = Math.hypot(g.nodes[i].x - h.x, g.nodes[i].y - h.y);
    if (d >= dmin && d <= dmax && g.adj[i].length > 0) return i;
  }
  return hub;
};

const toTrack = (g, nodeList, sport, R, id, dayOffset) => {
  const ox = (R() - 0.5) * 10;
  const oy = (R() - 0.5) * 10;
  const raw = [];
  nodeList.forEach((ni, i) => {
    if (i > 0) {
      const k = g.edgeOf.get(`${nodeList[i - 1]}-${ni}`);
      if (k !== undefined) raw.push(g.edges[k].mid);
    }
    raw.push(g.nodes[ni]);
  });
  const pts = new Float32Array(raw.length * 2);
  let len = 0;
  raw.forEach((p, i) => {
    pts[i * 2] = p.x + ox + (R() - 0.5) * 6;
    pts[i * 2 + 1] = p.y + oy + (R() - 0.5) * 6;
    if (i > 0) len += Math.hypot(pts[i * 2] - pts[i * 2 - 2], pts[i * 2 + 1] - pts[i * 2 - 1]);
  });
  return { id, sport, pts, km: len / 1000, day: dayOffset };
};

const addTracks = (tracks, g, o, R) => {
  const favs = [];
  let guard = 0;
  while (favs.length < o.nFav && guard++ < o.nFav * 20) {
    const loop = loopRoute(g, o.hub, pickTarget(g, o.hub, o.dmin, o.dmax, R), R, 0.35);
    if (loop) favs.push(loop);
  }
  for (let i = 0; i < o.count; i++) {
    let nodes = null;
    if (favs.length && R() < o.pFav) {
      nodes = favs[Math.floor(favs.length * R() * R())];
    } else {
      nodes = loopRoute(g, o.hub, pickTarget(g, o.hub, o.dmin, o.dmax, R), R, 0.8);
    }
    if (nodes) tracks.push(toTrack(g, nodes, o.sport, R, tracks.length, Math.floor(R() * 900)));
  }
};

const scenarioCache = {};
let homeGraph = null;

const buildScenario = (key) => {
  if (scenarioCache[key]) return scenarioCache[key];
  if (!homeGraph) homeGraph = makeGraph(7, 40, 28, 550);
  let g = homeGraph;
  const R = rng(key.length * 977 + key.charCodeAt(0));
  const tracks = [];
  const home = nodeNear(g, g.W * 0.45, g.H * 0.52);
  const work = nodeNear(g, g.W * 0.63, g.H * 0.4);
  const run = { sport: 'running', hub: home, nFav: 9, pFav: 0.78, dmin: 1500, dmax: 4200 };
  const ride = { sport: 'cycling', hub: home, nFav: 4, pFav: 0.6, dmin: 5000, dmax: 10000 };
  if (key === 'dense') {
    addTracks(tracks, g, { ...run, count: 300 }, R);
    addTracks(tracks, g, { ...ride, count: 40 }, R);
  } else if (key === 'mixed') {
    addTracks(tracks, g, { ...run, count: 120 }, R);
    addTracks(tracks, g, { ...ride, count: 120 }, R);
  } else if (key === 'single') {
    addTracks(tracks, g, { ...run, count: 1, nFav: 1, pFav: 1, dmin: 2500, dmax: 3500 }, R);
  } else if (key === 'many') {
    addTracks(tracks, g, { ...run, count: 650, nFav: 10 }, R);
    addTracks(tracks, g, { ...run, hub: work, count: 350, nFav: 8 }, R);
    addTracks(tracks, g, { ...ride, count: 500, nFav: 8, pFav: 0.45, dmin: 4000, dmax: 12000 }, R);
  } else if (key === 'trip') {
    g = makeGraph(23, 34, 24, 600);
    const a = nodeNear(g, g.W * 0.3, g.H * 0.55);
    const b = nodeNear(g, g.W * 0.72, g.H * 0.35);
    addTracks(tracks, g, { sport: 'running', hub: a, nFav: 0, pFav: 0, dmin: 1800, dmax: 3500, count: 2 }, R);
    addTracks(tracks, g, { sport: 'cycling', hub: a, nFav: 0, pFav: 0, dmin: 6000, dmax: 10000, count: 2 }, R);
    addTracks(tracks, g, { sport: 'cycling', hub: b, nFav: 0, pFav: 0, dmin: 5000, dmax: 8000, count: 1 }, R);
  }
  tracks.sort((x, y) => x.day - y.day);
  let bbox;
  if (tracks.length) {
    bbox = [Infinity, Infinity, -Infinity, -Infinity];
    tracks.forEach((tr) => {
      for (let i = 0; i < tr.pts.length; i += 2) {
        bbox[0] = Math.min(bbox[0], tr.pts[i]);
        bbox[1] = Math.min(bbox[1], tr.pts[i + 1]);
        bbox[2] = Math.max(bbox[2], tr.pts[i]);
        bbox[3] = Math.max(bbox[3], tr.pts[i + 1]);
      }
    });
  } else {
    const h = g.nodes[home];
    bbox = [h.x - 4000, h.y - 3000, h.x + 4000, h.y + 3000];
  }
  scenarioCache[key] = { g, tracks, bbox };
  return scenarioCache[key];
};

/* ---------- map drawing ---------- */

const views = {};
const frames = [];

const fitRect = (kind) => {
  if (kind === 'desktop') return { x0: 64, y0: 0, x1: DESKTOP.w * 0.6, y1: DESKTOP.h - 84, m: 80 };
  return { x0: 0, y0: 24, x1: PHONE.w, y1: SHEET_TOP - 12 - 44, m: 28 };
};

const fitView = (kind, bbox) => {
  const r = fitRect(kind);
  const bw = bbox[2] - bbox[0];
  const bh = bbox[3] - bbox[1];
  const mpp = Math.max(bw / (r.x1 - r.x0 - 2 * r.m), bh / (r.y1 - r.y0 - 2 * r.m));
  const cx = (bbox[0] + bbox[2]) / 2;
  const cy = (bbox[1] + bbox[3]) / 2;
  return { mpp, ox: cx - ((r.x0 + r.x1) / 2) * mpp, oy: cy - ((r.y0 + r.y1) / 2) * mpp };
};

const widthPx = (view, units) => {
  if (S.width === 'pixels') return units;
  return Math.max(1, units / view.mpp);
};

const drawBasemap = (ctx, g, v, w, h) => {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#0e0e0e';
  ctx.fillRect(0, 0, w, h);
  const sx = (x) => (x - v.ox) / v.mpp;
  const sy = (y) => (y - v.oy) / v.mpp;
  ctx.fillStyle = '#2C353C';
  ctx.beginPath();
  ctx.ellipse(sx(g.lake.x), sy(g.lake.y), g.lake.rx / v.mpp, g.lake.ry / v.mpp, 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgb(63, 90, 109)';
  ctx.lineWidth = Math.max(2, 60 / v.mpp);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  g.river.forEach((p, i) => { if (i === 0) ctx.moveTo(sx(p[0]), sy(p[1])); else ctx.lineTo(sx(p[0]), sy(p[1])); });
  ctx.stroke();
  [false, true].forEach((major) => {
    ctx.strokeStyle = major ? 'rgba(83, 86, 102, 0.9)' : 'rgba(65, 71, 88, 0.55)';
    ctx.lineWidth = Math.min(major ? 8 : 5, Math.max(major ? 1.4 : 0.8, (major ? 14 : 7) / v.mpp));
    ctx.beginPath();
    g.edges.forEach((e) => {
      if (e.major !== major) return;
      const A = g.nodes[e.a];
      const B = g.nodes[e.b];
      ctx.moveTo(sx(A.x), sy(A.y));
      ctx.lineTo(sx(e.mid.x), sy(e.mid.y));
      ctx.lineTo(sx(B.x), sy(B.y));
    });
    ctx.stroke();
  });
};

const tracePath = (ctx, tr, v) => {
  ctx.beginPath();
  for (let i = 0; i < tr.pts.length; i += 2) {
    const x = (tr.pts[i] - v.ox) / v.mpp;
    const y = (tr.pts[i + 1] - v.oy) / v.mpp;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
};

const drawMap = (fr) => {
  const sc = buildScenario(S.scenario);
  const v = views[`${fr.kind}:${S.scenario}`];
  const ctx = fr.ctx;
  ctx.setTransform(fr.dpr, 0, 0, fr.dpr, 0, 0);
  drawBasemap(ctx, sc.g, v, fr.w, fr.h);
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  const hovered = fr.kind === 'desktop' ? S.hover : null;
  sc.tracks.forEach((tr) => {
    let a = ALPHA[S.preset];
    let width = widthPx(v, 8);
    if (hovered !== null) {
      if (tr.id !== hovered) return;
      a = 255;
      width = widthPx(v, 12);
    }
    const c = SPORT_RGB[tr.sport];
    ctx.strokeStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a / 255})`;
    ctx.lineWidth = width;
    tracePath(ctx, tr, v);
    ctx.stroke();
  });
  ctx.globalCompositeOperation = 'source-over';
};

let drawQueued = false;
const drawMaps = () => {
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => {
    drawQueued = false;
    frames.forEach(drawMap);
    updateCaptions();
  });
};

const hitTest = (fr, lx, ly) => {
  const sc = buildScenario(S.scenario);
  const v = views[`${fr.kind}:${S.scenario}`];
  const tol = Math.max(5, widthPx(v, 8) / 2 + 3);
  for (let n = sc.tracks.length - 1; n >= 0; n--) {
    const tr = sc.tracks[n];
    for (let i = 2; i < tr.pts.length; i += 2) {
      const ax = (tr.pts[i - 2] - v.ox) / v.mpp;
      const ay = (tr.pts[i - 1] - v.oy) / v.mpp;
      const bx = (tr.pts[i] - v.ox) / v.mpp;
      const by = (tr.pts[i + 1] - v.oy) / v.mpp;
      const dx = bx - ax;
      const dy = by - ay;
      const l2 = dx * dx + dy * dy || 1;
      const k = Math.max(0, Math.min(1, ((lx - ax) * dx + (ly - ay) * dy) / l2));
      if (Math.hypot(ax + k * dx - lx, ay + k * dy - ly) <= tol) return tr.id;
    }
  }
  return null;
};

/* ---------- ramps ---------- */

const paintRamp = (canvas) => {
  const a = ALPHA[canvas.dataset.preset];
  const dpr = window.devicePixelRatio || 1;
  const cw = canvas.clientWidth;
  const ch = canvas.clientHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(canvas.width, canvas.height);
  const rows = [SPORT_RGB.running, SPORT_RGB.cycling];
  for (let y = 0; y < canvas.height; y++) {
    const rgb = rows[Math.min(rows.length - 1, Math.floor((y / canvas.height) * rows.length))];
    for (let x = 0; x < canvas.width; x++) {
      const passes = 1 + (9 * x) / Math.max(1, canvas.width - 1);
      const o = (y * canvas.width + x) * 4;
      for (let c = 0; c < 3; c++) img.data[o + c] = Math.min(255, BASE_BG + passes * rgb[c] * (a / 255));
      img.data[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
};

/* ---------- layout ---------- */

const stage = document.getElementById('stage');

const layoutFrames = () => {
  const W = stage.clientWidth;
  const H = stage.clientHeight;
  const capH = 24;
  const gap = 32;
  const pad = 20;
  const showD = S.viewport !== 'phone';
  const showP = S.viewport !== 'desktop';
  const totalW = (showD ? DESKTOP.w : 0) + (showP ? PHONE.w : 0) + (showD && showP ? gap : 0);
  const totalH = Math.max(showD ? DESKTOP.h : 0, showP ? PHONE.h : 0);
  const s = Math.min(1, (W - 2 * pad - (showD && showP ? gap : 0)) / (totalW - (showD && showP ? gap : 0)), (H - 2 * pad - capH) / totalH);
  let x = (W - (totalW - (showD && showP ? gap : 0)) * s - (showD && showP ? gap : 0)) / 2;
  const y = pad + capH + Math.max(0, (H - 2 * pad - capH - totalH * s) / 2);
  stage.querySelectorAll('[data-wrap]').forEach((wrap) => {
    const kind = wrap.dataset.wrap;
    const size = kind === 'desktop' ? DESKTOP : PHONE;
    wrap.style.left = `${x}px`;
    wrap.style.top = `${y}px`;
    wrap.style.width = `${size.w * s}px`;
    wrap.style.height = `${size.h * s}px`;
    wrap.querySelector('[data-frame]').style.transform = `scale(${s})`;
    x += size.w * s + gap;
  });
  frames.forEach((fr) => { fr.scale = s; });
  updateCaptions();
};

const updateCaptions = () => {
  stage.querySelectorAll('[data-caption]').forEach((el) => {
    const kind = el.dataset.caption;
    const fr = frames.find((f) => f.kind === kind);
    const size = kind === 'desktop' ? DESKTOP : PHONE;
    const v = views[`${kind}:${S.scenario}`];
    let wtxt = '8 px';
    if (S.width === 'meters' && v) wtxt = `8 m ≈ ${widthPx(v, 8).toFixed(1)} px`;
    el.textContent = `${kind === 'desktop' ? 'Desktop' : 'Phone'} ${size.w}×${size.h} · shown at ${Math.round((fr?.scale ?? 1) * 100)}% · alpha ${ALPHA[S.preset]}/255 · track width ${wtxt}${kind === 'desktop' ? ' · hover a track, wheel to zoom, drag to pan' : ''}`;
  });
};

const renderControls = () => {
  frames.forEach((fr) => {
    fr.el.querySelector(`[data-ctrl-host="${fr.kind}"]`).innerHTML = controlMarkup(fr.kind);
    const host = fr.el.querySelector(`[data-dialog-host="${fr.kind}"]`);
    if (host) host.innerHTML = S.open.phone ? phoneDialog() : '';
  });
  lucide.createIcons({ icons: lucide.icons });
  document.querySelectorAll('canvas[data-ramp]').forEach(paintRamp);
  updateCaptions();
};

const renderAll = () => {
  store();
  frames.length = 0;
  const parts = [];
  if (S.viewport !== 'phone') parts.push(['desktop', desktopFrame()]);
  if (S.viewport !== 'desktop') parts.push(['phone', phoneFrame()]);
  stage.innerHTML = parts.map((p) => `
    <div data-wrap="${p[0]}" class="absolute">
      <span data-caption="${p[0]}" class="${TY.caption} absolute bottom-full inset-x-0 mb-1.5 truncate text-text-tertiary"></span>
      <div class="absolute inset-0 overflow-hidden rounded-xl ring-1 ring-white/15">${p[1]}</div>
    </div>`).join('');
  const sc = buildScenario(S.scenario);
  stage.querySelectorAll('[data-frame]').forEach((el) => {
    el.classList.add('origin-top-left');
    const kind = el.dataset.frame;
    const size = kind === 'desktop' ? DESKTOP : PHONE;
    const canvas = el.querySelector('[data-map]');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size.w * dpr;
    canvas.height = size.h * dpr;
    const key = `${kind}:${S.scenario}`;
    if (!views[key]) views[key] = fitView(kind, sc.bbox);
    frames.push({ kind, el, canvas, ctx: canvas.getContext('2d'), w: size.w, h: size.h, dpr, scale: 1 });
  });
  renderToolbar();
  renderNotes();
  layoutFrames();
  renderControls();
  bindFrames();
  drawMaps();
};

/* ---------- interaction ---------- */

const setPreset = (p) => {
  if (S.preset === p) return;
  S.preset = p;
  drawMaps();
};

const bindFrames = () => {
  frames.forEach((fr) => {
    fr.el.addEventListener('click', (e) => {
      const target = e.target.closest('[data-act]');
      if (!target || target.disabled) return;
      const act = target.dataset.act;
      if (act === 'open') {
        S.open[fr.kind] = !S.open[fr.kind];
        renderControls();
      } else if (act === 'close') {
        S.open[fr.kind] = false;
        renderControls();
      } else if (act === 'set') {
        setPreset(target.dataset.v);
        S.open[fr.kind] = false;
        renderControls();
      }
    });
    if (fr.kind !== 'desktop') return;
    const canvas = fr.canvas;
    let drag = null;
    const local = (e) => {
      const r = canvas.getBoundingClientRect();
      return [(e.clientX - r.left) / fr.scale, (e.clientY - r.top) / fr.scale];
    };
    canvas.addEventListener('pointerdown', (e) => {
      drag = { x: e.clientX, y: e.clientY };
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointerup', () => { drag = null; });
    canvas.addEventListener('pointermove', (e) => {
      const v = views[`desktop:${S.scenario}`];
      if (drag) {
        v.ox -= ((e.clientX - drag.x) / fr.scale) * v.mpp;
        v.oy -= ((e.clientY - drag.y) / fr.scale) * v.mpp;
        drag = { x: e.clientX, y: e.clientY };
        drawMaps();
        return;
      }
      const p = local(e);
      const hit = hitTest(fr, p[0], p[1]);
      canvas.style.cursor = hit === null ? 'grab' : 'pointer';
      if (hit !== S.hover) { S.hover = hit; drawMaps(); }
    });
    canvas.addEventListener('pointerleave', () => {
      if (S.hover !== null) { S.hover = null; drawMaps(); }
    });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const v = views[`desktop:${S.scenario}`];
      const p = local(e);
      const wx = v.ox + p[0] * v.mpp;
      const wy = v.oy + p[1] * v.mpp;
      v.mpp *= Math.exp(e.deltaY * 0.0015);
      v.mpp = Math.max(0.4, Math.min(200, v.mpp));
      v.ox = wx - p[0] * v.mpp;
      v.oy = wy - p[1] * v.mpp;
      drawMaps();
    }, { passive: false });
    canvas.addEventListener('dblclick', () => {
      views[`desktop:${S.scenario}`] = fitView('desktop', buildScenario(S.scenario).bbox);
      drawMaps();
    });
    fr.el.querySelectorAll('[data-track]').forEach((row) => {
      row.addEventListener('mouseenter', () => { S.hover = Number(row.dataset.track); drawMaps(); });
      row.addEventListener('mouseleave', () => { S.hover = null; drawMaps(); });
    });
  });
};

document.addEventListener('pointerdown', (e) => {
  if (!S.open.desktop) return;
  if (e.target.closest('[data-popover]') || e.target.closest('[data-trigger]')) return;
  S.open.desktop = false;
  renderControls();
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || (!S.open.desktop && !S.open.phone)) return;
  S.open.desktop = false;
  S.open.phone = false;
  renderControls();
});
