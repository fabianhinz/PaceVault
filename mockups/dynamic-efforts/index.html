const TYPO = {

const ty = (variant, text, opts = {}) => {

const TOK = { chartHr: '#ef4444', chartPower: '#3b82f6', chartPace: '#06b6d4', chartCadence: '#f59e0b', running: '#4ade80', cycling: '#f97316' };

// ───────────────────────────── state ─────────────────────────────
const S = {

// ───────────────────────────── i18n ─────────────────────────────
const I18N = {

    lap: 'Runde {n}', split: 'Split {n}', inclStop: 'inkl. {d} Stopp',

    faster: 'schneller als Ø', slower: 'langsamer', rowPrimary: '{count} · Ø {value}', lapsOffRow: 'Runden aus', lapsOffHint: 'Wähle Geräterunden oder Splits über „Runden“',

const t = (key, p = {}) => { let s = I18N[S.lang][key] ?? key; for (const k in p) s = s.replace(`{${k}}`, p[k]); return s; };
const withLang = (lang, fn) => { const o = S.lang; S.lang = lang; try { return fn(); } finally { S.lang = o; } };
const nf = (d) => new Intl.NumberFormat(S.lang === 'de' ? 'de-DE' : 'en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const nameOf = (cls, n, sport) => {
  if (cls === 'warmup') return t(sport === 'run' ? 'warmRun' : 'warm'); // Q6 settled: Einfahren / Einlaufen
  if (cls === 'cooldown') return t(sport === 'run' ? 'coolRun' : 'cool');
  if (cls === 'steady') return t('steadyN', { n });

// ───────────────────────────── profile ─────────────────────────────
const PROFILE = { ftp: 250, thrPaceSecPerKm: 255, restHr: 50, maxHr: 190 };
const profileNow = () => ({
  ftp: S.profile === 'both' || S.profile === 'noPace' ? PROFILE.ftp : undefined,
  thrSpeed: S.profile === 'both' || S.profile === 'noFtp' ? 1000 / PROFILE.thrPaceSecPerKm : undefined,
  restHr: PROFILE.restHr, maxHr: PROFILE.maxHr,
});


// ───────────────────────────── synthetic data ─────────────────────────────
const rideSpeed = (P, g) => {
  if (P <= 5) { if (g < -0.005) return Math.min(16, 8 + 250 * -g); return 4; }
  let v = 8;
  for (let k = 0; k < 25; k++) { const f = 0.192 * v ** 3 + (3.1 + 785 * g) * v - P; const d = 0.576 * v * v + 3.1 + 785 * g; v = clamp(v - f / Math.max(d, 0.5), 1.5, 18); }
  return v;
};
const hrFilter = (target, tauRise, tauFall, start = 95) => {
  const out = new Float64Array(target.length); let h = start;
  for (let i = 0; i < target.length; i++) { const tau = target[i] > h ? tauRise(i) : tauFall(i); h += (target[i] - h) * (1 - Math.exp(-1 / tau)); out[i] = h; }
  return out;
};
const build = (segs, r) => { const P = [], cls = []; for (const sg of segs) for (let i = 0; i < sg.dur; i++) { P.push(Math.max(0, sg.p(i, sg.dur, r))); cls.push(sg.cls); } return { P, cls }; };

const finishRide = (o) => {
  const r = rng(o.seed + 7); const N = o.P.length; const HRR = PROFILE.maxHr - PROFILE.restHr;
  const grade = Array.from({ length: N }, (_, i) => o.gradeFn(i));
  const stop = o.stop || (() => false);
  const target = o.P.map((p, i) => stop(i) ? PROFILE.restHr + HRR * 0.42 : PROFILE.restHr + HRR * clamp(0.25 + 0.62 * p / PROFILE.ftp, 0.35, 0.95));
  const hr = hrFilter(target, o.tauRise || (() => 25), o.tauFall || (() => 40));
  const recs = []; let v = 7; let next = 0;
  for (let i = 0; i < N; i++) {
    const vt = stop(i) ? 0 : rideSpeed(o.P[i], grade[i]);
    v = stop(i) ? 0 : v + (vt - v) * 0.12;
    if (o.dropout && o.dropout(i)) continue;
    if (o.smart && i < next && i !== N - 1) continue;
    if (o.smart) next = i + 1 + Math.floor(r() * 8);
    recs.push({ t: i, power: o.noPower || (o.powerMissing && o.powerMissing(i)) ? undefined : Math.round(o.P[i]), hr: o.noHr ? undefined : Math.round(hr[i] + gauss(r) * 0.6), speed: o.noSpeed ? undefined : Math.max(0, Math.round((v + (v > 0 ? gauss(r) * 0.08 : 0)) * 100) / 100), grade: grade[i] });
  }
  return recs;
};

const SCN = {
  intervals: { label: '5×4 min cycling intervals (power + HR)', sport: 'ride', title: { en: 'Tuesday intervals', de: 'Intervalle am Dienstag' }, gen() {
    const r = rng(11); const segs = [{ dur: 903, cls: 'warmup', p: (i, d) => 120 + 55 * i / d + gauss(r) * 15 }];
    for (let k = 0; k < 5; k++) {
      segs.push({ dur: 240, cls: 'work', p: (i) => 300 + (i < 4 ? 90 : 0) + 10 * Math.sin(i / 40 + k) + gauss(r) * 18 });
      segs.push({ dur: 180, cls: k < 4 ? 'rest' : 'cooldown', p: (i) => (i % 47 > 40 ? 0 : 120 + gauss(r) * 15) });
    }
    segs.push({ dur: 600, cls: 'cooldown', p: () => 125 + gauss(r) * 15 });
    const b = build(segs, r);
    return { ...b, recs: finishRide({ seed: 11, P: b.P, gradeFn: (i) => 0.01 * Math.sin(i / 200) }), dev: 'truth' };
  } },
  endurance: { label: '3 h endurance, rolling hills + coasting zeros', sport: 'ride', title: { en: 'Long Sunday ride', de: 'Lange Sonntagsrunde' }, gen() {
    const r = rng(21); const N = 10800; const gfn = (i) => 0.035 * Math.sin(2 * Math.PI * i / 900) + 0.015 * Math.sin(2 * Math.PI * i / 370 + 1) + 0.008 * Math.sin(2 * Math.PI * i / 2400);
    const P = [], cls = [];
    for (let i = 0; i < N; i++) { const g = gfn(i); let p = g < -0.025 ? 0 : Math.min(205, Math.max(70, 172 + 900 * g)) + gauss(r) * 22; P.push(Math.max(0, p)); cls.push('steady'); }

const SHAPES = {

  return `<rect width="${w}" height="${h}" fill="#0e0e0e"/><path d="M${w * 0.62} 0 C ${w * 0.5} ${h * 0.3}, ${w * 0.85} ${h * 0.55}, ${w * 0.7} ${h}" stroke="rgb(63,90,109)" stroke-width="5" fill="none"/><ellipse cx="${w * 0.12}" cy="${h * 0.82}" rx="${w * 0.12}" ry="${h * 0.07}" fill="#2C353C"/>${roads}`;

const STRIP_W = 400, STRIP_H = 64;
