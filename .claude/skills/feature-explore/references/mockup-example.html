<!doctype html>
<html lang="en">
  <!-- Worked example. The ../../_shared/ links resolve only once this file is copied to
       workbench/<feature>/mockup/index.html; it does not render where it sits. -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Startup loader · Mockup (shell demo)</title>
    <link rel="stylesheet" href="../../_shared/mockup-shell.css" />
    <style>
      /* Mockup-specific styles: only the screen content. Tokens come from tokens.css. */
      .ms-screen [hidden] {
        display: none !important;
      }
      .scr {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          repeating-linear-gradient(0deg, transparent 0 63px, var(--wb-tile-bg) 63px 64px),
          repeating-linear-gradient(90deg, transparent 0 63px, var(--wb-tile-bg) 63px 64px),
          var(--color-surface-base);
        color: var(--color-text-secondary);
        font: var(--text-sm) / var(--leading-6) var(--font-sans);
      }
      .card {
        width: min(26rem, calc(100% - 2 * var(--spacing-6)));
        padding: var(--spacing-6);
        border: 1px solid var(--wb-hairline);
        border-radius: var(--radius-lg);
        background: var(--wb-floating-bg);
        text-align: center;
      }
      .card h1 {
        margin: var(--spacing-4) 0 var(--spacing-1);
        color: var(--color-text-primary);
        font-size: var(--text-lg);
      }
      .card p {
        margin: var(--spacing-1) 0;
      }
      .meta {
        color: var(--color-text-tertiary);
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto;
        border-radius: 9999px;
      }
      [data-variant='l3'] .logo {
        border: 3px solid var(--color-surface-overlay);
        border-top-color: var(--color-accent);
        animation: spin 1.5s linear infinite;
      }
      [data-variant='fade'] .logo {
        background: var(--color-accent-muted);
        animation: pulse 3s ease-in-out infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      .tracks {
        position: absolute;
        left: 0;
        right: 0;
        bottom: var(--spacing-6);
        text-align: center;
        color: var(--color-text-tertiary);
      }
      [data-device='phone'] .tracks {
        bottom: var(--spacing-12);
      }
      [data-slow='on'] .logo {
        animation-duration: 4s;
      }
    </style>
  </head>
  <body>
    <script type="application/json" id="mockup-config">
      {
        "title": "Startup loader",
        "variants": [
          { "id": "l3", "label": "A · L3 loader" },
          { "id": "fade", "label": "B · Fade only" }
        ],
        "scenarios": [
          { "id": "warm", "label": "Warm cache" },
          { "id": "cold", "label": "Cold start" },
          { "id": "large", "label": "2,000 sessions" }
        ],
        "extras": [
          { "id": "slow", "type": "toggle", "label": "Slow CPU", "default": "off" },
          { "id": "replay", "type": "button", "label": "Replay" }
        ],
        "decisions": [
          {
            "id": "Q1",
            "title": "Minimum display time",
            "status": "open",
            "options": "(a) 3 s on every start · (b) only on the first start · (c) finish the current cycle (~1.5 s)"
          },
          {
            "id": "Q2",
            "title": "Hand-off while GPS is still loading",
            "status": "settled",
            "answer": "Hand off early; tracks draw in as they arrive."
          },
          {
            "id": "Q3",
            "title": "When the loader paints",
            "status": "open",
            "options": "(a) from index.html before React · (b) once React mounts"
          },
          {
            "id": "Q4",
            "title": "Large libraries",
            "status": "open",
            "options": "(a) cap the draw-in at the newest N tracks · (b) draw every track"
          }
        ]
      }
    </script>

    <template id="mockup-screen">
      <div class="scr">
        <div class="card">
          <div class="logo"></div>
          <h1 data-de="Kartendaten werden geladen…">Loading map data…</h1>
          <p>
            <span data-when="scenario:warm" data-de="Cache warm · 0,4 s">Warm cache · 0.4 s</span>
            <span data-when="scenario:cold" data-de="Kaltstart · 4,1 s">Cold start · 4.1 s</span>
            <span data-when="scenario:large" data-de="2.000 Einheiten · 6,8 s"
              >2,000 sessions · 6.8 s</span
            >
            <span data-q="Q1"></span>
          </p>
          <p
            class="meta"
            data-when="variant:l3"
            data-de="Variante A: L3-Loader, Übergabe am Zyklusende"
          >
            Variant A: L3 loader, hand-off at a cycle boundary
          </p>
          <p
            class="meta"
            data-when="variant:fade"
            data-de="Variante B: Logo blendet aus, keine Zyklen"
          >
            Variant B: the logo fades out, no cycles
          </p>
        </div>
        <p class="tracks">
          <span data-de="Spuren zeichnen sich ein, sobald sie geladen sind"
            >Tracks draw in as they load</span
          ><span data-q="Q2"></span>
        </p>
      </div>
    </template>

    <template id="mockup-notes">
      <p>
        <strong>What this shows.</strong> The app start with the loader painted first; map, sessions
        and GPS load behind it, then the camera jumps to the final view and the tracks draw in.
      </p>
      <p>
        <strong>Scenarios</strong> change the load time only. <strong>Slow CPU</strong> stretches
        the animation as a 4× throttle would.
      </p>
      <p>Plan: <code>workbench/startup-loader/plan.md</code>.</p>
    </template>

    <script src="../../_shared/mockup-shell.js"></script>
    <script>
      MockupShell.onAction('replay', () => {
        for (const s of MockupShell.screens()) {
          const logo = s.querySelector('.logo');
          logo.style.animation = 'none';
          void logo.offsetWidth;
          logo.style.animation = '';
        }
      });
    </script>
  </body>
</html>
