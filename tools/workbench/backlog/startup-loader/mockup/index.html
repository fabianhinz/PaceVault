<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Startup loader · Mockup</title>
    <link rel="stylesheet" href="../../../shared/mockup-shell.css" />
    <script src="../../../shared/mockup-shell.js" defer></script>
    <script src="routes.js" defer></script>
    <script src="startup.js" defer></script>
    <style>
      /* Screen content only. Tokens from tools/workbench/shared/tokens.css. */
      .ms-screen [hidden] {
        display: none !important;
      }
      .scr {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--color-surface-base);
        color: var(--color-text-primary);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      .scr * {
        box-sizing: border-box;
      }

      /* Typography variants (packages/ui/src/components/Typography.tsx) */
      .t-h2 {
        margin: 0;
        font-size: 1.25rem;
        line-height: 1.75rem;
        font-weight: 700;
        color: var(--color-text-primary);
      }
      .t-title {
        margin: 0;
        font-size: var(--text-base);
        line-height: var(--leading-6);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-primary);
      }
      .t-body1 {
        margin: 0;
        font-size: var(--text-sm);
        line-height: var(--leading-5);
        font-weight: 400;
        color: var(--color-text-primary);
      }
      .t-subtitle1 {
        margin: 0;
        font-size: var(--text-sm);
        line-height: var(--leading-5);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-primary);
      }
      .t-caption {
        margin: 0;
        font-size: var(--text-xs);
        line-height: 1rem;
        font-weight: 400;
        color: var(--color-text-secondary);
      }
      .t-overline {
        margin: 0;
        font-size: var(--text-xs);
        line-height: 1rem;
        font-weight: var(--font-weight-medium);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--color-text-secondary);
      }
      .c-secondary {
        color: var(--color-text-secondary);
      }
      .c-tertiary {
        color: var(--color-text-tertiary);
      }
      .tnum {
        font-variant-numeric: tabular-nums;
      }

      /* Map: basemap canvas + track canvas (additive, like ADDITIVE_BLEND on gps-tracks) */
      .app {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      .app.is-mounted {
        opacity: 1;
      }
      .map {
        position: absolute;
        inset: 0;
      }
      .map canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .map .map-base {
        opacity: 0;
        transition: opacity 300ms linear;
      }
      .map .map-base.is-loaded {
        opacity: 1;
      }
      .map .map-tracks {
        mix-blend-mode: plus-lighter;
      }
      .map.is-pointer {
        cursor: pointer;
      }

      /* Surfaces (packages/ui/src/components/Card.tsx) */
      .glass {
        background: color-mix(in srgb, var(--color-surface) 55%, transparent);
        backdrop-filter: blur(var(--wb-blur-xl));
        -webkit-backdrop-filter: blur(var(--wb-blur-xl));
        border: 1px solid var(--wb-hairline);
      }
      .floating {
        background: var(--wb-floating-bg);
        backdrop-filter: blur(var(--wb-blur-xl));
        -webkit-backdrop-filter: blur(var(--wb-blur-xl));
        border: 1px solid var(--wb-hairline);
        box-shadow: var(--wb-floating-shadow);
      }
      .tile {
        border-radius: var(--radius-lg);
        border: 1px solid var(--wb-hairline);
        background: var(--wb-tile-bg);
      }
      .card {
        display: flex;
        flex-direction: column;
        padding: var(--spacing-4);
        border-radius: 1rem;
        pointer-events: auto;
      }
      .card__head {
        margin-bottom: var(--spacing-4);
      }
      .card__foot {
        margin-top: var(--spacing-4);
        padding-top: var(--spacing-3);
        border-top: 1px solid var(--wb-hairline);
      }

      /* Content column (desktop, AppLayout main: max-w 40dvw, p-6, pl-0) / bottom sheet (phone) */
      .panel {
        position: absolute;
        z-index: 10;
        pointer-events: none;
      }
      .panel__body {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-4);
      }
      [data-device='desktop'] .panel {
        top: 0;
        right: 0;
        width: 512px;
        padding: var(--spacing-6) var(--spacing-6) 0 0;
      }
      [data-device='phone'] .panel {
        left: 0;
        right: 0;
        bottom: 0;
        height: 776.48px;
        transform: translateY(295.24px);
        border-radius: 1rem 1rem 0 0;
        border-left: 0;
        border-right: 0;
        border-bottom: 0;
        background: color-mix(in srgb, var(--color-surface) 55%, transparent);
        backdrop-filter: blur(var(--wb-blur-xl));
        -webkit-backdrop-filter: blur(var(--wb-blur-xl));
        border-top: 1px solid var(--wb-hairline);
        pointer-events: auto;
      }
      .panel__handle {
        display: none;
      }
      [data-device='phone'] .panel__handle {
        display: flex;
        height: 48px;
        align-items: center;
        justify-content: center;
      }
      .panel__handle span {
        width: 40px;
        height: 4px;
        border-radius: 9999px;
        background: rgb(255 255 255 / 0.3);
      }
      [data-device='phone'] .panel__body {
        padding: 0 var(--spacing-6);
      }
      [data-device='desktop'] .panel .card.glass,
      [data-device='desktop'] .panel .card.tile-card {
        background: color-mix(in srgb, var(--color-surface) 55%, transparent);
      }
      [data-device='phone'] .panel .card {
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border: 0;
        padding: 0;
      }
      .gauges {
        display: flex;
        justify-content: center;
        gap: var(--spacing-6);
      }
      .gauge {
        width: 112px;
        height: 64px;
        border-radius: 112px 112px 0 0;
        border: 8px solid var(--color-surface-overlay);
        border-bottom: 0;
      }
      .bars {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 96px;
      }
      .bars span {
        flex: 1;
        border-radius: 2px 2px 0 0;
        background: var(--color-surface-overlay);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--spacing-2);
      }
      .stats .tile {
        padding: var(--spacing-3);
        display: flex;
        flex-direction: column;
        gap: var(--spacing-1);
      }
      .btn {
        display: inline-flex;
        align-self: flex-start;
        align-items: center;
        height: 36px;
        padding: 0 var(--spacing-4);
        border: 0;
        border-radius: 9999px;
        background: var(--color-accent);
        color: #fff;
        font-family: inherit;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-2);
      }

      /* Dock (apps/web/src/components/layout/Dock.tsx, DockItems.tsx) */
      .dock {
        position: absolute;
        z-index: 50;
        display: flex;
        gap: var(--spacing-2);
      }
      .dock__seg {
        position: relative;
        display: flex;
        border-radius: 9999px;
      }
      .dock__item {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        border-radius: 9999px;
        color: var(--color-text-tertiary);
      }
      .dock__item.is-active {
        background: var(--color-accent-muted);
        color: var(--color-accent-hover);
      }
      .dock__item svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      [data-device='desktop'] .dock {
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        flex-direction: column;
      }
      [data-device='desktop'] .dock__seg {
        flex-direction: column;
        gap: 4px;
        padding: 4px;
      }
      [data-device='desktop'] .dock__item {
        width: 40px;
        height: 40px;
      }
      [data-device='desktop'] .dock__circle {
        display: none;
      }
      [data-device='phone'] .dock {
        left: 12px;
        right: 12px;
        bottom: 12px;
        height: 52px;
      }
      [data-device='phone'] .dock__seg--tabs {
        flex: 1;
        min-width: 0;
        gap: 2px;
        padding: 3px;
      }
      [data-device='phone'] .dock__seg--tabs .dock__item {
        flex: 1;
        min-width: 0;
        height: 44px;
      }
      [data-device='phone'] .dock__seg--tools {
        display: none;
      }
      [data-device='phone'] .dock__circle {
        padding: 3px;
      }
      [data-device='phone'] .dock__circle .dock__item {
        width: 44px;
        height: 44px;
      }
      [data-device='phone'] .dock__circle--filter {
        order: 3;
      }
      [data-device='phone'] .dock__seg--tabs {
        order: 2;
      }

      /* Inline loader (new: apps/web/index.html), overlayClass look: surface-base/85 + blur 8 px */
      .boot {
        position: absolute;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: rgb(3 7 18 / 0.85);
        backdrop-filter: blur(var(--boot-blur, 8px));
        -webkit-backdrop-filter: blur(var(--boot-blur, 8px));
      }
      .boot.is-gone {
        display: none;
      }
      .boot.is-passive {
        pointer-events: none;
      }
      .boot__logo {
        width: 96px;
        height: 96px;
        display: block;
      }
      .boot__qs {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(50% + 64px);
        display: flex;
        justify-content: center;
        gap: var(--spacing-1);
      }

      /* Mockup-only timeline readout, styled as FloatingPill (packages/ui/src/components/FloatingPill.tsx) */
      .readout {
        position: absolute;
        z-index: 200;
        top: 12px;
        left: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--spacing-1);
        pointer-events: none;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-2);
        width: 366px;
        padding: var(--spacing-2) var(--spacing-3);
        border-radius: 9999px;
        white-space: nowrap;
      }
      .pill__ms {
        width: 60px;
        flex-shrink: 0;
        text-align: right;
      }
      .pill__phase {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--color-text-primary);
      }
      .pill__lock {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-1);
        flex-shrink: 0;
      }
      .pill__lock svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .pill__lock.is-locked {
        color: var(--color-status-warning);
      }
      .pill__lock.is-open {
        color: var(--color-status-success);
      }
      .pill__dot {
        width: 1px;
        height: 12px;
        background: var(--wb-hairline);
        flex-shrink: 0;
      }
      .readout__qs {
        display: flex;
        flex-wrap: wrap;
        gap: var(--spacing-1);
        max-width: 366px;
        pointer-events: auto;
      }
      .scr .ms-q {
        pointer-events: auto;
      }
    </style>
  </head>

    <template id="mockup-notes">
      <p>
        <strong>What this shows.</strong> A page reload: the inline loader paints first (new, in
        <code>apps/web/index.html</code>), React mounts behind it with the camera already at the
        final view (no flight), the loader hands off and <code>gps-tracks</code> draws in as a
        TripsLayer. Variant = loader timing (A–E), Draw-in = choreography (V1–V6); every
        combination plays. Replay or any change restarts from the first paint.
      </p>
      <p><strong>This run</strong> (ms from first paint): <span id="live-timeline">–</span></p>
      <p>
        <strong>Timeline readout</strong> (top left, styled as <code>FloatingPill</code>): a
        mockup-only aid, not part of the design. Shows elapsed ms, phase (loading · hand-off ·
        draw-in · done) and whether picking is locked (Q4). Speed slows the whole clock down.
      </p>

      <h3>Loader variants (warm = ready 400 ms · cold = ready 2,600 ms)</h3>
      <p>
        <strong>A · L3 at 1.5 s.</strong> Today's rule at half the cycle: smallest change, one
        timing for startup and onboarding. Warm: logo 0–1,500, fade 1,500–1,900, draw-in from
        1,900. Cold: hand-off at 3,000, draw-in from 3,400.
      </p>
      <p>
        <strong>B · Rush to the boundary.</strong> Today's 3.0 s look; once ready (floor 800) the
        strokes run 3× to the cycle end (≤ 1,000), then 300 fade. Warm: rush 800–1,533, fade to
        1,833, draw-in from 1,833. Cold: rush 2,600–2,733, draw-in from 3,033. Research pick.
      </p>
      <p>
        <strong>C · Quiet start.</strong> Glass only at first; the logo fades in (400) only if not
        ready at 700, then runs as A from that moment. Warm: glass fade 400–650, draw-in from 650,
        no logo. Cold: logo from 700, hand-off at 3,700, draw-in from 4,100.
      </p>
      <p>
        <strong>D · Glass lifts.</strong> As A, but the glass fades over 600 while its blur goes
        8 → 0 px and the draw-in starts underneath at the boundary. Warm: 1,500–2,100, draw-in
        from 1,500. Cold: 3,000–3,600, draw-in from 3,000.
      </p>
      <p>
        <strong>E · Floor and cut.</strong> 3.0 s look, no cycle lock: fades at ready once 1,000
        passed, even mid-stroke, the logo scaling to 0.92 over the 400 fade. Warm: 1,000–1,400,
        draw-in from 1,400. Cold: 2,600–3,000, draw-in from 3,000.
      </p>
      <p>
        Cap (Q13): no ready after 10,000 → the loader fades at once with the variant's fade; tracks
        arriving later (here 12,500) just appear. Ready never waits for tiles: the basemap fades
        in on its own clock in every scenario.
      </p>

      <h3>Draw-ins (0 = draw-in start; timestamps baked per vertex as in TripsLayer)</h3>
      <p>
        <strong>V1 Bloom</strong>: all tracks 0–1,500, one easeOutCubic. <strong>V2 Scatter</strong>:
        seeded random start order over 0–1,000, 800–1,400 per track, easeOutCubic, ≤ 2,400.
        <strong>V3 Ripple</strong>: start by the start point's distance from the fitted view's
        centre, 0–1,200, 1,200 each. <strong>V4 Timeline</strong>: oldest → newest by date,
        starts over 0–3,000, 600 each. <strong>V5 Comets</strong>: V2 plus bright heads (trail
        250, fading), gone at the end. <strong>V6 Ground speed</strong>: one ground speed (the
        75th-percentile track takes 1,500), linear, stagger 0–300, every track capped to end by
        2,500.
      </p>
      <p>
        Brightness during the draw-in is the chosen Track intensity (Q11: faint 80, warm 160, hot
        255 of 255), so the last frame equals the final map. Hover (desktop) or tap (phone)
        highlights a track only once the readout shows picking on.
      </p>

      <ul>
