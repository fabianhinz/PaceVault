<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Pass compare (R51) · Mockup</title>
    <link rel="stylesheet" href="../../../../shared/mockup-shell.css" />
    <style>
      .ms-screen [hidden] {
        display: none !important;
      }
      .scr {
        --best: #fbbf24;
        --ink: var(--color-gray-300);
        --ink2: var(--color-gray-500);
        --sk: 255px 14px 225px 14px / 14px 225px 14px 255px;
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--color-gray-950);
        color: var(--ink);
        font: var(--text-sm) / var(--leading-5) var(--font-sans);
      }
      .scr button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .sk {
        border: 1.5px solid var(--ink2);
        border-radius: var(--sk);
      }
      .scr button.sk {
        border: 1.5px solid var(--ink2);
      }
      .t1 {
        color: var(--color-gray-100);
      }
      .t3 {
        color: var(--ink2);
      }
      .xs {
        font-size: var(--text-xs);
        line-height: 1rem;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .best {
        color: var(--best);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .trunc {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .map {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 58%;
        background:
          repeating-linear-gradient(45deg, transparent 0 22px, rgb(255 255 255 / 0.03) 22px 23px),
          var(--color-gray-900);
      }
      .map svg {
        position: absolute;
        inset: 20%;
        width: 60%;
        height: 60%;
        color: var(--ink2);
      }
      [data-device='phone'] .map {
        right: 0;
        width: auto;
        bottom: auto;
        height: 250px;
      }
      .panel {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 42%;
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
        scrollbar-width: none;
      }
      [data-device='phone'] .panel {
        top: 236px;
        left: 0;
        width: auto;
        padding: 0 16px 24px;
        background: var(--color-gray-900);
        border-top: 1.5px solid var(--ink2);
        border-radius: 18px 22px 0 0;
      }
      .grab {
        display: none;
      }
      [data-device='phone'] .grab {
        display: block;
        width: 40px;
        height: 4px;
        margin: 8px auto 0;
        border-radius: 9999px;
        background: var(--ink2);
        flex-shrink: 0;
      }
      .tile {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .card {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        position: relative;
        flex-shrink: 0;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 8px;
        text-align: left;
      }
      .item:hover {
        background: rgb(255 255 255 / 0.06);
      }
      .scr .item.bst {
        border-color: var(--best);
      }
      .item .tile {
        width: 28px;
        height: 28px;
      }
      .items {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      /* the sticky block: strip + selected-pass line */
      .sticky {
        position: sticky;
        top: 8px;
        z-index: 4;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 6px;
        border-radius: 14px;
        background: var(--color-gray-800);
        border: 1.5px solid var(--ink2);
        box-shadow: var(--wb-floating-shadow);
        flex-shrink: 0;
      }
      .strip {
        display: flex;
        align-items: stretch;
        gap: 2px;
        overflow-x: auto;
        scrollbar-width: none;
        position: relative;
      }
      .chip {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 2px;
        padding: 3px 2px 2px;
        border: 1.5px solid transparent;
        border-radius: 10px;
        cursor: pointer;
        white-space: nowrap;
        user-select: none;
      }
      .chip:hover {
        background: rgb(255 255 255 / 0.06);
      }
      .chip.on {
        border-color: var(--color-gray-100);
        background: rgb(255 255 255 / 0.1);
      }
      .chip.bst {
        border-color: var(--best);
      }
      .chip.on {
        cursor: default;
      }
      .chip.cmp {
        border: 1.5px dashed var(--color-gray-100);
      }
      .chip svg {
        height: 36px;
        overflow: visible;
      }
      .chip.roomy {
        width: 56px;
      }
      .xrow {
        display: grid;
        grid-template-columns: 88px minmax(0, 1fr);
        gap: 10px;
        height: 80px;
        flex-shrink: 0;
      }
      .rail {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        padding-right: 8px;
        border-right: 1.5px dashed var(--ink2);
      }
      .xrow .chart {
        border: 1.5px dashed var(--ink2);
        border-radius: 8px;
        position: relative;
      }
      .xrow svg {
        position: absolute;
        inset: 6px;
        width: calc(100% - 12px);
        height: calc(100% - 12px);
      }
      .session {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: var(--color-gray-950);
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .ghost {
        border: 1.5px dashed var(--ink2);
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <script type="application/json" id="mockup-config">
      {
        "title": "Segments · pass strip (R51) · round 4 (S1 final)",
        "variants": [{ "id": "s1", "label": "S1 · Date + dot, item under strip" }],
        "scenarios": [
          { "id": "from", "label": "From a session (?from=)" },
          { "id": "latest", "label": "Latest selected" },
          { "id": "best", "label": "Best selected" },
          { "id": "many", "label": "Many passes (90)" },
          { "id": "few", "label": "Few passes (3)" }
        ],
        "extras": [
          {
            "id": "bestview",
            "type": "choice",
            "label": "Explorer, best selected",
            "default": "single",
            "options": [
              { "id": "single", "label": "a · Best only (amber line)" },
              { "id": "runnerup", "label": "b · Best vs 2nd fastest" }
            ]
          }
        ],
        "decisions": []
      }
    </script>

    <template id="mockup-screen">
      <div class="scr">
        <div class="map">
          <svg viewBox="0 0 100 60" aria-hidden="true">
            <path
              d="M5 50 C 25 10, 45 55, 60 25 S 90 15, 95 8"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-dasharray="3 2"
            />
          </svg>
        </div>
        <div class="panel">
          <div class="grab"></div>
          <div class="row">
            <span class="tile sk">⌁</span>
            <div class="grow">
              <div class="t1 trunc">Isar loop · Reichenbach → Wittelsbacher</div>
              <div class="xs t3 num facts"></div>
            </div>
            <span class="t3">⋯</span>
          </div>
          <div class="body" style="display: contents"></div>
        </div>
        <div class="overlay"></div>
      </div>
    </template>

    <template id="mockup-notes">
      <p>
        <strong>Round 4: S1 final.</strong> No tabs: under the segment header sits the sticky pass
        strip, then the charts explorer. The strip lists every pass in date order (newest at the
        right, scrolled there on open); each chip shows its short date and a dot at its time on a
        robust scale (best → 90th percentile; slower passes pinned to the bottom edge as ▾). A
        dashed amber line marks the best's height across the strip. The best chip is amber with a
        filled crown in place of its dot.
      </p>
      <p>
        <strong>Selection.</strong> One pass is always selected. Tap / click a chip to select it;
        tapping the selected chip does nothing (no toggle, no ✕). The best is selectable like any
        other pass. Under the strip, inside the sticky block, the selected pass shows as a small
        list item (name, date, gap or the best's time, ›); clicking it opens its session (a
        placeholder screen here, ‹ back). The strip is the legend: white outline = the white line,
        amber chip = the amber line. The strip is sticky: scroll the panel (desktop) or the sheet
        (390 px).
      </p>
      <p>
        <strong>Explorer, best selected</strong> (toolbar): (a) the explorer plots the best alone
        as the amber line, as it did for "nothing selected" before; (b) the best against the 2nd
        fastest pass, whose line is white and whose chip gets a dashed outline, so a comparison is
        always on screen.
      </p>
      <p>
        <strong>Scenarios</strong>: from a session (the third-newest pass), latest selected, best
        selected, 90 passes over two years with two outliers, 3 passes (best → slowest scale below
        5 passes, where a percentile means nothing). Fake data: about 6:42 → 6:06 with noise, best
        6:00 on 14 Jun, one 7:32 outlier. Mouse hover preview is not built.
      </p>
    </template>

    <script src="../../../../shared/mockup-shell.js"></script>
    <script>
      const NAMES = ['Isar easy', 'Morning run', 'Tempo 6 km', 'Long run', 'Evening run', 'Fartlek', 'Recovery 8 km', 'Sunday loop', '6×800 m Isar', 'Hot one'];
      const build = (rows) => rows.map((r, i) => ({ i, date: new Date(r[0]), sec: r[1], name: NAMES[(i * 7) % NAMES.length] }));
      const BASE = build([
        ['2026-01-11', 402], ['2026-02-02', 396], ['2026-02-21', 405], ['2026-03-15', 391],
        ['2026-04-04', 387], ['2026-04-26', 452], ['2026-05-24', 382], ['2026-06-14', 360],
        ['2026-07-09', 378], ['2026-08-22', 372], ['2026-09-12', 375], ['2026-10-03', 366],
      ]);
      const MANY = (() => {
        let seed = 7;
        const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
        const start = new Date('2024-10-20').getTime();
        const rows = [];
        for (let i = 0; i < 90; i++) {
          let sec = Math.round(412 - 48 * (i / 89) + (rand() - 0.5) * 26);
          if (i === 31) sec += 72;
          if (i === 64) sec += 50;
          rows.push([start + i * 8.2 * 86400000, sec]);
        }
        return build(rows);
      })();
      const FEW = build([['2026-08-02', 381], ['2026-09-12', 372], ['2026-10-03', 366]]);
      const DATA_BY_SCENARIO = { from: BASE, latest: BASE, best: BASE, many: MANY, few: FEW };
      const MIN_PASSES_FOR_ROBUST = 5;
      const CROWN =
        'M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z';

      const ui = { key: '', sel: 0, session: null, lang: 'en', keepStrip: false, stripLeft: {} };
      let passes = BASE;
      let best = BASE[7];

      const tr = (en, de) => (ui.lang === 'de' ? de : en);
      const locale = () => (ui.lang === 'de' ? 'de-DE' : 'en-GB');
      const fmtDate = (p, short) =>
        p.date.toLocaleDateString(locale(), { day: 'numeric', month: 'short', year: short ? undefined : 'numeric' });
      const fmtTime = (sec) => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
      const gap = (p) => (p.i === best.i ? fmtTime(p.sec) : `+${fmtTime(p.sec - best.sec)}`);
      const sel = () => passes[ui.sel];
      const runnerUp = () => [...passes].sort((a, b) => a.sec - b.sec)[1];

      const quantile = (q) => {
        const sorted = passes.map((p) => p.sec).sort((a, b) => a - b);
        return sorted[Math.min(sorted.length - 1, Math.floor(q * (sorted.length - 1)))];
      };
      const scale = (sec) => {
        let hi = Math.max(...passes.map((p) => p.sec));
        if (passes.length >= MIN_PASSES_FOR_ROBUST) hi = Math.max(best.sec + 1, quantile(0.9));
        const v = (sec - best.sec) / Math.max(1, hi - best.sec);
        return { v: Math.min(1, v), clamped: v > 1 };
      };
      const yOf = (v) => 6 + v * 26;

      const dotSvg = (p, compare) => {
        const r = scale(p.sec);
        const on = p.i === ui.sel;
        const cx = 20;
        const cy = yOf(r.v);
        const by = yOf(scale(best.sec).v);
        const line = `<line x1="-2" x2="42" y1="${by}" y2="${by}" stroke="var(--best)" stroke-opacity="0.45" stroke-dasharray="3 2"/>`;
        let colour = 'var(--ink)';
        if (on || compare) colour = 'var(--color-gray-100)';
        let mark = `<circle cx="${cx}" cy="${cy}" r="${on || compare ? 4.5 : 3}" fill="${colour}" ${on ? 'stroke="var(--color-gray-950)" stroke-width="1.5"' : ''}/>`;
        if (r.clamped) mark = `<path d="M${cx - 4} ${cy - 2} L${cx + 4} ${cy - 2} L${cx} ${cy + 3} Z" fill="${colour}"/>`;
        if (p.i === best.i)
          mark = `<g transform="translate(${cx - 7} ${cy - 8}) scale(0.58)"><path d="${CROWN}" fill="var(--best)" stroke="var(--best)" stroke-width="1.5" stroke-linejoin="round"/><path d="M5 21h14" stroke="var(--best)" stroke-width="2" stroke-linecap="round"/></g>`;
        return `<svg viewBox="0 0 40 36" width="40" aria-hidden="true">${line}${mark}</svg>`;
      };

      const chip = (p, state) => {
        const on = p.i === ui.sel;
        const isBest = p.i === best.i;
        const compare = state.bestview === 'runnerup' && sel().i === best.i && p.i === runnerUp().i;
        const cls = `chip roomy${on ? ' on' : ''}${isBest ? ' bst' : ''}${compare ? ' cmp' : ''}`;
        return `<div class="${cls}" role="button" tabindex="0" aria-pressed="${on}" data-act="select" data-arg="${p.i}">
          <span class="xs ${isBest ? 'best' : ''}">${fmtDate(p, true)}</span>${dotSvg(p, compare)}</div>`;
      };

      const smItem = (p) =>
        `<button type="button" class="item sk${p.i === best.i ? ' bst' : ''}" data-act="open" data-arg="${p.i}">
          <span class="tile sk xs">${p.i === best.i ? '<span class="best">♛</span>' : '⌁'}</span>
          <span class="grow"><span class="t1 trunc" style="display:block">${p.name}</span><span class="xs t3">${fmtDate(p)}</span></span>
          <span class="num ${p.i === best.i ? 'best' : ''}">${gap(p)}</span><span class="t3">›</span></button>`;

      const stickyBlock = (state) =>
        `<div class="sticky"><div class="strip" data-strip>${passes.map((p) => chip(p, state)).join('')}</div>${smItem(sel())}</div>`;
      const wave = (seed, row) => {
        const pts = [];
        for (let k = 0; k <= 40; k++) {
          const y = 50 + 22 * Math.sin(k / 4 + row * 1.7 + seed * 0.9) + 10 * Math.sin(k / 1.6 + seed);
          pts.push(`${k * 2.5},${y.toFixed(1)}`);
        }
        return pts.join(' ');
      };
      const ROWS = [
        ['Heart rate', 'Herzfrequenz', 'bpm'], ['Pace', 'Pace', '/km'], ['Cadence', 'Kadenz', 'spm'],
        ['Power', 'Leistung', 'W'], ['Elevation', 'Höhe', 'm'], ['Ground contact', 'Bodenkontakt', 'ms'],
        ['Vertical ratio', 'Vertikalverh.', '%'], ['Stride length', 'Schrittlänge', 'm'], ['Temperature', 'Temperatur', '°C'],
      ];
      const comparedPass = (state) => {
        const s = sel();
        if (s.i !== best.i) return s;
        if (state.bestview === 'runnerup') return runnerUp();
        return undefined;
      };
      const explorer = (state) => {
        const other = comparedPass(state);
        const rows = ROWS.map(
          (r, row) => `<div class="xrow"><div class="rail"><span class="xs t3">${tr(r[0], r[1])}</span><span class="t1 num">— ${r[2]}</span><span class="xs best">♛ — ${r[2]}</span></div>
            <div class="chart"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <polyline points="${wave(best.i, row)}" fill="none" stroke="var(--best)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
              ${other ? `<polyline points="${wave(other.i * 1.3 + 1.1, row)}" fill="none" stroke="var(--color-gray-100)" stroke-width="1.75" vector-effect="non-scaling-stroke"/>` : ''}
            </svg></div></div>`,
        ).join('');
        return `<div class="card sk">${rows}</div>`;
      };
      const sessionScreen = (p) =>
        `<div class="session"><button type="button" class="t3" data-act="back" style="align-self:flex-start">‹ ${tr('Segment', 'Segment')}</button>
          <div class="row"><span class="tile sk">⌁</span><div class="grow"><div class="t1">${p.name}</div><div class="xs t3">${fmtDate(p)} · 8.2 km</div></div></div>
          <div class="ghost" style="height:120px"></div><div class="ghost" style="height:220px"></div></div>`;

      const startSel = (scenario) => {
        if (scenario === 'from') return passes.length - 3;
        if (scenario === 'best') return best.i;
        if (scenario === 'few') return 1;
        return passes.length - 1;
      };

      const render = (state, screens) => {
        ui.lang = state.lang;
        passes = DATA_BY_SCENARIO[state.scenario];
        best = passes.reduce((a, b) => (b.sec < a.sec ? b : a));
        if (state.scenario !== ui.key) {
          ui.key = state.scenario;
          ui.sel = startSel(state.scenario);
          ui.session = null;
        }
        const latest = passes[passes.length - 1];
        for (const s of screens) {
          const device = s.dataset.device;
          const panel = s.querySelector('.panel');
          const keepScroll = panel.scrollTop;
          s.querySelector('.facts').textContent = `${fmtDate(latest)} · ${tr('1.40 km', '1,40 km')} · +4 m · ${passes.length} ${tr('passes', 'Durchgänge')}`;
          s.querySelector('.body').innerHTML = stickyBlock(state) + explorer(state);
          panel.scrollTop = keepScroll;
          s.querySelector('.overlay').innerHTML = ui.session === null ? '' : sessionScreen(passes[ui.session]);
          const stripEl = s.querySelector('[data-strip]');
          stripEl.scrollLeft = ui.keepStrip ? (ui.stripLeft[device] ?? stripEl.scrollWidth) : stripEl.scrollWidth;
        }
        ui.keepStrip = false;
      };

      let lastState = null;
      const rerender = () => {
        for (const s of MockupShell.screens()) {
          const el = s.querySelector('[data-strip]');
          if (el) ui.stripLeft[s.dataset.device] = el.scrollLeft;
        }
        ui.keepStrip = true;
        render(lastState, MockupShell.screens());
      };
      const act = (name, arg) => {
        if (name === 'select') ui.sel = Number(arg);
        if (name === 'open') ui.session = Number(arg);
        if (name === 'back') ui.session = null;
        rerender();
      };
      MockupShell.onChange((state, screens) => {
        lastState = { ...state };
        render(state, screens);
      });
      for (const s of MockupShell.screens()) {
        s.addEventListener('click', (event) => {
          const el = event.target.closest('[data-act]');
          if (!el) return;
          act(el.dataset.act, el.dataset.arg);
        });
      }
    </script>
  </body>
</html>
