<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Annotated screen</title>
    <style>
      :root {
        --rm: #e5484d;
        --new: #30a46c;
        --keep: #8b8d98;
        --panel: #16171b;
        --text: #ececef;
        --muted: #a0a1aa;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--panel);
        font:
          14px/1.4 -apple-system,
          'Inter',
          'Segoe UI',
          sans-serif;
        color: var(--text);
      }
      #root {
        display: flex;
        width: 1660px;
        height: 800px;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        flex: none;
      }
      #stage > img {
        display: block;
        width: 1280px;
        height: 800px;
      }
      .wf {
        position: absolute;
        inset: 0;
        background: #f2f2f2;
        color: #222;
        font-size: 14px;
      }
      .wf .box {
        position: absolute;
        border: 2px solid #999;
        background: #fff;
        border-radius: 10px;
      }
      .wf .fill {
        position: absolute;
        background: #ddd;
        border-radius: 6px;
      }
      .wf .t {
        position: absolute;
        color: #222;
        white-space: nowrap;
      }
      .wf .s {
        position: absolute;
        color: #777;
        font-size: 12px;
        white-space: nowrap;
      }
      .wf .pill {
        position: absolute;
        border: 2px solid #555;
        background: #fff;
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 13px;
        white-space: nowrap;
      }
      .wf .btn {
        position: absolute;
        border: 2px solid #777;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 13px;
        background: #fff;
      }
      .wf .btn.primary {
        background: #333;
        color: #fff;
        border-color: #333;
      }
      .wf .hint {
        position: absolute;
        left: 24px;
        top: 20px;
        font-size: 13px;
        color: #888;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .mark {
        z-index: 5;
        position: absolute;
        border: 3px solid;
        border-radius: 8px;
        pointer-events: none;
      }
      .mark.dashed {
        border-style: dashed;
      }
      .badge {
        z-index: 6;
        position: absolute;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        color: #fff;
        font-weight: 700;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0 2px #fff;
      }
      .rm {
        border-color: var(--rm);
      }
      .badge.rm {
        background: var(--rm);
      }
      .new {
        border-color: var(--new);
      }
      .badge.new {
        background: var(--new);
      }
      .keep {
        border-color: var(--keep);
      }
      .badge.keep {
        background: var(--keep);
      }
      #panel {
        width: 380px;
        padding: 22px 22px 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        border-left: 1px solid #2a2b31;
      }
      #panel h1 {
        font-size: 17px;
        margin: 0;
      }
      #panel .sub {
        color: var(--muted);
        font-size: 12.5px;
        margin-top: -6px;
      }
      .note {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 13.5px;
      }
      .note .badge {
        position: static;
        flex: none;
        box-shadow: none;
      }
      .legend {
        margin-top: auto;
        display: flex;
        gap: 14px;
        font-size: 12px;
        color: var(--muted);
        border-top: 1px solid #2a2b31;
        padding-top: 12px;
      }
      .legend span::before {
        content: '';
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: -1px;
        background: var(--c);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="stage"></div>
      <div id="panel"></div>
    </div>
    <script src="data.js"></script>
    <script src="wireframes.js"></script>
    <script>
      const id = location.hash.slice(1);
      const scene = window.SCENES.find((s) => s.id === id);
      const stage = document.getElementById('stage');
      const panel = document.getElementById('panel');
      if (scene.bg) {
        const img = document.createElement('img');
        img.src = scene.bg;
        stage.appendChild(img);
      } else {
        const wf = document.createElement('div');
        wf.className = 'wf';
        wf.innerHTML = window.WIREFRAMES[scene.id];
        stage.appendChild(wf);
      }
      scene.marks.forEach((mark) => {
        (mark.rects || []).forEach((r, i) => {
          const el = document.createElement('div');
          el.className = 'mark ' + mark.kind + (r[4] ? ' dashed' : '');
          Object.assign(el.style, {
            left: r[0] + 'px',
            top: r[1] + 'px',
            width: r[2] + 'px',
            height: r[3] + 'px',
          });
          stage.appendChild(el);
          const b = document.createElement('div');
          b.className = 'badge ' + mark.kind;
          b.textContent = mark.n;
          const corner = r[5] || 'tl';
          const bx = corner[1] === 'r' ? r[0] + r[2] - 12 : r[0] - 12;
          const by = corner[0] === 'b' ? r[1] + r[3] - 12 : r[1] - 12;
          b.style.left = bx + 'px';
          b.style.top = by + 'px';
          stage.appendChild(b);
        });
      });
      panel.innerHTML =
        '<h1>' +
        scene.title +
        '</h1><div class="sub">' +
        scene.sub +
        '</div>' +
        scene.marks
          .slice()
          .sort((a, b) => a.n - b.n)
          .map(
            (m) =>
              '<div class="note"><div class="badge ' +
              m.kind +
              '">' +
              m.n +
              '</div><div>' +
              m.label +
              '</div></div>',
          )
          .join('') +
        '<div class="legend"><span style="--c:var(--rm)">removed / changes</span><span style="--c:var(--new)">new</span><span style="--c:var(--keep)">stays</span></div>';
      document.body.dataset.ready = '1';
    </script>
  </body>
</html>
