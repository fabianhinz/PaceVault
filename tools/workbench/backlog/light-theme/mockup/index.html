<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Light theme · Mockup</title>
    <link rel="stylesheet" href="../../../shared/mockup-shell.css" />
    <script src="../../../shared/mockup-shell.js" defer></script>
    <style>
      /* Screen content only. Token names as in packages/ui/src/theme.css; the --color-overlay-*,
         --color-border-subtle/-strong, --color-divider, --color-knob*, --shadow-floating names are
         the proposed overlay tokens (research/light-palette.md §4). Each variant redefines the same
         names, as [data-theme] would in theme.css. */

      /* ---------- dark: today (theme.css values, Card.tsx alphas) ---------- */
      .app {
        --color-surface-base: #030712;
        --color-surface-sunken: #0a0b0f;
        --color-surface: #111318;
        --color-surface-elevated: #1a1d24;
        --color-surface-overlay: #252830;
        --color-border: #252830;
        --color-text-primary: #e5e7eb;
        --color-text-secondary: #b0b4be;
        --color-text-tertiary: #8b8f9a;
        --color-text-quaternary: #5c616e;
        --color-accent: #3b82f6;
        --color-accent-hover: #60a5fa;
        --color-accent-strong: #2563eb;
        --color-accent-muted: #3b82f633;
        --color-status-success: #4ade80;
        --color-status-warning: #facc15;
        --color-status-danger: #f87171;
        --color-sport-running: #4ade80;
        --color-sport-cycling: #f97316;
        --color-chart-hr: #ef4444;
        --color-chart-elevation: #8b5cf6;
        --color-precip-rain: #60a5fa;
        --color-overlay-subtle: rgb(255 255 255 / 0.05);
        --color-overlay: rgb(255 255 255 / 0.1);
        --color-overlay-strong: rgb(255 255 255 / 0.15);
        --color-border-subtle: rgb(255 255 255 / 0.1);
        --color-border-strong: rgb(255 255 255 / 0.3);
        --color-divider: rgb(255 255 255 / 0.05);
        --color-on-accent: #ffffff;
        --color-knob: #ffffff;
        --color-knob-border: transparent;
        --shadow-floating: 0 8px 24px rgb(0 0 0 / 0.4);
        /* surfaces: glassClass bg-surface/55, floatingClass bg-surface/85 (Card.tsx:3,7) */
        --glass-bg: color-mix(in srgb, var(--color-surface) 55%, transparent);
        --floating-bg: color-mix(in srgb, var(--color-surface) 85%, transparent);
        --sheet-bg: var(--glass-bg);
        --card-bg: var(--glass-bg);
        --card-border: var(--color-border-subtle);
        --card-shadow: none;
        --tile-bg: var(--color-overlay-subtle);
        --tile-border: var(--color-border-subtle);
        --num-weight: 700;
        --lap-active: rgb(255 255 255 / 0.32);
        --lap-alt: rgb(255 255 255 / 0.22);
        --lap-rest: rgb(255 255 255 / 0.1);
        --lap-hover: rgb(255 255 255 / 0.6);
        --lap-band-hover: rgb(255 255 255 / 0.1);
        --lap-selected: #ffffff;
        --grid-line: rgb(255 255 255 / 0.06);
        --elev-fill: color-mix(in srgb, var(--color-chart-elevation) 25%, transparent);
      }
      /* map: dark matter (darkMatter.style.json), additive tracks (trackColors.ts:4-25) */
      .app {
        --map-land: #0e0e0e;
        --map-park: #111111;
        --map-water: #2c353c;
        --map-waterway: #3f5a6d;
        --map-building: #393939;
        --map-road-minor: #414758;
        --map-road-minor-case: #0e0e0e;
        --map-road-major: #535666;
        --map-road-major-case: #1a1a1a;
        --map-motorway: #494949;
        --map-motorway-case: #232323;
        --map-path: #262626;
        --map-label: #a8b0b4;
        --map-label-halo: #222222;
        --track-run: #4ade80;
        --track-ride: #f97316;
        --track-blend: plus-lighter;
        --track-faint: 0.314;
        --track-warm: 0.627;
        --track-casing-run: #ffffff;
        --track-casing-ride: #ffffff;
        --track-casing-edge: transparent;
        --map-dot-stroke: #00000050;
        --chip-bg: rgb(0 0 0 / 0.6);
        --chip-text: #ffffff;
      }

      /* ---------- A: pure white ---------- */
      .ms-screen[data-variant='a'] .app,
      .ms-screen[data-variant='a-darkmap'] .app {
        --color-surface-base: #ffffff;
        --color-surface-sunken: #f3f4f6;
        --color-surface: #ffffff;
        --color-surface-elevated: #ffffff;
        --color-surface-overlay: #f3f4f6;
        --color-border: #e5e7eb;
        --color-text-primary: #111318;
        --color-text-secondary: #3a3e48;
        --color-text-tertiary: #5c616e;
        --color-text-quaternary: #8b8f9a;
        --color-accent: #2563eb;
        --color-accent-hover: #1d4ed8;
        --color-accent-strong: #1e40af;
        --color-accent-muted: #2563eb1f;
        --color-status-success: #15803d;
        --color-status-warning: #854d0e;
        --color-status-danger: #dc2626;
        --color-sport-running: #16a34a;
        --color-sport-cycling: #ea580c;
        --color-chart-hr: #dc2626;
        --color-chart-elevation: #6d28d9;
        --color-precip-rain: #2563eb;
        --color-overlay-subtle: rgb(0 0 0 / 0.04);
        --color-overlay: rgb(0 0 0 / 0.06);
        --color-overlay-strong: rgb(0 0 0 / 0.1);
        --color-border-subtle: #e5e7eb;
        --color-border-strong: rgb(0 0 0 / 0.2);
        --color-divider: rgb(0 0 0 / 0.06);
        --color-knob-border: #e5e7eb;
        --shadow-floating: 0 8px 24px rgb(0 0 0 / 0.12);
        --glass-bg: rgb(255 255 255 / 0.85);
        --floating-bg: rgb(255 255 255 / 0.92);
        --elev-fill: color-mix(in srgb, var(--color-chart-elevation) 16%, transparent);
        --lap-active: rgb(0 0 0 / 0.28);
        --lap-alt: rgb(0 0 0 / 0.18);
        --lap-rest: rgb(0 0 0 / 0.08);
        --lap-hover: rgb(0 0 0 / 0.5);
        --lap-band-hover: rgb(0 0 0 / 0.05);
        --lap-selected: #111318;
        --grid-line: rgb(0 0 0 / 0.07);
      }
      /* light UI over the dark map: the glass needs more white or the map greys it */
      .ms-screen[data-variant='a-darkmap'] .app {
        --glass-bg: rgb(255 255 255 / 0.94);
        --floating-bg: rgb(255 255 255 / 0.96);
        --shadow-floating: 0 8px 24px rgb(0 0 0 / 0.4);
      }

      /* ---------- B: off-white page, white borderless cards ---------- */
      .ms-screen[data-variant='b'] .app {
        --color-surface-base: #f5f4f0;
        --color-surface-sunken: #ebe9e4;
        --color-surface: #ffffff;
        --color-surface-elevated: #ffffff;
        --color-surface-overlay: #f0eee9;
        --color-border: #e2e0da;
        --color-text-primary: #16181d;
        --color-text-secondary: #3a3e48;
        --color-text-tertiary: #5c616e;
        --color-text-quaternary: #8b8f9a;
        --color-accent: #2563eb;
        --color-accent-hover: #1d4ed8;
        --color-accent-strong: #1e40af;
        --color-accent-muted: #2563eb1f;
        --color-status-success: #15803d;
        --color-status-warning: #854d0e;
        --color-status-danger: #b91c1c;
        --color-sport-running: #15803d;
        --color-sport-cycling: #ea580c;
        --color-chart-hr: #dc2626;
        --color-chart-elevation: #6d28d9;
        --color-precip-rain: #2563eb;
        --color-overlay-subtle: rgb(0 0 0 / 0.04);
        --color-overlay: rgb(0 0 0 / 0.06);
        --color-overlay-strong: rgb(0 0 0 / 0.1);
        --color-border-subtle: rgb(0 0 0 / 0.08);
        --color-border-strong: rgb(0 0 0 / 0.2);
        --color-divider: rgb(0 0 0 / 0.06);
        --color-knob-border: #e2e0da;
        --shadow-floating: 0 8px 24px rgb(0 0 0 / 0.12);
        --glass-bg: rgb(245 244 240 / 0.92);
        --floating-bg: rgb(255 255 255 / 0.95);
        --sheet-bg: rgb(245 244 240 / 0.96);
        --card-bg: #ffffff;
        --card-border: transparent;
        --tile-bg: #f5f4f0;
        --tile-border: transparent;
        --elev-fill: color-mix(in srgb, var(--color-chart-elevation) 16%, transparent);
        --lap-active: rgb(0 0 0 / 0.28);
        --lap-alt: rgb(0 0 0 / 0.18);
        --lap-rest: rgb(0 0 0 / 0.08);
        --lap-hover: rgb(0 0 0 / 0.5);
        --lap-band-hover: rgb(0 0 0 / 0.05);
        --lap-selected: #16181d;
        --grid-line: rgb(0 0 0 / 0.07);
      }

      /* ---------- C: sunlight ---------- */
      .ms-screen[data-variant='c'] .app {
        --color-surface-base: #ffffff;
        --color-surface-sunken: #eceef1;
        --color-surface: #ffffff;
        --color-surface-elevated: #ffffff;
        --color-surface-overlay: #e5e7eb;
        --color-border: #8b8f9a;
        --color-text-primary: #0a0b0f;
        --color-text-secondary: #252830;
        --color-text-tertiary: #3a3e48;
        --color-text-quaternary: #5c616e;
        --color-accent: #1d4ed8;
        --color-accent-hover: #1e40af;
        --color-accent-strong: #1e3a8a;
        --color-accent-muted: #1d4ed824;
        --color-status-success: #166534;
        --color-status-warning: #854d0e;
        --color-status-danger: #b91c1c;
        --color-sport-running: #15803d;
        --color-sport-cycling: #c2410c;
        --color-chart-hr: #b91c1c;
        --color-chart-elevation: #5b21b6;
        --color-precip-rain: #1d4ed8;
        --color-overlay-subtle: rgb(0 0 0 / 0.04);
        --color-overlay: rgb(0 0 0 / 0.07);
        --color-overlay-strong: rgb(0 0 0 / 0.12);
        --color-border-subtle: #8b8f9a;
        --color-border-strong: #5c616e;
        --color-divider: #d1d5db;
        --color-knob-border: #8b8f9a;
        --shadow-floating: 0 8px 24px rgb(0 0 0 / 0.12);
        --glass-bg: #ffffff;
        --floating-bg: #ffffff;
        --tile-bg: #ffffff;
        --num-weight: 600;
        --elev-fill: color-mix(in srgb, var(--color-chart-elevation) 20%, transparent);
        --lap-active: rgb(0 0 0 / 0.55);
        --lap-alt: rgb(0 0 0 / 0.35);
        --lap-rest: rgb(0 0 0 / 0.15);
        --lap-hover: rgb(0 0 0 / 0.75);
        --lap-band-hover: rgb(0 0 0 / 0.06);
        --lap-selected: #0a0b0f;
        --grid-line: rgb(0 0 0 / 0.12);
      }

      /* ---------- light map: voyager (voyager.style.json), multiply tracks ---------- */
      .ms-screen[data-variant='a'] .app,
      .ms-screen[data-variant='b'] .app,
      .ms-screen[data-variant='c'] .app {
        --map-land: #fbf8f3;
        --map-park: #e4edd8;
        --map-water: #b0d0d6;
        --map-waterway: #cce7ea;
        --map-building: #e4dcd0;
        --map-road-minor: #ffffff;
        --map-road-minor-case: #ece4d6;
        --map-road-major: #fefdd7;
        --map-road-major-case: #efdfb4;
        --map-motorway: #ffe9a5;
        --map-motorway-case: #fbdb98;
        --map-path: #d7d7d7;
        --map-label: #405c78;
        --map-label-halo: #f2f5f8;
        --track-run: #16a34a;
        --track-ride: #ea580c;
        --track-blend: multiply;
        --track-faint: 0.549;
        --track-warm: 0.784;
        /* A/B: white halo with a 1 px dark edge; C: dark-hue casing */
        --track-casing-run: #ffffff;
        --track-casing-ride: #ffffff;
        --track-casing-edge: #3a3e48;
        --chip-bg: rgb(255 255 255 / 0.8);
        --chip-text: #3a3e48;
      }
      .ms-screen[data-variant='b'] .app {
        --track-run: #15803d;
      }
      .ms-screen[data-variant='c'] .app {
        --track-run: #15803d;
        --track-ride: #c2410c;
        --track-casing-run: #14532d;
        --track-casing-ride: #7c2d12;
        --track-casing-edge: transparent;
      }
      /* ---------- glare: reflected light added in linear light (research §1.3 model) ---------- */
      .ms-screen[data-glare='shade'] .app {
        filter: url(#glare-shade);
      }
      .ms-screen[data-glare='sun'] .app {
        filter: url(#glare-sun);
      }

      /* ---------- app shell ---------- */
      .ms-screen [hidden] {
        display: none !important;
      }
      .app {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--map-land);
        color: var(--color-text-primary);
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 20px;
        -webkit-font-smoothing: antialiased;
      }
      .app * {
        box-sizing: border-box;
      }
      .app p,
      .app h2,
      .app h3,
      .app h4 {
        margin: 0;
      }
      .map {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .world {
        transform: translate(430px, 400px) scale(0.8);
      }
      [data-device='phone'] .world {
        transform: translate(195px, 175px) scale(0.55);
      }
      .map text {
        font: 500 15px var(--font-sans);
        fill: var(--map-label);
        stroke: var(--map-label-halo);
        stroke-width: 3.75px;
        paint-order: stroke;
        letter-spacing: 0.04em;
      }
      .trk {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        mix-blend-mode: var(--track-blend);
      }
      .trk.run {
        stroke: var(--track-run);
      }
      .trk.ride {
        stroke: var(--track-ride);
      }
      .trk.faint {
        stroke-opacity: var(--track-faint);
      }
      .trk.warm {
        stroke-opacity: var(--track-warm);
      }
      .cas {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .cas.edge {
        stroke: var(--track-casing-edge);
      }
      .cas.run {
        stroke: var(--track-casing-run);
      }
      .cas.ride {
        stroke: var(--track-casing-ride);
      }
      .pin {
        stroke: var(--map-dot-stroke);
        stroke-width: 2px;
      }
      .pin.start {
        fill: var(--track-run);
      }
      .pin.end {
        fill: var(--map-land);
        stroke: var(--track-run);
        stroke-width: 3px;
      }
      .mapq {
        position: absolute;
        top: 24px;
        left: 72px;
        display: flex;
        gap: 8px;
      }
      [data-device='phone'] .mapq {
        top: 12px;
        left: 12px;
      }
      .chip {
        position: absolute;
        bottom: 12px;
        left: 72px;
        padding: 0 8px;
        border-radius: 4px;
        background: var(--chip-bg);
        color: var(--chip-text);
      }
      [data-device='phone'] .chip {
        bottom: auto;
        left: auto;
        top: 12px;
        right: 12px;
      }

      /* content column (desktop) / bottom sheet (phone) */
      .col {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 40%;
        overflow-y: auto;
        scrollbar-width: none;
        padding: 24px 24px 112px 0;
      }
      .grab {
        display: none;
      }
      [data-device='phone'] .col {
        top: 360px;
        left: 0;
        width: auto;
        overflow: hidden;
        padding: 0;
        display: flex;
        flex-direction: column;
        background: var(--sheet-bg);
        backdrop-filter: blur(24px);
        border-top: 1px solid var(--card-border);
        border-radius: 16px 16px 0 0;
      }
      [data-device='phone'] .grab {
        display: flex;
        height: 24px;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
      }
      .grab span {
        width: 40px;
        height: 4px;
        border-radius: 9999px;
        background: var(--color-border-strong);
      }
      .scroll {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      [data-device='phone'] .scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: none;
        padding: 12px 24px 96px;
      }
      /* phone sheet: cards sit on the sheet, so no glass on glass */
      [data-device='phone'] .card {
        backdrop-filter: none;
      }

      /* ---------- kit look (packages/ui) ---------- */
      .card {
        display: flex;
        flex-direction: column;
        padding: 16px;
        border-radius: 16px;
        border: 1px solid var(--card-border);
        background: var(--card-bg);
        backdrop-filter: blur(24px);
        box-shadow: var(--card-shadow);
      }
      .card--compact {
        padding: 8px;
      }
      .floating {
        background: var(--floating-bg);
        backdrop-filter: blur(24px);
        border: 1px solid var(--card-border);
        box-shadow: var(--shadow-floating);
      }
      .t-h2 {
        font-size: 20px;
        line-height: 28px;
        font-weight: 700;
      }
      .t-h3 {
        font-size: 18px;
        line-height: 28px;
        font-weight: 700;
      }
      .t-num {
        font-size: 18px;
        line-height: 28px;
        font-weight: var(--num-weight);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .t-title {
        font-size: 16px;
        line-height: 24px;
        font-weight: 500;
      }
      .t-body {
        font-size: 14px;
        line-height: 20px;
        font-weight: 400;
      }
      .t-sub {
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
      }
      .t-cap {
        font-size: 12px;
        line-height: 16px;
        font-weight: 400;
        color: var(--color-text-secondary);
      }
      .t-over {
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--color-text-secondary);
      }
      .c-pri {
        color: var(--color-text-primary);
      }
      .c-sec {
        color: var(--color-text-secondary);
      }
      .c-ter {
        color: var(--color-text-tertiary);
      }
      .tab {
        font-variant-numeric: tabular-nums;
      }
      .trunc {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        border: 0;
        border-radius: 8px;
        font: 500 14px/20px var(--font-sans);
        cursor: pointer;
        color: var(--color-text-secondary);
        background: transparent;
        transition: background-color 0.15s, color 0.15s;
      }
      .btn:hover {
        background: var(--color-overlay);
        color: var(--color-text-primary);
      }
      .btn--icon {
        padding: 6px;
      }
      .icon {
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }

      /* dock (Dock.tsx, DockItems.tsx) */
      .dock {
        position: absolute;
        top: 50%;
        left: 12px;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .seg {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 4px;
        border-radius: 9999px;
      }
      .ditem {
        position: relative;
        width: 40px;
        height: 40px;
        border-radius: 9999px;
        color: var(--color-text-tertiary);
      }
      .ditem.on {
        background: var(--color-accent-muted);
        color: var(--color-accent-hover);
      }
      .dock .circle {
        display: none;
      }
      [data-device='phone'] .dock {
        top: auto;
        transform: none;
        left: 12px;
        right: 12px;
        bottom: 16px;
        height: 50px;
        flex-direction: row;
      }
      [data-device='phone'] .dock .rail-extra {
        display: none;
      }
      [data-device='phone'] .dock .circle {
        display: flex;
        padding: 3px;
        border-radius: 9999px;
      }
      [data-device='phone'] .seg {
        flex: 1;
        flex-direction: row;
        gap: 2px;
        padding: 3px;
      }
      [data-device='phone'] .seg .ditem {
        flex: 1;
        height: 44px;
      }
      [data-device='phone'] .circle .ditem {
        width: 44px;
        height: 44px;
      }

      /* stat tiles (StatTile.tsx, tileClass Card.tsx:5) */
      .tiles {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      [data-device='phone'] .tiles {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .tile {
        display: grid;
        grid-template-rows: 16px 28px 32px;
        row-gap: 4px;
        padding: 8px;
        min-width: 0;
        border-radius: 12px;
        border: 1px solid var(--tile-border);
        background: var(--tile-bg);
      }
      .unit {
        margin-left: 2px;
        font-size: 12px;
        line-height: 16px;
        font-weight: 400;
        color: var(--color-text-secondary);
      }

      /* chart */
      .chart {
        display: grid;
        grid-template-columns: 32px 1fr;
        grid-template-rows: 120px 12px 16px;
        column-gap: 8px;
      }
      .chart__y {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        text-align: right;
      }
      .chart__plot {
        position: relative;
      }

        // ---------- 3D terrain (session): a pitched plane with hillshade, as MapLibre terrain ----------
        // Plane units: 3000 × 2000, y = 0 is the far edge. The session runs along a contour at the foot
        // of the slope (hence 0 m gain), out and back.
        const PW = 3000;
        const PH = 2000;
        const sstep = (t) => {
          const c = Math.min(1, Math.max(0, t));
          return c * c * (3 - 2 * c);
        };
        const gx = (x) => 40 * Math.sin(x / 300) + 20 * Math.sin(x / 110 + 1);
        const height = (x, y) =>
          900 * sstep((1500 - y + gx(x)) / 1200) -
          170 * sstep((1450 - y) / 500) * Math.max(0, Math.cos(x / 170)) ** 3 +
          420 * Math.exp(-((x - 1100) ** 2 + (y - 350) ** 2) / (2 * 330 ** 2)) +
          320 * Math.exp(-((x - 2150) ** 2 + (y - 500) ** 2) / (2 * 300 ** 2)) +
          12 * Math.sin(x / 53) * Math.sin(y / 61) * sstep((1500 - y) / 600);
        // hillshade masks (alpha = amount), light from 335° at 45° as MapLibre's default
        const CELL = 10;
        const cv = document.createElement('canvas');
        cv.width = PW / CELL;
        cv.height = PH / CELL;
        const ctx = cv.getContext('2d');
        const shadowImg = ctx.createImageData(cv.width, cv.height);
        const hiImg = ctx.createImageData(cv.width, cv.height);
        const az = (335 * Math.PI) / 180;
        const alt = Math.PI / 4;
        const L = [Math.sin(az) * Math.cos(alt), Math.cos(az) * Math.cos(alt), Math.sin(alt)];
        for (let j = 0; j < cv.height; j++)
          for (let i = 0; i < cv.width; i++) {
            const x = i * CELL;
            const y = j * CELL;
            const dE = (height(x + CELL, y) - height(x - CELL, y)) / (2 * CELL);
            const dN = -(height(x, y + CELL) - height(x, y - CELL)) / (2 * CELL);
            const len = Math.hypot(dE, dN, 1);
            const hill = (-dE * L[0] - dN * L[1] + L[2]) / len;
            const k = (j * cv.width + i) * 4 + 3;
            shadowImg.data[k] = Math.round(Math.min(1, Math.max(0, (0.707 - hill) / 0.45)) * 255);
            hiImg.data[k] = Math.round(Math.min(1, Math.max(0, (hill - 0.707) / 0.25)) * 255);
          }
        const toUrl = (img) => {
          ctx.putImageData(img, 0, 0);
          return cv.toDataURL('image/png');
        };

        maskCss.textContent = `.hs-shadow{-webkit-mask-image:url(${toUrl(shadowImg)});mask-image:url(${toUrl(shadowImg)})}

          return 0;
        };
        const out = [];
        for (let x = 1020; x <= 1980; x += 20) out.push([x, contourY(x)]);
        const back = out.map(([x, y]) => [x, y + 14]).reverse();
        const route = [[960, 1360], [990, 1310], ...out, ...back, [994, 1322], [962, 1368]];
        const seg = route.slice(1).map((p, i) => Math.hypot(p[0] - route[i][0], p[1] - route[i][1]));

          let picked = state.variant === 'dark' ? 'dark' : 'light';
          if (state.switcher === 'auto') picked = 'auto';
          for (const s of screens)
            for (const x of s.querySelectorAll('.radio'))
              x.setAttribute('aria-checked', String(x.dataset.opt === picked));
        });
      });
    </script>
  </body>
</html>
