<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Segment report · Mockup</title>
    <link rel="stylesheet" href="../../../shared/mockup-shell.css" />
    <link rel="stylesheet" href="report.css" />
    <script src="../../../shared/mockup-shell.js" defer></script>
    <script src="data.js" defer></script>
    <script src="render.js" defer></script>
    <script src="sections.js" defer></script>
    <script src="main.js" defer></script>
  </head>
  <body>
    <script type="application/json" id="mockup-config">
      {
        "title": "Segment report",
        "variants": [
          { "id": "progress", "label": "L1 · Progress" },
          { "id": "standing", "label": "L2 · Standing" },
          { "id": "body", "label": "L3 · Body" },
          { "id": "splits", "label": "L4 · Splits" },
          { "id": "full", "label": "L5 · Full report" }
        ],
        "scenarios": [
          { "id": "many", "label": "60 passes, 4 years" },
          { "id": "few", "label": "3 passes" },
          { "id": "one", "label": "1 pass" },
          { "id": "loading", "label": "Loading" },
          { "id": "missing", "label": "No HR, power, weather" }
        ],
        "extras": [],
        "decisions": [
          { "id": "Q1", "title": "Tab structure on the segment page" },
          { "id": "Q2", "title": "Elapsed or moving time in the report" },
          { "id": "Q3", "title": "Axes on the Pass times trend" },
          { "id": "Q4", "title": "Analyses that read records (efficiency, splits)" },
          { "id": "Q5", "title": "Conditions and weather fetches" },
          { "id": "Q6", "title": "Report with 1 to 3 passes" },
          { "id": "Q7", "title": "Report and the dashboard filters" },
          { "id": "Q8", "title": "What tapping a pass in the report does" }
        ]
      }
    </script>

    <template id="mockup-screen">
      <div class="scr">
        <div class="map">
          <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
            <path d="M8 86 C 22 70, 30 76, 40 58 S 58 30, 70 34 S 88 18, 94 10" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
            <path d="M8 86 C 22 70, 30 76, 40 58 S 58 30, 70 34 S 88 18, 94 10" stroke="#f97316" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </div>
        <div class="col">
          <div class="grab"></div>
          <div class="head">
            <div class="ico">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="5" cy="19" r="2" /><circle cx="19" cy="5" r="2" /><path d="M7 19c6 0 4-14 10-14" /></svg>
            </div>
            <div class="grow">
              <h1 class="t-h2 trunc" style="margin: 0">Kirchberg climb</h1>
              <p class="t-cap" style="margin: 0" data-de="Radfahren · 2,4 km · +118 m">Cycling · 2.4 km · +118 m</p>
            </div>
            <button class="more" aria-label="More">⋯</button>
          </div>

          <div class="tabs">
            <button class="tab t-s1" data-de="Durchgänge">Passes</button>
            <button class="tab t-s1 on" data-de="Auswertung">Report</button>
            <span data-q="Q1"></span>
          </div>

          <div class="row" style="flex-shrink: 0">
            <span class="t-cap grow" data-slot="count"></span>
            <span class="t-cap" data-de="verstrichene Zeit">elapsed time</span><span data-q="Q2"></span><span data-q="Q7"></span>
          </div>

          <div class="card" data-when="scenario:one">
            <div class="note">
              <p class="t-s1" style="margin: 0" data-de="Für die Auswertung braucht es mindestens 2 Durchgänge.">The report needs at least 2 passes.</p>
              <p class="t-cap" style="margin: 4px 0 0" data-slot="onenote"></p>
            </div>
            <div class="row"><span data-q="Q6"></span></div>
          </div>

          <div class="rep" data-when="variant:progress">
            <div class="card" style="margin-bottom: 16px">
              <div class="tiles" data-slot="tiles4"></div>
              <div class="row fewrow"><span data-slot="fewnote"></span><span data-when="scenario:few"><span data-q="Q6"></span></span></div>
            </div>
            <div class="card" style="margin-bottom: 16px">
              <div class="ch">
                <div>
                  <h3 class="t-title" style="margin: 0" data-de="Zeiten">Pass times</h3>
                  <p class="t-cap" style="margin: 0" data-de="Gleitender Median aus 5 · Bestzeit amber">Rolling median of 5 · best in amber</p>
                </div>
                <span data-q="Q3"></span>
              </div>
              <div data-slot="trend"></div>
            </div>
            <div class="card">
              <div class="ch">
                <h3 class="t-title" style="margin: 0" data-de="Bestzeit pro Jahr">Best by year</h3>
                <span data-q="Q8"></span>
              </div>
              <div class="list" data-slot="years"></div>
            </div>
          </div>

          <div class="rep" data-when="variant:standing">
            <div class="card" style="margin-bottom: 16px">
              <span class="t-ovl" data-de="Letzter Durchgang">Latest pass</span>
              <div data-slot="rankline"></div>
              <div data-slot="strip"></div>
              <div class="tiles" data-slot="tilesq"></div>
            </div>
            <div class="card">
              <div class="ch">
                <h3 class="t-title" style="margin: 0" data-de="Schnellste 5">Fastest 5</h3>
                <span data-q="Q8"></span>
              </div>
              <div class="list" data-slot="top5"></div>
            </div>
          </div>

          <div class="rep" data-when="variant:body">
            <div class="card" style="margin-bottom: 16px">
              <div class="ch">
                <span class="t-ovl" data-de="Letzter Durchgang, Mittelwerte">Latest pass, averages</span>
                <span data-q="Q4"></span>
              </div>
              <div class="tiles t3" data-slot="bodytiles"></div>
            </div>
            <div class="card" style="margin-bottom: 16px">
              <div>
                <h3 class="t-title" style="margin: 0" data-de="Leistung pro Herzschlag">Power per heartbeat</h3>
                <p class="t-cap" style="margin: 0" data-de="W/bpm je Durchgang · gleitender Median aus 5">W/bpm per pass · rolling median of 5</p>
              </div>
              <div data-slot="eff"></div>
            </div>
            <div class="card">
              <div>
                <h3 class="t-title" style="margin: 0" data-de="Herzfrequenz und Zeit">Heart rate and time</h3>
                <p class="t-cap" style="margin: 0" data-de="Ein Punkt je Durchgang">One dot per pass</p>
              </div>
              <div data-slot="hrscatter"></div>
            </div>
          </div>

          <div class="rep" data-when="variant:splits">
            <div class="card">
              <div class="ch">
                <div>
                  <h3 class="t-title" style="margin: 0" data-de="Wo die Zeit liegt">Where time goes</h3>
                  <p class="t-cap" style="margin: 0" data-de="5 Teile à 0,5 km · Sekunden zum Teil der Bestzeit">5 parts of 0.5 km · seconds to the best pass's part</p>
                </div>
                <span data-q="Q4"></span>
              </div>
              <div data-slot="splits"></div>
              <div class="tiles t3" data-slot="theo"></div>
            </div>
          </div>

          <div class="rep" data-when="variant:full">
            <div class="card" style="margin-bottom: 16px">
              <div class="tiles" data-slot="tiles4"></div>
              <div class="row fewrow"><span data-slot="fewnote"></span><span data-when="scenario:few"><span data-q="Q6"></span></span></div>
            </div>
            <div class="card" style="margin-bottom: 16px">
              <div class="ch">
                <h3 class="t-title" style="margin: 0" data-de="Zeiten">Pass times</h3>
                <span data-q="Q3"></span>
              </div>
              <div data-slot="trend" data-compact="1"></div>
            </div>
            <div class="card" style="margin-bottom: 16px">
              <h3 class="t-title" style="margin: 0" data-de="Bestzeit pro Jahr">Best by year</h3>
              <div class="list" data-slot="years" data-compact="1"></div>
            </div>
            <div class="card" style="margin-bottom: 16px">
              <div class="ch">
                <h3 class="t-title" style="margin: 0" data-de="Teilstücke">Parts</h3>
                <span data-q="Q4"></span>
              </div>
              <div data-slot="splitsum"></div>
            </div>
            <div class="card">
              <div class="ch">
                <div>
                  <h3 class="t-title" style="margin: 0" data-de="Bedingungen">Conditions</h3>
                  <p class="t-cap" style="margin: 0" data-de="Zeit je Durchgang gegen Wetter und Uhrzeit">Time per pass against weather and hour</p>
                </div>
                <span data-q="Q5"></span>
              </div>
              <div class="mini3" data-slot="cond"></div>
            </div>
          </div>
        </div>
        <div class="dock"><i></i><i></i><i class="on"></i><i></i><i></i></div>
      </div>
    </template>

    <template id="mockup-notes">
      <p><strong>What this shows.</strong> A Report tab next to today's strip and explorer (Passes). Five layouts, rough on purpose: real labels, plausible numbers (one cycling segment, 2.4 km, +118 m, times at 1 s), grey where a real component goes. Research: <code>tools/workbench/backlog/segment-report/research/report-analyses.md</code>.</p>
      <p><strong>L1 · Progress</strong> (test first): summary tiles, the time trend over all passes (scrolls sideways, newest right), best by year. Pass summaries only, no records, no network.</p>
      <p><strong>L2 · Standing</strong>: where the latest pass ranks; a dot strip of all times (fast left), quartile tiles, fastest 5. Summaries only.</p>
      <p><strong>L3 · Body</strong>: power per heartbeat over time and heart rate against time. Needs records of every pass; the missing-data scenario shows it with no HR or power.</p>
      <p><strong>L4 · Splits</strong>: the segment in 5 equal parts, one row per pass (latest 12 plus the best), each cell the gap to the best pass's part; theoretical best = sum of the fastest parts. Needs records.</p>
      <p><strong>L5 · Full report</strong>: L1's sections plus a parts summary and conditions (temperature, headwind along the segment, start hour). Conditions need weather (Open-Meteo) per session.</p>
      <p><strong>Components.</strong> Tabs: <code>PvTabs</code>/<code>PvTabsList</code>/<code>PvTabsTrigger</code> (<code>packages/ui/src/components/pvTabs/PvTabsList.tsx:9-14</code>, as on <code>apps/web/src/components/dashboard/index.tsx:25-46</code>). Cards: <code>PvCard</code> (<code>packages/ui/src/components/pvCard/PvCard.tsx:19-36</code>) with <code>PvCardHeader</code>. Tiles: <code>PvStatTile</code> (<code>packages/ui/src/components/pvStatTile/PvStatTile.tsx:33-36</code>). Header: <code>SegmentHeader</code> (<code>apps/web/src/components/segments/index.tsx:32-40</code>). New: the trend chart (Recharts scatter + line, like the removed Pass times scatter), the dot strip, the parts heatmap and the mini scatters; none exists in the kit.</p>
      <p><strong>Times</strong> are elapsed, as stored today (R80 open).</p>
    </template>
  </body>
</html>
