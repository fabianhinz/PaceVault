<!doctype html>
<!-- Phone screen of the mockup without the workbench shell: the same screen markup and scripts as
     index.html's <template id="mockup-screen">, at the device's real viewport, with a stub
     MockupShell that delivers one fixed state (?lang=de for German). Keep the body in sync with
     the template in index.html. -->
<html lang="en" class="ms-frame-doc" data-device="phone">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>3D session map · Phone</title>
    <link rel="stylesheet" href="../../../shared/tokens.css" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="screen.css" />
    <style>
      /* screen.css fixes the phone layout for 390 × 844; here the same rules follow the real
         viewport (sheetPosition.ts: sheet = 100dvh − max(12px, 8dvh), position 0.5 of the peek
         offset = (sheet − 114 handle+peek − 72 dock) / 2; pills 12 px above the sheet) */
      html.ms-frame-doc,
      .ms-frame-doc body {
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
      }
      .ms-frame-doc body {
        position: fixed;
        inset: 0; /* the sheet is translated past the bottom edge; the page itself never scrolls */
      }
      .ms-frame-doc {
        --sheet-gap: max(12px, 8dvh);
        --sheet-h: calc(100dvh - var(--sheet-gap));
        --sheet-y: calc((var(--sheet-h) - 186px) / 2);
      }
      [data-device='phone'] .main {
        height: var(--sheet-h);
        transform: translateY(var(--sheet-y));
      }
      [data-device='phone'] .pills-anchor {
        top: calc(var(--sheet-gap) + var(--sheet-y) - 12px - 44px);
      }
      .dock-bar {
        bottom: max(12px, calc(env(safe-area-inset-bottom) - 6px));
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
      }
    </style>
    <script>
      // stub of the workbench shell: one fixed state, the frame scripts reach it as parent.MockupShell
      (() => {
        const lang = new URLSearchParams(location.search).get('lang') === 'de' ? 'de' : 'en';
        const state = {
          view: 'phone',
          lang,
          labels: 'off',
          variant: 'D',
          scenario: 'hilly',
          mode3d: 'off',
          colorBy: 'sport',
          popover: 'off',
        };
        const listeners = [];
        const root = document.documentElement;
        const apply = () => {
          root.lang = state.lang;
          for (const [k, v] of Object.entries(state)) root.dataset[k] = v;
          root.dataset.device = 'phone';
          for (const fn of listeners) fn(state, [root]);
        };
        window.MockupShell = {
          state,
          screens: () => [root],
          onChange: (fn) => {
            listeners.push(fn);
            fn(state, [root]);
          },
          onAction: () => {},
          set: (k, v) => {
            state[k] = v;
            apply();
          },
          hydrate: (values) => {
            for (const [k, v] of Object.entries(values)) state[k] = v;
            apply();
          },
          setOptions: () => {},
        };
        for (const [k, v] of Object.entries(state)) root.dataset[k] = v;
        root.dataset.device = 'phone';
        root.lang = lang;
      })();
    </script>
  </head>
  <body>
    <div id="map" class="map"></div>
    <div id="mapPins" class="map-pins"></div>
    <div id="mapError" class="map-error floating" hidden><span class="t-caption c-primary"></span></div>
    <main id="main" class="main"></main>
    <div id="pills" class="pills-anchor"></div>
    <div id="popHost"></div>
    <div id="dock"></div>
    <script src="srcdoc-worker-fix.js"></script>
    <script src="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/deck.gl@9.2.9/dist.min.js"></script>
    <script src="data/darkMatter.style.js"></script>
    <script src="data/tracks.js"></script>
    <script src="core.js"></script>
    <script src="ui.js"></script>
    <script src="maps.js"></script>
    <script src="screen.js"></script>
  </body>
</html>
