    <template id="mockup-panel-tech" data-label="Tech"><div class="tech">
<p>Claims from <code>research/tech.md</code> (§ cited); <em>verified here</em> = observed while building this mockup with the real libraries.</p>
<section data-tech="D">
  <h3>D · MapLibre terrain, 3D as a switch (Q13, Q34)</h3>
  <p><strong>2D code untouched.</strong> The 2D session map is today's: deck.gl <code>session-detail</code> PathLayer, lap layers and <code>hovered-point</code> through <code>MapboxOverlay</code> with <code>pickingRadius</code> 25 and the pointer cursor on the track, today's flags (<code>MapBackground.tsx:86-88</code>: no drag rotate, no pitch), Shift+drag box zoom, double-click zoom, no zoom-out limit, the chart dot jumps.</p>
  <p><strong>3D, two code paths.</strong> In 3D the session track, laps and hover dot are MapLibre <code>line</code>/<code>circle</code> layers (one GeoJSON feature per record segment, <code>tolerance: 0</code>) draped on Mapterhorn terrain; deck.gl draws nothing session-related. Track, lap, hover and pick logic exist twice (deck in 2D, MapLibre in 3D): the accepted cost of keeping 2D untouched (Q34).</p>
  <h3>Pros</h3>
  <ul><li>2D risk-free; the 3D look every comparable product has (ux.md §1); MapLibre ships terrain, no new deps (§4 V5).</li></ul>
  <h3>Cons</h3>
  <ul><li>Fourth external service (<code>apps/web/CLAUDE.md:28</code>); a second rendering path for the session layers; heavier on phones; offline needs cached DEM tiles (§4 V5). Track height is the DEM's, not the device's (§3).</li></ul>
  <h3>Tech (3D)</h3>
  <ul>
    <li><strong>Switch (Q36).</strong> Pill shows the current mode ("2D" / "3D"); popover/drawer "Map view" with 2D "Flat map" and 3D "Terrain from Mapterhorn"; 3D disabled with "No terrain data" when DEM tiles are unavailable (Q7).</li>
    <li><strong>Terrain.</strong> <code>raster-dem</code> Mapterhorn (<code>tiles.mapterhorn.com/{z}/{x}/{y}.webp</code>, Terrarium, 512 px, <code>maxzoom</code> 16: z17 answered 404 along the route) + <code>setTerrain({ exaggeration: 1 })</code> (Q5) + hillshade under the roads: shadow <code>#000000</code>, highlight white 10 %, <code>hillshade-exaggeration</code> 0.6 (Q11; the no-grey map rule of <code>apps/web/CLAUDE.md</code> §3 accepted for shading). Added on entering 3D, removed on leaving (Q15). SW <code>CacheFirst</code> cache <code>mapterhorn-dem</code> like <code>carto-tiles</code> (Q16; described, not in the mockup).</li>
    <li><strong>Entering 3D (Q37).</strong> Fit to the session, north up, 30° tilt, 1.2 s like today's session fit. <em>Measured on an Apple M5:</em> building the 37,808 segment features, the GeoJSON source and the terrain costs one ~120 ms main-thread frame; idle after ~1.7 s including the ease. On mid-range phones this frame is likely several times longer (not measured) — a risk of per-segment features for long activities.</li>
    <li><strong>Camera fits with terrain.</strong> <em>Verified here:</em> MapLibre's <code>easeTo</code> cannot take a target elevation (5.18): it samples the centre height from DEM tiles of the zooms it passes (0 m where a tile is not loaded) and, without <code>freezeElevation</code>, keeps that value — the camera ended inside the mountain; with <code>freezeElevation</code> plus a height settle afterwards the lap drifted into place, more the higher the lap (10–12 px on laps at 1,940–2,070 m, ~2 px in the 850 m valley). Now the target is computed without moving the map (<code>cameraForBounds</code> with the page padding kept on the map, 0.4 zoom out when pitched) and gets the ground height at its centre (<code>queryTerrainElevation</code>, fallback median record elevation); the ease is one <code>jumpTo</code> per frame interpolating centre (screen-linear weight, as MapLibre's own ease), zoom, pitch, bearing and <code>elevation</code>, with centre clamping off for its duration. Measured: the lap's screen box moves toward its final place every frame (≤ 0.7 px back-steps) on valley and summit laps, 0 px correction after the ease. A user gesture cancels it.</li>
    <li><strong>Lap step jumped first (owner report).</strong> Cause: every fit began with <code>setPadding({0})</code> (part of the round-2 pitched-fit workaround), itself a camera jump to "somewhere else", and the lap highlight came from a <code>setData</code> through the GeoJSON worker, a few frames late. Now the padding sits on the map and changes only with the layout, and the lap highlight / hover is <code>setFeatureState</code> on the track's segment features (visible the next frame). Recorded per frame for ‹ and › in 2D and 3D: the camera moves monotonically to the target and the new lap is highlighted from the first frame.</li>
    <li><strong>Laps (Q29, Q40).</strong> Hover white 3 px, selected white casing (12 m × 1.6, min 9 px) + lap in track colours (min 5 px), rest dimmed 0.8 — draped. Click/tap on the track selects the lap under it like 2D: <code>queryRenderedFeatures</code> in a 25 px box (<code>PICK_RADIUS</code>) on <code>session-detail-line</code>, each segment feature carries its record index, the nearest hit → <code>lapIndexAtRecord</code>; hover shows the pointer and the lap highlight; beside the track nothing happens. Selecting frames the lap at the current pitch and bearing (max zoom 16, 800 ms like today's lap fit); deselect frames the session at the same angle (1.2 s). </li>
    <li><strong>Lap switch cost (app risk).</strong> <em>Measured on an Apple M5 (both frames):</em> the first version rebuilt all 37,808 GeoJSON features to dim the rest of the track when a lap was selected or cleared: a ~195 ms frozen frame in 3D. Now every feature carries its full and dimmed colour and the dim is a <code>setPaintProperty('line-color', ['get', 'd'])</code>: select/clear/switch ≈ 17–32 ms synchronous, no frame over 50 ms in 2D or 3D. The app's planned 3D layers need the same: never rebuild the track source for a lap change, and show the lap through feature state, not setData/setFilter. The app's lap fit (<code>useMapCameraEffect.ts</code>, <code>fitBounds</code> 800 ms) is a MapLibre ease: on terrain it hits the same elevation sampling (camera under ground or drift that grows with height) and needs the elevation-aware ease above in 3D; its 2D path is unaffected.</li>
    <li><strong>Orbit (Q23, Q25, Q26), 3D only.</strong> Shift, Ctrl or Cmd + left drag: horizontal turns (0.4°/px), vertical tilts (0.3°/px) around the map point grabbed (terrain-aware <code>map.unproject</code>); <code>jumpTo({ bearing, pitch })</code> then <code>panBy</code> re-anchoring; moves that would shift the centre more than 20 km are rejected (pivot near the horizon). Box zoom is off in 3D only; in 2D Shift+drag is box zoom as today. Detail pages only.</li>
    <li><strong>Touch (Q31).</strong> Two-finger twist rotates around the finger midpoint, two-finger vertical drag tilts around the map centre (<em>verified in maplibre-gl 5.18.0</em>: <code>TwoFingersTouchRotateHandler</code> returns <code>pinchAround</code>; <code>TwoFingersTouchPitchHandler</code> returns only <code>pitchDelta</code>, so <code>around = transform.centerPoint</code>). Twist already rotates in today's 2D (<code>touchZoomRotate</code> on).</li>
    <li><strong>Limits.</strong> Max tilt 60° (Q33, MapLibre's default; above 60° is experimental, tech.md §1a). Zoom-out limit fit − 2 in 3D only (Q18; dropped in 2D by Q35). Double-click does nothing in 3D (Q28).</li>
    <li><strong>Chart dot (Q39).</strong> Jumps to the record under the chart cursor in 2D and 3D.</li>
    <li><strong>Record vs DEM height</strong> (your file, every 5th record, z14): median +3.4 m, 5–95 % −12.8 … +18.1 m, extremes ±43 m; draping hides it, the chart keeps the record elevation.</li>
    <li>Effort: L. Risks: two code paths for session layers; tile volume (≈20–60 DEM tiles per pitched view, estimate, §1c); <code>@deck.gl/maplibre</code> 9.4 does not drape deck layers either (RFC #10758 open), so 3D stays on MapLibre layers.</li>
  </ul>
</section>
