const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

class MapEngine {
  constructor(el, opts) {
    this.el = el; this.opts = opts || {}; this.dpr = Math.min(2, window.devicePixelRatio || 1);
    const mk = (cls) => { const c = document.createElement('canvas'); c.className = 'absolute inset-0 h-full w-full ' + cls; el.appendChild(c); return c; };
    this.base = mk(''); this.glow = mk('map-glow'); this.core = mk('map-core');
    this.cam = { x: (REGION_BBOX[0] + REGION_BBOX[2]) / 2, y: (REGION_BBOX[1] + REGION_BBOX[3]) / 2, z: 9.6 };
    this.camAnim = null; this.fitReq = null; this.layers = []; this.w = 0; this.h = 0; this.baseDirty = true; this.running = false;
    this.tick = this.tick.bind(this);
    this.ro = new ResizeObserver(() => this.resize()); this.ro.observe(el); this.resize();
    el.style.cursor = 'grab'; el.style.touchAction = 'none';
    let drag = null;
    el.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; el.setPointerCapture(e.pointerId); this.camAnim = null; el.style.cursor = 'grabbing'; });
    el.addEventListener('pointermove', (e) => {
      if (!drag) return; const S = 256 * 2 ** this.cam.z;
      this.cam = { ...this.cam, x: this.cam.x - (e.clientX - drag.x) / S, y: this.cam.y - (e.clientY - drag.y) / S };
      drag = { x: e.clientX, y: e.clientY }; this.baseDirty = true; this.kick();
    });
    const end = () => { drag = null; el.style.cursor = 'grab'; };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('wheel', (e) => {
      e.preventDefault(); const r = el.getBoundingClientRect();
      const px = e.clientX - r.left - this.w / 2, py = e.clientY - r.top - this.h / 2;
      const S0 = 256 * 2 ** this.cam.z, wx = this.cam.x + px / S0, wy = this.cam.y + py / S0;
      const z = clamp(this.cam.z - e.deltaY * 0.0025, 8, 15), S1 = 256 * 2 ** z;
      this.cam = { x: wx - px / S1, y: wy - py / S1, z }; this.camAnim = null; this.baseDirty = true; this.kick();
    }, { passive: false });
  }
  resize() {
    const w = this.el.clientWidth, h = this.el.clientHeight; if (!w || !h) return;
    this.w = w; this.h = h;
    for (const c of [this.base, this.glow, this.core]) { c.width = Math.round(w * this.dpr); c.height = Math.round(h * this.dpr); }
    if (this.fitReq) this.cam = this.fitCam(this.fitReq.bbox, this.fitReq.pad);
    this.camAnim = null; this.baseDirty = true; this.kick();
  }
  fitCam(b, pad) {
    const aw = Math.max(40, this.w - pad.l - pad.r), ah = Math.max(40, this.h - pad.t - pad.b);
    const bw = b[2] - b[0] || 1e-6, bh = b[3] - b[1] || 1e-6;
    const z = Math.log2(Math.min(aw / bw, ah / bh) / 256), S = 256 * 2 ** z;
    return { x: (b[0] + b[2]) / 2 - (pad.l + aw / 2 - this.w / 2) / S, y: (b[1] + b[3]) / 2 - (pad.t + ah / 2 - this.h / 2) / S, z };
  }
  fit(bbox, pad, ms) {
    this.fitReq = { bbox, pad }; if (!this.w) return;
    const to = this.fitCam(bbox, pad);
    if (ms > 0) this.camAnim = { from: { ...this.cam }, to, t0: performance.now(), ms };
    else { this.cam = to; this.camAnim = null; }
    this.baseDirty = true; this.kick();
  }
  setLayer(name, passes, mode, delay) {
    this.layers = this.layers.filter((l) => l.name !== name);
    if (passes) this.layers.push({ name, passes, mode, t0: performance.now() + (delay || 0), fade: null });
    this.kick();
  }
  has(name) { return this.layers.some((l) => l.name === name && !l.fade); }
  fadeOut(name, ms) { for (const l of this.layers) if (l.name === name && !l.fade) l.fade = { t0: performance.now(), ms }; this.kick(); }
  kick() { if (!this.running) { this.running = true; requestAnimationFrame(this.tick); } }
  tick(now) { const busy = this.draw(now); if (busy) requestAnimationFrame(this.tick); else this.running = false; }
  xf() { const S = 256 * 2 ** this.cam.z; return { S, ox: this.w / 2 - this.cam.x * S, oy: this.h / 2 - this.cam.y * S }; }
  drawBase() {
    const c = this.base.getContext('2d'); const d = this.dpr; c.setTransform(d, 0, 0, d, 0, 0);
    c.fillStyle = '#0e0e0e'; c.fillRect(0, 0, this.w, this.h);
    const { S, ox, oy } = this.xf(); const X = (p) => ox + p[0] * S, Y = (p) => oy + p[1] * S;
    const z = this.cam.z;
    c.fillStyle = '#2C353C';
    for (const poly of BASE.lakes) { c.beginPath(); poly.forEach((p, i) => (i ? c.lineTo(X(p), Y(p)) : c.moveTo(X(p), Y(p)))); c.closePath(); c.fill(); }
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.strokeStyle = 'rgba(63, 90, 109, 1)'; c.lineWidth = clamp(1.2 * 2 ** (z - 10), 1, 4);
    for (const r of BASE.rivers) { c.beginPath(); r.forEach((p, i) => (i ? c.lineTo(X(p), Y(p)) : c.moveTo(X(p), Y(p)))); c.stroke(); }
    const mA = clamp((z - 8.8) / 2.2, 0.12, 0.6);
    c.strokeStyle = `rgba(65, 71, 88, ${mA})`; c.lineWidth = clamp(0.5 * 2 ** (z - 10.5), 0.4, 1.4);
    c.beginPath(); const m = BASE.minor;
    for (let i = 0; i < m.length; i += 4) { c.moveTo(ox + m[i] * S, oy + m[i + 1] * S); c.lineTo(ox + m[i + 2] * S, oy + m[i + 3] * S); }
    c.stroke();
    c.strokeStyle = 'rgba(83, 86, 102, 0.85)'; c.lineWidth = clamp(0.9 * 2 ** (z - 10), 0.8, 2.4);
    c.beginPath(); for (const r of BASE.major) r.forEach((p, i) => (i ? c.lineTo(X(p), Y(p)) : c.moveTo(X(p), Y(p)))); c.stroke();
    if (!this.opts.noLabels) {
      c.textAlign = 'center'; c.textBaseline = 'middle';
      for (const t of BASE.towns) {
        const x = X(t.p), y = Y(t.p); if (x < -60 || y < -20 || x > this.w + 60 || y > this.h + 20) continue;
        c.font = t.big ? '600 13px ui-sans-serif, system-ui, sans-serif' : '500 10px ui-sans-serif, system-ui, sans-serif';
        c.lineWidth = 3; c.strokeStyle = '#222'; c.strokeText(t.name, x, y);
        c.fillStyle = t.big ? 'rgba(204, 208, 228, 0.75)' : 'rgba(154, 153, 153, 0.8)'; c.fillText(t.name, x, y);
      }
    }
  }
  draw(now) {
    let busy = false;
    if (this.camAnim) {
      const a = this.camAnim, f = Math.min(1, (now - a.t0) / a.ms), e = easeInOut(f);
      this.cam = { x: a.from.x + (a.to.x - a.from.x) * e, y: a.from.y + (a.to.y - a.from.y) * e, z: a.from.z + (a.to.z - a.from.z) * e };
      if (f >= 1) this.camAnim = null; else busy = true;
      this.baseDirty = true;
    }
    if (!this.w) return busy;
    if (this.baseDirty) { this.drawBase(); this.baseDirty = false; }
    const c = this.core.getContext('2d'); const d = this.dpr;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, this.core.width, this.core.height); c.setTransform(d, 0, 0, d, 0, 0);
    c.globalCompositeOperation = 'lighter'; c.lineCap = 'round'; c.lineJoin = 'round';
    const { S, ox, oy } = this.xf();
    c.lineWidth = clamp(1.7 * 2 ** ((this.cam.z - 10.5) * 0.6), 1.4, 4.5) * (this.opts.widthScale || 1);
    for (const l of this.layers) {
      let lo = 1;
      if (l.fade) { const f = (now - l.fade.t0) / l.fade.ms; lo = Math.max(0, 1 - f); if (f < 1) busy = true; }
      if (lo <= 0) continue;
      for (const p of l.passes) {
        const t = now - l.t0 - p.start; if (t <= 0) { busy = true; continue; }
        const frac = easeOut(Math.min(1, t / p.dur)); if (frac < 1) busy = true;
        const a = 1;
        c.strokeStyle = `rgba(${p.rgb[0]},${p.rgb[1]},${p.rgb[2]},${(80 / 255) * a * lo})`;
        const P = p.pts, target = frac * p.total;
        c.beginPath(); c.moveTo(ox + P[0][0] * S, oy + P[0][1] * S);
        for (let i = 1; i < P.length; i++) {
          if (p.cum[i] <= target) { c.lineTo(ox + P[i][0] * S, oy + P[i][1] * S); continue; }
          const seg = p.cum[i] - p.cum[i - 1], k = seg > 0 ? (target - p.cum[i - 1]) / seg : 0;
          c.lineTo(ox + (P[i - 1][0] + (P[i][0] - P[i - 1][0]) * k) * S, oy + (P[i - 1][1] + (P[i][1] - P[i - 1][1]) * k) * S);
          break;
        }
        c.stroke();
      }
    }
    const g = this.glow.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, this.glow.width, this.glow.height); g.drawImage(this.core, 0, 0);
    this.layers = this.layers.filter((l) => !(l.fade && now - l.fade.t0 > l.fade.ms));
    return busy;
  }
}

const MapCanvas = (p) => {
  const ref = useRef(null);

const validate = (f, t) => {
  const e = {}; const rest = num(f.restHr), max = num(f.maxHr);
  const range = (k, v, lo, hi, minK, maxK) => { if (v === undefined) return; if (Number.isNaN(v)) e[k] = t('required'); else if (v < lo) e[k] = t(minK, { value: lo }); else if (v > hi) e[k] = t(maxK, { value: hi }); };
  if (f.gender === '') e.gender = t('required');
  if (rest === undefined) e.restHr = t('required'); else range('restHr', rest, 30, 100, 'min_bpm', 'max_bpm');
  if (max === undefined) e.maxHr = t('required'); else range('maxHr', max, 120, 230, 'min_bpm', 'max_bpm');
  if (!e.maxHr && !e.restHr && rest !== undefined && max !== undefined && max <= rest) e.maxHr = t('max_hr_greater');
  range('ftp', num(f.ftp), 50, 500, 'min_watts', 'max_watts');
  return e;
};

const shouldDismiss = (m) => m.offset > 0.3 * m.height || m.velocity > 500;
const PhoneDialog = (p) => {
  const ctx = p.ctx; const intro = ctx.step === 'intro';
  const cardRef = useRef(null); const bodyRef = useScrollFade();

  const onDown = (e) => { e.currentTarget.setPointerCapture(e.pointerId); setDrag({ y0: e.clientY, last: e.clientY, t: performance.now(), v: 0, moved: false }); };
  const onMove = (e) => {
    if (!drag) return; const now = performance.now(); const dy = e.clientY - drag.y0;
    const v = ((e.clientY - drag.last) / Math.max(1, now - drag.t)) * 1000;
    setDrag({ ...drag, last: e.clientY, t: now, v, moved: drag.moved || Math.abs(dy) > 4 });
    setY(dy < 0 ? dy * 0.08 : dy); // dragElastic top: 0 (no upward travel beyond a little elastic)
  };
  const onUp = () => {
    if (!drag) return; const d = drag; setDrag(null);
    if (!d.moved) { setY(0); close(); return; } // tap on the grabber = DialogPrimitive.Close
    const height = cardRef.current ? cardRef.current.offsetHeight : 600;
    if (shouldDismiss({ offset: y, velocity: d.v, height })) { setY(height + 12); setTimeout(() => { close(); setY(0); }, 260); }

// ---------- app ----------
const App = () => {

  const [form, setForm] = useState(EMPTY_FORM);
  const [touched, setTouched] = useState({});
  const [keyInput, setKeyInput] = useState('');
  const [keyCheck, setKeyCheck] = useState(null);
  const [imp, setImp] = useState({ preparing: true, processed: 0, total: 0 });
  const [leaving, setLeaving] = useState(false);
  const engine = useRef(null), keyTimers = useRef([]), lastScene = useRef(''), lastCam = useRef('');
  const [, setEngTick] = useState(0);

  useEffect(() => {
    const h = (e) => { if (e.data && e.data.type === 'state') setSt(e.data.state); };
    window.addEventListener('message', h); parent.postMessage({ type: 'ready' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);
  useEffect(() => { if (st) document.documentElement.lang = st.lang; }, [st && st.lang]);
  useEffect(() => { if (st) setKeyCheck(null); }, [st && st.outcome]);
  const set = (patch) => parent.postMessage({ type: 'set', patch }, '*');

  // First start: the loader covers the lazy import + decode of demoRoutes.json.
  // Minimum = one full L3 cycle. Hand-off happens only at a cycle boundary (all strokes retracted),
  // the first one at or after max(dataReady, LOGO_CYCLE_MS): fast device → 3.0 s, slow device → 6.0 s.
  const loadKey = st ? [st.step, st.replay, st.auto, st.speed, st.device].join('|') : '';
  useEffect(() => {
    if (!st || st.step !== 'loading') { setLeaving(false); return; }
    setLeaving(false);
    if (!st.auto) return;
    const handoff = handoffAt(DATA_READY_MS[st.speed]);
    const t1 = setTimeout(() => setLeaving(true), handoff);
    const t2 = setTimeout(() => set({ step: 'intro', auto: false, sheet: 'sheet' }), handoff + 500);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, [loadKey]);

  const impKey = st ? [st.step, st.path, st.outcome, st.replay].join('|') : '';
  useEffect(() => {
    if (!st || st.step !== 'importing') return;
    const total = countFor(st.path, st.outcome); const slow = st.outcome === 'slow';
    setImp({ preparing: true, processed: 0, total });
    let iv, to2; const start = performance.now() + 600;
    const to = setTimeout(() => {
      iv = setInterval(() => {
        const el = performance.now() - start;
        const processed = slow ? Math.min(total, Math.floor(el / 140)) : Math.min(total, Math.round(total * Math.min(1, el / 1800)));
        setImp({ preparing: false, processed, total });
        if (processed >= total) { clearInterval(iv); to2 = setTimeout(() => set({ step: 'summary' }), 400); }

  }, [impKey]);

    const e = engine.current; if (!st || !e) return;

      return;
    }
    if (st.step !== 'done') {
      const key = ['preview', st.device, st.replay].join('|');
      if (lastScene.current !== key) {
        lastScene.current = key; lastCam.current = '';
        e.setLayer('user', null); e.fit(REGION_BBOX, cameraPad(st), 0);
        e.setLayer('preview', scene('preview').passes, 'draw', 200);
      }
      const camKey = [st.step === 'intro', st.device === 'phone' ? st.sheet : ''].join('|');
      if (lastCam.current !== camKey) { const first = lastCam.current === ''; lastCam.current = camKey; e.fit(REGION_BBOX, cameraPad(st), first ? 0 : 900); }

      return;
    }
    const key = ['done', st.device, st.replay, st.path, st.outcome].join('|');

        const sc = scene(userScene(st.path, st.outcome));
        const dpad = st.device === 'desktop' ? { l: 80, r: 80, t: 60, b: 60 } : { l: 24, r: 24, t: 60, b: 60 };

  const errors = validate(form, t);
  const idx = st.steps.indexOf(st.step);
  const importStep = st.steps.find((s) => IMPORT_STEPS.includes(s)) || 'source';
  const ctx = {
    st, t, nf, locale, set, form, touched, errors, keyInput, keyCheck, imp, importStep,
    desk: st.device === 'desktop', step: shownStep(st),
    setField: (k, v) => setForm((f) => ({ ...f, [k]: v })),
    touch: (k) => setTouched((x) => ({ ...x, [k]: true })),
    setKey: (v) => {
      setKeyInput(v); keyTimers.current.forEach(clearTimeout); keyTimers.current = [];

    closeSummary: () => set(st.outcome === 'error' ? { step: importStep === 'source' ? 'source' : importStep, failed: false } : { step: 'done' }),
  };

  const loading = st.step === 'loading';
  const intro = st.step === 'intro';

    <${MapCanvas} onEngine=${(e) => { engine.current = e; setEngTick((x) => x + 1); }} />
    ${!loading && html`<div key=${st.device + st.replay} class=${cn('ob-layer absolute inset-0 pointer-events-none', done && 'gone')}>
      ${ctx.desk && html`<div class="pointer-events-auto">${intro ? html`<${IntroCardDesktop} ctx=${ctx} />` : html`<${FlowCardDesktop} ctx=${ctx} />`}</div>`}
    </div>`}
    ${!loading && !done && !ctx.desk && (st.sheet === 'hero' ? html`<${ReopenPill} ctx=${ctx} />` : html`<${PhoneDialog} key=${st.step} ctx=${ctx} />`)}
    ${(st.step === 'importing' || st.step === 'summary') && html`<${ImportOverlay} ctx=${ctx} />`}
    ${loading && html`<${LogoLoader} key=${st.replay + '|' + st.device} leaving=${leaving} label=${t('loading')} />`}
  </div>`;
};

render(html`<${App} />`, document.getElementById('app'));
</script>

<script src="../../_shared/mockup-shell.js"></script>
<script>
(() => {
  // Host side of the screens' postMessage protocol: S is the flow state the iframes render.
  // The shell toolbar edits S through onChange; changes made inside a frame flow back via sync().
  const STEPS = (path) => {
    if (path === 'demo') return ['loading', 'intro', 'source', 'importing', 'summary', 'done'];
    return ['loading', 'intro', 'source', 'b-you', 'b-bike', path === 'intervals' ? 'connect' : 'upload', 'importing', 'summary', 'done'];
  };
  const STEP_LABEL = { loading: 'First-start loading', intro: 'Intro', source: 'Source', 'b-you': 'You & heart', 'b-bike': 'Bike', connect: 'Connect', upload: 'Upload', importing: 'Importing (overlay)', summary: 'Summary (overlay)', done: 'Done' };
  const OUTCOMES = [['gps', 'With GPS'], ['indoor', 'No GPS'], ['error', 'Error'], ['slow', 'Slow'], ['many', '2,000']];
  const stepOptions = (path) => STEPS(path).map((s, i) => ({ id: s, label: i + ' ' + STEP_LABEL[s] }));
  // Demo has no "No GPS" and no "2,000": those two leave the list while Demo is picked.
  const outcomeOptions = (path) => OUTCOMES.map(([id, label]) => ({ id, label, disabled: path === 'demo' && (id === 'indoor' || id === 'many') }));

  const S = { lang: 'en', path: 'intervals', outcome: 'gps', step: 'loading', speed: 'fast', sheet: 'sheet', replay: 0, failed: false, picked: false, auto: true };
  S.steps = STEPS(S.path);

  const frame = (d) => document.querySelector('iframe.ms-screen[data-device="' + d + '"]');
  const ready = { desktop: false, phone: false };
  const broadcast = () => { for (const d of ['desktop', 'phone']) if (ready[d]) frame(d).contentWindow.postMessage({ type: 'state', state: { ...S, device: d } }, '*'); };
  window.addEventListener('message', (e) => {
    const d = e.source === frame('desktop').contentWindow ? 'desktop' : e.source === frame('phone').contentWindow ? 'phone' : null;
    if (!d || !e.data) return;
    if (e.data.type === 'ready') { ready[d] = true; broadcast(); }
    if (e.data.type === 'set') apply(e.data.patch, 'frame');
  });

  let syncing = false;
  let optionsPath = S.path;
  const sync = () => {
    syncing = true;
    if (optionsPath !== S.path) {
      optionsPath = S.path;
      MockupShell.setOptions('step', stepOptions(S.path));
      MockupShell.setOptions('outcome', outcomeOptions(S.path));
    }
    MockupShell.hydrate({ lang: S.lang, scenario: S.path, outcome: S.outcome, step: S.step, speed: S.speed, sheet: S.sheet === 'sheet' ? 'on' : 'off' });
    syncing = false;
  };
  const apply = (patch, from) => {
    Object.assign(S, patch);
    if (S.path === 'demo' && (S.outcome === 'indoor' || S.outcome === 'many')) S.outcome = 'gps';
    S.steps = STEPS(S.path);
    if (!S.steps.includes(S.step)) S.step = S.steps[2];
    if (from === 'toolbar') {
      if ('step' in patch) { S.auto = false; S.sheet = 'sheet'; }
      if ('step' in patch || 'path' in patch) S.picked = S.steps.indexOf(S.step) > 2;
      S.failed = S.outcome === 'error' && S.step === 'connect';
    }
    window.__S = S;
    broadcast(); sync();
  };
  const restart = (patch) => apply({ replay: S.replay + 1, step: 'loading', auto: true, picked: false, failed: false, ...patch }, 'frame');

  MockupShell.onChange((st) => {
    if (syncing) return;
    if (st.speed !== S.speed) return restart({ speed: st.speed });
    const patch = {};
    if (st.lang !== S.lang) patch.lang = st.lang;
    if (st.scenario !== S.path) patch.path = st.scenario;
    if (st.outcome !== S.outcome) patch.outcome = st.outcome;
    if ((st.sheet === 'on' ? 'sheet' : 'hero') !== S.sheet) patch.sheet = st.sheet === 'on' ? 'sheet' : 'hero';
    if (st.step !== S.step) {
      patch.step = st.step;
      if (st.step === 'done' || st.step === 'intro') patch.replay = S.replay + 1;
    }
    if (Object.keys(patch).length) apply(patch, 'toolbar');
  });
  MockupShell.onAction('replay', () => restart({ sheet: 'sheet' }));
})();
</script>
